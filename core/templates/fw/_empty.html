{% comment %}Einheitlicher Leerzustand mit Handlungsaufforderung.
Parameter: icon (fa-Klasse), titel, subtext, cta_url (optional), cta_label (optional){% endcomment %}
<div class="py-12 text-center">
    <span class="w-14 h-14 rounded-2xl fw-markenflaeche fw-marke flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid {{ icon|default:'fa-inbox' }} text-xl"></i>
    </span>
    <p class="font-semibold fw-strong">{{ titel }}</p>
    {% if subtext %}<p class="text-sm fw-faint mt-1 max-w-sm mx-auto">{{ subtext }}</p>{% endif %}
    {% if cta_url %}
    <a href="{{ cta_url }}" class="inline-flex items-center gap-2 mt-4 fw-btn fw-primary text-sm font-semibold px-4 py-2 rounded-lg">
        <i class="fa-solid fa-plus"></i>{{ cta_label|default:'Erfassen' }}
    </a>
    {% endif %}
</div>
