        /* Das schlanke Auswahlfeld im Aktenkopf (E2.70) — fuer den
           Zustaendigkeitswechsel am Fall. Ohne eigenen Rahmen, damit es sich
           in die Kopfzeile fuegt und nicht wie ein Formular aussieht. */
        .fw-feld-schlank{border:0;background:none;padding:0;font-weight:700;
              color:var(--ds-ink);font-size:13px;max-width:150px;
              text-overflow:ellipsis;cursor:pointer}
        .fw-feld-schlank:hover{color:var(--ds-brand)}

        /* Der Vertretungssatz aus Konzept v7 (E2.69). Fliesstext, nicht Zeile:
           Er richtet sich an EINE Person und liest sich als Anrede. */
        .fw-vertretungssatz{padding:11px 15px;font-size:13px;line-height:1.5;
              color:var(--ds-muted);border-bottom:1px solid var(--ds-line)}
        .fw-vertretungssatz b{color:var(--ds-ink);font-weight:700}
        /* ============================================================
           DIE HUELLE NACH KONZEPT-V8 (Redesign 30.09.2026)

           Quelle: mockups/konzept-v8-cockpit.html. Helle Leiste links
           (236 px), eine Kopfzeile, die beim Scrollen stehen bleibt und
           leicht durchscheint, Inhalt bis 1440 px. Unter 1024 px faellt
           die Leiste weg und die Tab-Leiste unten uebernimmt die fuenf
           Bereiche; die Leiste bleibt als Schublade fuer die Unterpunkte.

           Die Ids (`fwSidebar`, `fwBackdrop`, `fwProfil`, `fwPalette`,
           `fw-toasts`) sind dieselben wie vorher — Skripte, Tests und die
           Regeln fuer `_sbc` und `_embed` haengen daran.
           ============================================================ */
        .fw-body{margin:0;background:var(--ds-bg);color:var(--ds-ink)}
        .fw-app{display:flex;min-height:100vh;min-height:100dvh}
        .fw-side{position:sticky;top:0;height:100vh;height:100dvh;width:236px;flex:0 0 236px;
            display:flex;flex-direction:column;gap:2px;padding:18px 12px 12px;
            border-right:1px solid var(--ds-line);background:var(--ds-surface);z-index:50;
            transition:transform .22s var(--ds-ease),width .18s var(--ds-ease)}
        .fw-side-kopf{display:flex;align-items:center;gap:10px;padding:4px 8px 16px 10px}
        .fw-marke-zeichen{width:30px;height:30px;border-radius:var(--ds-radius-knopf);background:var(--ds-brand);
            color:var(--ds-auf-satt);display:grid;place-items:center;font-weight:700;font-size:13px;
            letter-spacing:-.02em;text-decoration:none;flex:0 0 30px}
        .fw-marke-text{min-width:0;flex:1;line-height:1.25}
        .fw-marke-text a{font-weight:700;font-size:15px;letter-spacing:-.02em;color:var(--ds-ink);text-decoration:none}
        .fw-marke-text small{display:block;font-size:12px;color:var(--ds-faint);font-weight:500;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .fw-side-knopf{width:28px;height:28px;border-radius:var(--ds-radius-sm);display:grid;place-items:center;
            color:var(--ds-faint);background:none;border:0;cursor:pointer;flex:0 0 28px;transition:background .12s,color .12s}
        .fw-side-knopf:hover{background:var(--ds-hover);color:var(--ds-ink)}
        .fw-mandant{padding:0 10px 12px}
        .fw-mandant label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;
            text-transform:uppercase;color:var(--ds-faint);margin-bottom:4px}
        .fw-mandant select{width:100%}
        .fw-nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-bottom:8px}
        .fw-nav-eintrag{display:flex;align-items:center;gap:11px;width:100%;padding:8px 12px;
            border-radius:var(--ds-radius-sm);color:var(--ds-muted);font-weight:500;font-size:14px;
            text-decoration:none;background:none;border:0;cursor:pointer;text-align:left;
            transition:background .12s,color .12s}
        .fw-nav-eintrag:hover{background:var(--ds-hover);color:var(--ds-ink)}
        .fw-nav-eintrag.hier{background:var(--ds-brand-soft);color:var(--ds-brand-600);font-weight:600}
        .fw-nav-eintrag .fw-zeichen{width:18px!important;height:18px!important}
        /* Zahl neben dem Bereich (konzept-v8 `.count`): leise grau, rot nur
           wo etwas brennt (`crit`: Heute, neue Schadenmeldungen). */
        .fw-nav-zahl{margin-left:auto;min-width:18px;font-size:12px;font-weight:600;line-height:18px;
            text-align:center;color:var(--ds-faint)}
        .fw-nav-zahl[hidden]{display:none}
        .fw-nav-eintrag.hier .fw-nav-zahl{color:var(--ds-brand-600)}
        .fw-nav-zahl.crit,.fw-nav-eintrag.hier .fw-nav-zahl.crit{padding:0 7px;border-radius:var(--ds-pill);
            background:var(--ds-crit);color:var(--ds-auf-satt)}
        .fw-zuletzt{display:flex;flex-direction:column;gap:2px}
        .fw-zuletzt-eintrag{font-size:14px}
        .fw-zuletzt-eintrag .truncate{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .fw-avatar.fw-avatar-klein{width:18px;height:18px;flex:0 0 18px;font-size:9px}
        html._sbc .fw-zuletzt,html._sbc #fwZuletztTitel{display:none}
        /* Mitteilungen: Punkt, sobald etwas im Zulauf wartet */
        .fw-pip{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:var(--ds-pill);
            background:var(--ds-crit);color:var(--ds-auf-satt);box-shadow:0 0 0 2px var(--ds-bg)}
        .fw-pip[hidden]{display:none}
        /* «Neuer Fall»: Art als Kapseln, das Optionsfeld selbst unsichtbar */
        .fw-auswahl label{cursor:pointer;position:relative}
        .fw-auswahl input{position:absolute;opacity:0;width:1px;height:1px}
        .fw-auswahl label:focus-within{box-shadow:0 0 0 3px var(--ds-brand-soft)}
        .fw-fallneu{display:flex;flex-direction:column;gap:16px}
        .fw-fallneu fieldset{border:0;margin:0;padding:0;min-width:0}
        .fw-nav-pfeil{margin-left:auto;padding:4px;margin-right:-4px;color:var(--ds-faint);display:flex}
        .fw-nav-pfeil .fw-zeichen{transition:transform .15s}
        .fw-nav-zahl + .fw-nav-pfeil{margin-left:4px}
        .fw-nav-unter{display:flex;flex-direction:column;gap:1px;padding:2px 0 6px 29px}
        .fw-nav-unter.hidden{display:none}
        .fw-nav-abschnitt{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
            color:var(--ds-faint);padding:10px 12px 4px}
        .fw-nav-unterpunkt{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--ds-radius-sm);
            font-size:13px;color:var(--ds-muted);text-decoration:none;transition:background .12s,color .12s}
        .fw-nav-unterpunkt:hover{background:var(--ds-hover);color:var(--ds-ink)}
        .fw-nav-unterpunkt.hier{color:var(--ds-ink);font-weight:600;background:var(--ds-hover)}
        .fw-nav-unterpunkt .fw-nav-zahl{margin-left:auto}
        .fw-side-fuss{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--ds-line);padding-top:8px}
        .fw-ich{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--ds-radius-sm);
            background:none;border:0;cursor:pointer;text-align:left;color:var(--ds-ink);transition:background .12s}
        .fw-ich:hover{background:var(--ds-hover)}
        .fw-ich span:last-child{min-width:0;line-height:1.3}
        .fw-ich b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .fw-ich small{display:block;font-size:12px;color:var(--ds-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .fw-avatar{width:30px;height:30px;border-radius:var(--ds-pill);display:grid;place-items:center;flex:0 0 30px;
            font-size:12px;font-weight:600;background:var(--ds-surface-2);border:1px solid var(--ds-line);color:var(--ds-muted)}

        .fw-haupt{flex:1;min-width:0;display:flex;flex-direction:column}
        .fw-taste{font-family:var(--ds-mono);font-size:12px;line-height:1.4;padding:1px 6px;border:1px solid var(--ds-line);
            border-bottom-width:2px;border-radius:var(--ds-radius-xs);color:var(--ds-faint);background:var(--ds-surface-2);
            cursor:pointer;white-space:nowrap}
        .fw-knopf-rund{width:36px;height:36px;border-radius:var(--ds-radius-knopf);display:grid;place-items:center;
            color:var(--ds-muted);background:none;border:0;cursor:pointer;position:relative;text-decoration:none;
            font-size:18px;transition:background .12s,color .12s,transform .08s}
        .fw-knopf-rund:hover{background:var(--ds-hover);color:var(--ds-ink)}
        .fw-knopf-rund:active{transform:scale(.94)}
        .fw-knopf-rund.hier{background:var(--ds-brand-soft);color:var(--ds-brand-600)}
        .fw-nur-mobil{display:none!important}
        .fw-inhalt{padding:28px 32px 56px;width:100%;max-width:1440px;margin:0 auto;min-width:0}

        /* Profilmenue: ein Element, zwei Ausloeser (Leiste unten, Kopfzeile am
           Telefon). Die Lage steht fest im Fenster statt am Ausloeser —
           so braucht es kein Skript, das Positionen rechnet. */
        .fw-profil{position:fixed;left:12px;bottom:72px;width:272px;z-index:70;background:var(--ds-surface);
            border:1px solid var(--ds-line);border-radius:var(--ds-radius);box-shadow:var(--ds-shadow-lg);padding:6px 0}
        .fw-profil-kopf{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;border-bottom:1px solid var(--ds-line);margin-bottom:6px}
        .fw-profil-name{min-width:0}
        .fw-profil-kopf b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .fw-profil-kopf small{display:block;font-size:12px;color:var(--ds-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .fw-profil-abschnitt{padding:6px 16px 8px}
        .fw-profil-titel{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ds-faint);margin-bottom:6px}
        .fw-segment{display:flex;gap:2px;padding:2px;border-radius:var(--ds-radius-sm);background:var(--ds-surface-2);border:1px solid var(--ds-line)}
        .fw-segment button{flex:1;padding:5px 8px;border-radius:var(--ds-radius-xs);border:0;background:none;cursor:pointer;
            font:inherit;font-size:13px;font-weight:600;color:var(--ds-muted);transition:background .12s,color .12s}
        .fw-segment button:hover{color:var(--ds-ink)}
        .fw-segment button.an,.fw-segment button[aria-pressed="true"]{background:var(--ds-surface);color:var(--ds-ink);box-shadow:var(--ds-shadow-sm)}
        .fw-profil-link{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:14px;color:var(--ds-ink);text-decoration:none}
        .fw-profil-link:hover{background:var(--ds-hover)}
        .fw-profil-link.crit{color:var(--ds-crit)}
        .fw-profil-link.crit:hover{background:var(--ds-crit-soft)}
        .fw-profil-link .fw-zeichen{color:var(--ds-faint)}
        .fw-profil-link.crit .fw-zeichen{color:var(--ds-crit)}
        .fw-profil-trenner{border-top:1px solid var(--ds-line);margin:6px 0}

        /* Meldungen: dunkle Leiste unten in der Mitte, wie im Mockup. Fehler
           und Warnungen tragen ihr Zeichen in der Zustandsfarbe und bleiben
           stehen, bis sie jemand wegklickt. */
        .fw-toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
            z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(460px,calc(100% - 32px))}
        .fw-toast{display:flex;align-items:flex-start;gap:12px;width:100%;padding:11px 10px 11px 16px;border-radius:var(--ds-radius);
            background:var(--ds-ink);color:var(--ds-surface);box-shadow:var(--ds-shadow-lg);font-size:14px;line-height:1.45;
            animation:fw-toast-ein .22s var(--ds-ease)}
        .fw-toast>.fw-zeichen{margin-top:3px;color:var(--ds-good)}
        .fw-toast.warn>.fw-zeichen{color:var(--ds-warn)}
        .fw-toast.crit>.fw-zeichen{color:var(--ds-crit)}
        .fw-toast.info>.fw-zeichen{color:var(--ds-info)}
        .fw-toast-text{flex:1;min-width:0}
        .fw-toast button{color:var(--ds-surface);background:none;border:0;cursor:pointer;padding:3px 6px;
            border-radius:var(--ds-radius-xs);opacity:.75;display:flex}
        .fw-toast button:hover{opacity:1;background:color-mix(in srgb,var(--ds-surface) 14%,transparent)}
        .fw-toast-rueck{display:contents}
        .fw-schnell-zuordnen{display:inline-flex;margin:0}
        html.fw-js .fw-ohne-js,html:not(.fw-js) .fw-nur-js{display:none}
        /* Dialog «Zahlung zuordnen» (UI-Zielbild): Karte mit vier wählbaren Wegen */
        .fw-zdlg{border:1px solid var(--ds-line);border-radius:var(--ds-radius-lg);padding:22px;width:min(520px,calc(100% - 32px));
            background:var(--ds-surface);color:var(--ds-ink);box-shadow:var(--ds-shadow-lg);margin:auto;max-height:calc(100% - 32px);overflow:auto}
        .fw-zdlg::backdrop{background:var(--ds-scrim)}
        .fw-zdlg h2{font-size:22px;font-weight:600;margin:0 0 4px}
        .fw-zdlg-sub{margin:0 0 14px;color:var(--ds-muted);font-size:14px}
        .fw-zopt{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px;border:1px solid var(--ds-line);
            border-radius:var(--ds-radius-sm);margin-bottom:8px;cursor:pointer;font-size:14px}
        .fw-zopt.on,.fw-zopt:has(input[type=radio]:checked){border-color:var(--ds-brand);background:var(--ds-brand-soft)}
        .fw-zopt small{grid-column:2;color:var(--ds-muted);font-size:13px}
        .fw-zopt input[type=radio]{margin-top:4px;accent-color:var(--ds-brand)}
        .fw-zopt select{grid-column:2;margin-top:8px;display:none;width:100%;min-width:0;max-width:100%}
        .fw-zopt.on select,.fw-zopt:has(input[type=radio]:checked) select{display:block}
        .fw-zdlg-knoepfe{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
        .fw-zdlg-hinweis{margin:6px 0 0;font-size:13px;color:var(--ds-muted)}
        .fw-zdlg-notiz{margin-top:16px;padding-top:14px;border-top:1px solid var(--ds-line);display:flex;flex-direction:column;gap:6px}
        .fw-zdlg-notizzeile{display:flex;gap:8px}.fw-zdlg-notizzeile .fw-feld{flex:1;min-width:0}
        /* Bankabgleich im Zielbild: Zeile mit Farbbalken, Name, Hinweis, grünem Betrag und einem Knopf */
        .fw-bzeile{display:grid;grid-template-columns:4px minmax(0,1fr) auto;align-items:center;gap:6px 14px;padding:14px 20px 14px 0;
            border-top:1px solid var(--ds-line)}
        .fw-bzeile:first-child{border-top:0}
        .fw-bzeile:has(.fw-bwahl){grid-template-columns:auto 4px minmax(0,1fr) auto}
        .fw-bwahl{margin-left:18px}
        .fw-bbalken{align-self:stretch;background:var(--ds-warn);color:var(--ds-auf-satt);border-top-right-radius:var(--ds-radius-xs);border-bottom-right-radius:var(--ds-radius-xs)}
        .fw-bbalken.crit{background:var(--ds-crit);color:var(--ds-auf-satt)}
        .fw-bzeile .fw-t{font-weight:600;font-size:15px}
        .fw-bhinweis{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
        .fw-brechts{display:flex;align-items:center;gap:14px}
        .fw-bzeile .fw-betrag{font-weight:700;color:var(--ds-good);white-space:nowrap}
        @media (max-width:640px){
            .fw-bzeile{grid-template-columns:4px minmax(0,1fr);padding-right:16px}
            .fw-bzeile:has(.fw-bwahl){grid-template-columns:auto 4px minmax(0,1fr)}
            .fw-bzeile>.fw-mitte,.fw-bzeile>.fw-brechts{grid-column:-2}
            .fw-bzeile>.fw-brechts{justify-content:space-between}
            .fw-bzeile>.fw-bbalken,.fw-bzeile>.fw-bwahl{grid-row:1 / span 2}
        }
        .fw-toast .fw-toast-knopf{font-weight:600;text-decoration:underline;text-underline-offset:3px;opacity:1;min-height:32px;padding:3px 10px}
        @keyframes fw-toast-ein{from{opacity:0;transform:translateY(8px)}}

        .fw-vorhang-mobil{position:fixed;inset:0;background:var(--ds-scrim);z-index:45}

        @media (max-width:1023px){
            .fw-side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-104%);box-shadow:var(--ds-shadow-lg)}
            .fw-side.offen{transform:none}
            .fw-nur-mobil{display:grid!important}
            .fw-nur-breit{display:none!important}
            .fw-profil{left:auto;right:12px;bottom:auto;top:60px}
        }
        @media (min-width:1024px){ .fw-vorhang-mobil{display:none} }
        @media (max-width:720px){
            .fw-phead h1{font-size:22px}
            .fw-lage>div{padding:14px 14px 12px}
            .fw-lage .fw-w{font-size:22px}
        }
        /* Zugeklappte Leiste auf dem Desktop (`_sbc`): nur die Zeichen. */
        @media (min-width:1024px){
            html._sbc #fwSidebar{flex-basis:72px}
            html._sbc #fwSidebar .fw-side-kopf{flex-direction:column;padding:4px 0 12px}
            html._sbc #fwSidebar .fw-nav-eintrag{padding:9px 0}
            html._sbc #fwSidebar .fw-ich{justify-content:center;padding:8px 0}
            html._sbc .fw-profil{left:12px}
        }
        @media (prefers-reduced-motion:reduce){
            .fw-side,.fw-toast,.fw-btn,.fw-knopf-rund{transition:none;animation:none}
        }
        /* Formularfelder im Dunkeln. Der Browser zeichnet `input`, `select`
           und `textarea` selbst; ohne diese Regel stehen helle Felder in einer
           dunklen Anwendung. Bis zum Redesign stand sie in `base.html` und
           galt nur fuer den Umschalter — nicht fuer die Systemeinstellung. */
        @media (prefers-color-scheme:dark){
            :root:not([data-theme="light"]) input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
            :root:not([data-theme="light"]) select,
            :root:not([data-theme="light"]) textarea{background-color:var(--ds-surface-2);color:var(--ds-ink);border-color:var(--ds-line-stark)}
        }

        /* Inhalt in der Schublade (`fw/base_embed.html`) und das Fertig-Signal

        @media (max-width:640px){.fw-einbettung{padding:16px}}
        /* ============================================================
           STARTSEITE NACH KONZEPT-V8 (`fw/dashboard.html`)

        /* ---- «Heute» nach konzept-v8, zweiter Durchgang ------------------

        .fw-cockpit-haupt,.fw-cockpit-kontext{display:flex;flex-direction:column;gap:24px}
        .fw-cockpit-haupt>.fw-card,.fw-cockpit-kontext>.fw-card{margin-bottom:0}
        .fw-vorrat .fw-reiter{padding:0 14px}
        .fw-vorrat-filter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-bottom:1px solid var(--ds-line)}
        .fw-vorrat-wahl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
        .fw-vorrat-wahl select{height:28px;min-height:0;border:1px solid var(--ds-line);border-radius:var(--ds-pill);background:var(--ds-surface);
            padding:0 10px;font:inherit;font-size:13px;color:var(--ds-muted);width:auto;cursor:pointer}
        .fw-vorrat-liste{list-style:none;margin:0;padding:6px 0}
        .fw-vz{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto 104px 150px;align-items:center;gap:16px;

        .fw-vz.crit::before{background:var(--ds-crit)}
        .fw-vz.warn::before{background:var(--ds-warn)}
        .fw-vz:hover,.fw-vz.sel{background:var(--ds-hover)}

        .fw-vz + .fw-vz{border-top:1px solid var(--ds-line)}
        .fw-vz-haupt{min-width:0}

        .fw-vz-kopf .fw-marke-kapsel .fw-zeichen{width:12px!important;height:12px!important}
        .fw-vz-titel{display:block;font-weight:600;font-size:14px;letter-spacing:-.005em;color:var(--ds-ink);text-decoration:none;

        .fw-vz-sub{font-size:13px;color:var(--ds-muted);display:flex;align-items:center;gap:10px;margin-top:3px;min-width:0}
        .fw-vz-obj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
        .fw-vz-wer{display:flex}
        .fw-avatar.fw-avatar-offen{border-style:dashed}
        .fw-vz-frist{text-align:right;font-size:13px;line-height:1.35}
        .fw-vz-frist b{display:block;font-weight:600;font-size:13px;color:var(--ds-ink)}
        .fw-vz-frist span{color:var(--ds-faint)}
        .fw-vz-frist.crit b{color:var(--ds-crit)}
        .fw-vz-frist.warn b{color:var(--ds-warn)}

        .fw-tasten{display:flex;gap:14px;flex-wrap:wrap}

           statt den Text auf drei Wörter je Zeile zu quetschen. */
        .fw-cockpit-kontext .fw-zeile{flex-wrap:wrap}
        .fw-cockpit-kontext .fw-zeile .fw-mitte{flex:1 1 170px}
        /* Die Vorgangs-Schublade (`.drawer` im Mockup): faehrt von rechts ein. */

            transform:translateX(104%);transition:transform .28s var(--ds-ease)}
        .fw-vg.offen{pointer-events:auto}
        .fw-vg.offen .fw-vg-vorhang{opacity:1}
        .fw-vg.offen .fw-vg-box{transform:none}
        .fw-vg-kopf{padding:20px 24px 16px;padding-top:calc(20px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--ds-line)}
        .fw-vg-oben{display:flex;align-items:center;gap:8px;color:var(--ds-faint);font-size:13px}
        .fw-vg-oben .fw-knopf-rund{margin-left:auto;margin-right:-8px}
        .fw-vg-kopf h3{margin:10px 0 4px;font-size:22px;letter-spacing:-.02em;line-height:1.25;font-weight:600;color:var(--ds-ink);text-wrap:balance}

        .fw-vg-inhalt{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:22px}

        .fw-vg-abschnitt h4{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ds-faint)}
        .fw-vg-abschnitt .fw-ablauf{padding:0}
        .fw-vg-fakten{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 20px;margin:0;font-size:14px}
        .fw-vg-fakten dt{color:var(--ds-faint)}
        .fw-vg-fakten dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere;color:var(--ds-ink)}
        .fw-vg-fuss{padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ds-line);
            display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
        .fw-vg-fuss form{margin:0}
        /* Traeger in der `<template>` der Zeile — das Skript liest und entfernt sie. */
        .fw-vg-kopf-daten{display:none}
        .fw-vg-fuss-daten{display:contents}
        @media (prefers-reduced-motion:reduce){.fw-vg-box,.fw-vg-vorhang{transition:none}}
        @media (max-width:720px){
            .fw-hallo h1{font-size:22px}
            .fw-vz{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px 16px 12px 22px}

            /* Anders als das Mockup bleiben die Filter am Telefon da — unter der

            .fw-vorrat .fw-kopf{flex-wrap:wrap}
            .fw-vorrat-wahl{flex-basis:100%;justify-content:flex-start;margin-left:0}
            .fw-vorrat-wahl{flex-wrap:nowrap}
            .fw-vorrat-wahl select{flex:1 1 0;min-width:0;max-width:none}
            .fw-tasten{display:none}
            .fw-vorrat .fw-reiter{padding:0 6px}

        .fw-reiter a.crit .fw-z{background:var(--ds-crit-soft);color:var(--ds-crit);border-color:transparent}
        a.fw-zeile{text-decoration:none;color:inherit}
        .fw-zeile .fw-zeit.crit{color:var(--ds-crit)}
        .fw-zeile .fw-zeit.warn{color:var(--ds-warn)}
        .fw-zeile .fw-zeit{text-align:right;line-height:1.35}

        .fw-leer .fw-leer-zeichen{width:40px;height:40px;border-radius:var(--ds-pill);background:var(--ds-good-soft);color:var(--ds-good);

        .fw-leer .fw-leer-zeichen.mut{background:var(--ds-surface-2);color:var(--ds-faint)}

        .fw-leer p{margin:4px auto 0;max-width:24rem;font-size:13px;color:var(--ds-faint)}
        .fw-leer .fw-btn{margin-top:14px}
        .fw-leer-knapp .fw-leer-zeichen{width:32px;height:32px;font-size:15px;margin-bottom:8px}
        .fw-leer-knapp b{font-weight:500;color:var(--ds-muted)}
        .fw-eingang{align-items:flex-start}
        .fw-quelle{width:32px;height:32px;border-radius:var(--ds-radius-knopf);display:grid;place-items:center;flex:0 0 32px;
            background:var(--ds-surface-2);border:1px solid var(--ds-line);color:var(--ds-muted);font-size:15px}
        .fw-vorschlag{display:inline-block;margin-top:8px;font-size:13px;font-weight:500;padding:3px 8px;border-radius:var(--ds-radius-xs);

        .fw-vorschlag.unsicher{background:var(--ds-warn-soft);color:var(--ds-warn)}
        .fw-eingang-knoepfe{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
        .fw-agenda{padding:10px 20px 14px}
        .fw-agenda-zeile{display:grid;grid-template-columns:52px 22px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;position:relative}
        .fw-agenda-zeile:not(:last-child)::after{content:"";position:absolute;left:72px;top:30px;bottom:-8px;width:1px;background:var(--ds-line)}

        .fw-agenda-punkt{width:22px;height:22px;border-radius:var(--ds-pill);border:1.5px solid var(--ds-brand);background:var(--ds-surface);/* v8: Zeichen im Ring */
            color:var(--ds-brand);display:grid;place-items:center;font-size:12px;position:relative;z-index:1}
        .fw-agenda .fw-t{font-weight:600;font-size:14px;line-height:1.35;color:var(--ds-ink)}

        .fw-portal-fuss{text-align:center;font-size:12px;color:var(--ds-faint);margin-top:32px}
        .fw-meldung{border:0;border-radius:var(--ds-radius);margin-bottom:16px}

        .fw-portal-top{position:relative;z-index:40;display:flex;align-items:center;gap:12px;width:100%;max-width:1440px;margin:0 auto;

        /* ---- Tranche A: Akten nach konzept-v8 (#akten, #lg-…, #mv-…) ----

           Mockup (`.crumbs`, `.p-tools`, `.two`, `.issues`, `.callout`). */
        .fw-krumen{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--ds-faint);font-weight:500}

        .fw-akten-karte{overflow:hidden}
        .fw-akten-karte>.fw-reiter{border-top:0;padding-top:4px}
        .fw-akten-karte>.fw-reiter:last-child{border-bottom:0}
        .fw-akten-werkzeug{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--ds-line)}
        .fw-akten-werkzeug .fw-listwerkzeug{margin:0;flex:1 1 auto;max-width:680px;min-width:0}
        .fw-akten-hinweis{font-size:13px;color:var(--ds-faint)}
        .fw-akten-werkzeug .fw-filters{margin:0;flex-basis:100%}
        table.fw-table tr.fw-klickzeile{cursor:pointer}
        table.fw-table .fw-zelle-titel{font-weight:600;color:var(--ds-ink);text-decoration:none}
        table.fw-table a.fw-zelle-titel:hover{color:var(--ds-brand)}
        table.fw-table .fw-zelle-sub{display:block;color:var(--ds-faint);font-size:12px;font-weight:400;margin-top:1px;white-space:nowrap}
        table.fw-table .fw-zelle-befund{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
        .fw-kpis.fw-stats .fw-kpi .fw-v{font-size:22px}
        .fw-zwei{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start;margin-bottom:24px}
        .fw-zwei>.fw-card{margin-bottom:0;min-width:0}
        @media (max-width:1100px){.fw-zwei{grid-template-columns:minmax(0,1fr)}}
        .fw-auffaellig{list-style:none;margin:0;padding:6px 0}
        .fw-auffaellig li{display:flex;align-items:center;gap:12px;padding:12px 20px}
        .fw-auffaellig li + li{border-top:1px solid var(--ds-line)}
        .fw-auffaellig .fw-mitte{flex:1;min-width:0}
        .fw-auffaellig .fw-mitte b{display:block;font-weight:600;font-size:14px;color:var(--ds-ink)}
        .fw-auffaellig .fw-mitte span{font-size:13px;color:var(--ds-muted)}
        .fw-ansage{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px 20px;margin-bottom:24px;
            border-radius:var(--ds-radius);border:1px solid var(--ds-line);background:var(--ds-surface)}
        .fw-ansage>.fw-zeichen{flex:0 0 auto}
        .fw-ansage.crit{background:var(--ds-crit-soft);border-color:color-mix(in srgb,var(--ds-crit) 30%,transparent)}
        .fw-ansage.crit>.fw-zeichen{color:var(--ds-crit)}
        .fw-ansage .fw-mitte{flex:1 1 220px;min-width:0}
        .fw-ansage .fw-mitte b{display:block;font-weight:600;color:var(--ds-ink)}
        .fw-ansage .fw-mitte span{font-size:13px;color:var(--ds-muted)}
        .fw-ansage-knoepfe{display:flex;gap:8px;flex-wrap:wrap}
        @media (max-width:640px){
            .fw-akten-werkzeug{padding:12px 16px}
            .fw-auffaellig li{padding:12px 16px;flex-wrap:wrap}
            .fw-auffaellig .fw-mitte{flex-basis:calc(100% - 20px)}
            .fw-ansage{padding:14px 16px}
            /* Kennzahlen der Akten am Telefon flacher (gemessen 390 px,
               Vertragsakte: 236 px bei 21 px Wert und vollem Innenabstand). */
            .fw-kpis.fw-stats .fw-kpi{padding:10px 14px;gap:3px}
            .fw-kpis.fw-stats .fw-kpi .fw-v{font-size:18px}
            .fw-kpis.fw-stats .fw-kpi .fw-f{font-size:12px}
            /* Engere Zeilen, damit die Leiste auch mit einer breiteren Ersatzschrift (Webfont noch
               nicht geladen) unter 195 px bleibt — gemessen 200 px ohne, 185 px mit. */
            .fw-kpis.fw-stats .fw-kpi .fw-l,.fw-kpis.fw-stats .fw-kpi .fw-f{line-height:1.3}
        }
        /* ---- Tranche B: Läufe und Sollstellung nach konzept-v8 (#laeufe, #lauf-soll) ----
           Laufkarten im Raster (`.runs`, `.run`, `.run-h`, `.run-f`) mit dem
           beschrifteten Stufenband `fw-stufen` (`.pipe`): Segment + Name
           darunter; fertig = Marke, jetzt = Marke halbtransparent,
           blockiert = rot. Brotkrume: `fw-krumen` aus Tranche A. */
        .fw-laeufe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px}
        .fw-laeufe>.fw-card{margin-bottom:0}
        /* Heute (UI-Zielbild): Segment für den Schwerpunkt, Dringlichkeitsgruppen, ✓-Knopf neben dem Aufgabenknopf */
        .fw-schwerpunkt-segment{display:inline-flex;margin:0}
        .fw-schwerpunkt-segment button{border:0;cursor:pointer}
        .fw-vz-gruppe{display:flex;gap:8px;align-items:baseline;list-style:none;padding:12px 20px 6px;font-size:12px;letter-spacing:.06em;
            text-transform:uppercase;color:var(--ds-muted)}
        .fw-vz-gruppe b{font-weight:700}
        .fw-vz-gruppe.fw-crit b{color:var(--ds-crit)}
        .fw-vz-gruppe span{text-transform:none;letter-spacing:0}
        .fw-vz-aktion{display:flex;align-items:center;gap:8px}
        .fw-haken-form{display:inline-flex;margin:0}
        .fw-haken{width:36px;height:36px;border-radius:var(--ds-kreis);border:1px solid var(--ds-line-stark);background:var(--ds-surface);
            color:var(--ds-ink);display:grid;place-items:center;cursor:pointer}
        .fw-haken:hover{border-color:var(--ds-good);color:var(--ds-good)}
        .fw-haken svg{width:16px;height:16px}
        @media (max-width:640px){.fw-haken{width:40px;height:40px}}
        /* Schäden (UI-Zielbild): Statuschip über dem Titel, «seit N Tagen» und Aktionsknopf rechts */
        .fw-schadenzeile{align-items:center}
        .fw-schaden-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
        .fw-seit{flex:none;font-size:13px;font-weight:700;color:var(--ds-muted);white-space:nowrap}
        .fw-seit.fw-crit{color:var(--ds-crit)}
        .fw-filter-zeile{padding:10px 20px 0}
        @media (max-width:640px){.fw-schadenzeile{flex-wrap:wrap}.fw-schadenzeile .fw-mitte{flex-basis:calc(100% - 28px)}}
        /* Statuszeile statt Kennzahl-Kacheln (UI-Zielbild): schmale Kapseln mit Farbpunkt, Zahl und Wort in einem */
        .fw-statuszeile{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
        .fw-sz{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--ds-pill);
            background:var(--ds-surface);color:var(--ds-ink);font-size:13px;font-weight:600;text-decoration:none}
        .fw-sz::before{content:"";flex:none;width:7px;height:7px;border-radius:var(--ds-kreis);background:var(--ds-muted)}
        .fw-sz-good::before{background:var(--ds-good)}
        .fw-sz-warn::before{background:var(--ds-warn)}
        .fw-sz-crit::before{background:var(--ds-crit)}
        a.fw-sz:hover{box-shadow:var(--ds-shadow-sm)}
        a.fw-sz:focus-visible{outline:2px solid var(--ds-brand);outline-offset:2px}
        @media (max-width:640px){.fw-sz{min-height:40px}}
        /* Monatsabschluss als Schrittliste (UI-Zielbild): Haken, aktueller Schritt, gesperrter Schritt */
        .fw-schrittliste{display:block}
        .fw-schritt{display:flex;align-items:center;gap:16px;padding:14px 20px;border-top:1px solid var(--ds-line)}
        .fw-schritt .fw-mitte{flex:1;min-width:0}
        .fw-schritt .fw-t{font-size:14px;font-weight:600;color:var(--ds-ink)}
        .fw-schritt .fw-t a{color:inherit;text-decoration:none}
        .fw-schritt .fw-t a:hover{text-decoration:underline}
        .fw-schritt .fw-s{font-size:13px;color:var(--ds-muted);margin-top:2px}
        .fw-schritt-zeichen{flex:none;width:26px;height:26px;border-radius:var(--ds-kreis);display:grid;place-items:center;
            border:2px solid var(--ds-line-stark)}
        .fw-schritt-zeichen svg{width:14px;height:14px}
        .fw-schritt.fertig .fw-schritt-zeichen{background:var(--ds-good);border-color:var(--ds-good);color:var(--ds-auf-satt)}
        .fw-schritt.jetzt .fw-schritt-zeichen{border-color:var(--ds-brand);box-shadow:inset 0 0 0 5px var(--ds-surface),inset 0 0 0 13px var(--ds-brand)}
        .fw-schritt.gesperrt .fw-t{color:var(--ds-ink)}
        .fw-schritt-skip{margin-top:6px;font-size:13px;color:var(--ds-muted)}
        .fw-schritt-skip summary{cursor:pointer;display:inline-block}
        .fw-schritt-skip form{margin-top:6px}
        @media (max-width:640px){.fw-schritt{flex-wrap:wrap;gap:12px;padding:14px 16px}}
        .fw-lauf{padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
        .fw-lauf-kopf{display:flex;align-items:flex-start;gap:12px}
        .fw-lauf-kopf>.fw-chip{flex:0 0 auto}
        .fw-lauf-titel{flex:1;min-width:0}
        .fw-lauf-titel b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ds-ink)}
        .fw-lauf-titel span{font-size:13px;color:var(--ds-muted)}
        .fw-lauf-fuss{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;
            padding-top:12px;border-top:1px solid var(--ds-line);font-size:12px;color:var(--ds-faint)}
        /* Zwei Knöpfe («Details», «Öffnen») in einer Reihe; der Kontexttext nimmt den Rest und
           bricht NEBEN ihnen um. Ohne das rutschten die Knöpfe bei langem Text («gestartet … ·
           Stichtag … · in n Tagen», ab dem Monatsersten) unter den Text: 73 statt 43 px am Telefon. */
        .fw-lauf-fuss>span:first-child{flex:1 1 0;min-width:0}
        .fw-lauf-fuss>span:last-child{display:flex;gap:6px;flex:0 0 auto}
        /* Am Telefon knappere Knöpfe und Zeilen: Der lange Kontext bleibt so auch mit einer
           breiteren Ersatzschrift zweizeilig neben den Knöpfen (67 statt unter 60 px ohne). */
        @media (max-width:640px){
            .fw-lauf-fuss{line-height:1.35}
            .fw-lauf-fuss>span:last-child{gap:4px}
            .fw-lauf-fuss .fw-btn.fw-knapp{padding-inline:10px}
            .fw-lauf-fuss>span:first-child{font-size:12px;line-height:1.25}
        }
        .fw-lauf-leer{grid-column:1 / -1}
        .fw-stufen{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
        .fw-stufen li{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:12px;color:var(--ds-faint)}
        .fw-stufen i{display:block;height:4px;border-radius:var(--ds-radius-xs);background:var(--ds-line-stark)}
        .fw-stufen li.fertig i{background:var(--ds-brand)}
        .fw-stufen li.jetzt i{background:var(--ds-brand);opacity:.45}
        .fw-stufen li.blockiert i{background:var(--ds-crit)}
        .fw-stufen li.fertig,.fw-stufen li.jetzt,.fw-stufen li.blockiert{color:var(--ds-ink)}
        .fw-stufen span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .fw-phead-knoepfe .fw-kopffilter{margin:0}
        /* Laufseiten: Die lange Unterzeile bricht um, die Wahl bleibt rechts. */
        .fw-phead.fw-phead-lauf>div:first-child{flex:1 1 420px;min-width:0}
        /* Freigabeleiste IN einer Karte (Zahllauf: der Knopf gehört zum Formular). */
        .fw-card>.fw-freigabe{margin:12px}
        @media (max-width:1180px){.fw-laeufe{grid-template-columns:repeat(2,minmax(0,1fr))}}
        @media (max-width:720px){
            .fw-laeufe{grid-template-columns:minmax(0,1fr)}
            .fw-lauf{padding:16px}
        }
        /* ---- Tranche D: Darstellungsreste v8, zweiter Durchgang ----------
           Brotkrume, Dateifeld, Menue «Mehr» im Seitenkopf am Telefon,
           Summenzeile gestapelter Tabellen, Kennzahlen mit ungerader Zahl. */
        /* Die Brotkrume ueber dem Seiten- oder Aktenkopf. Hiess bis hierher
           `fw-akte-pfad` — wie der Schluessel-Wert-Block IM Aktenkopf
           (bekannte-fallen 2b). Gleiche Gestalt wie zuvor `nav.fw-akte-pfad`. */
        .fw-brotkrume{font-size:12px;color:var(--ds-faint);margin-top:4px;line-height:1.55}
        .fw-brotkrume b{color:var(--ds-muted);font-weight:600}
        /* Dateifeld: Rahmen wie `fw-feld`, der Auswahlknopf wie `fw-btn`.
           Ersetzt die Tailwind-`file:`-Utilities, die je Vorlage anders
           aussahen (Marke gefuellt, Marke weich, grau, rund). */
        .fw-datei{display:block;max-width:100%;min-width:0;background:var(--ds-surface);
            border:1px solid var(--ds-line-stark);border-radius:var(--ds-radius-knopf);
            padding:4px 10px 4px 4px;font-size:13px;line-height:1.3;color:var(--ds-muted);
            font-family:inherit;cursor:pointer;overflow:hidden;text-overflow:ellipsis;
            transition:border-color .12s,box-shadow .12s}
        .fw-datei:focus-visible{outline:none;border-color:var(--ds-brand);box-shadow:0 0 0 3px var(--ds-brand-soft)}
        .fw-datei::file-selector-button{margin-right:10px;min-height:30px;padding:5px 12px;
            border:1px solid var(--ds-line);border-radius:var(--ds-radius-sm);background:var(--ds-surface-2);
            color:var(--ds-ink);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
            transition:border-color .12s,box-shadow .12s}
        .fw-datei:hover::file-selector-button{border-color:var(--ds-line-stark);box-shadow:var(--ds-shadow-sm)}
        @media (max-width:640px){
            /* Menue «Mehr» im Seitenkopf: rechts verankert ragte es 16 px links
               ueber den Rand, sobald die Knoepfe unter den Titel umbrechen
               (Kreditoren, 288 px breit, Knopf endet bei x = 272). Am Telefon
               haengt es deshalb an der linken Kante der Knopfzeile. */
            .fw-phead-knoepfe{position:relative}
            .fw-phead-knoepfe>[data-menu]{position:static}
            .fw-phead-knoepfe [data-menu-list]{left:0;right:auto;max-width:calc(100vw - 32px)}
            /* Kennzahlen am Telefon: Bei ungerader Zahl fuellt die letzte die
               Reihe, statt neben einer leeren Zelle zu stehen. */
            .fw-kpis>.fw-kpi:last-child:nth-child(odd){grid-column:1 / -1}
        }
        @media (max-width:767px){
            /* Summenzeile gestapelter Tabellen, deren erste Zelle zusammengefasst
               ist («Soll-Total» ueber zwei Spalten): Die Beschriftung steht links
               als Titel, die erste Zahl bleibt eine beschriftete Zeile wie die
               folgenden — das Skript hatte sie zur fetten Ueberschrift ohne
               Beschriftung gemacht (Mieterspiegel). */
            table[data-stack] tfoot td[colspan]:first-child{justify-content:flex-start;
                text-align:left !important;font-size:14px;font-weight:700;color:var(--ds-ink)}
            table[data-stack] tfoot td[colspan]:first-child>.fw-wert{text-align:left}
            table[data-stack] tfoot td[colspan]~td[data-stack-titel]{display:flex;
                text-align:right !important;font-size:inherit;font-weight:600;margin-bottom:0}
            table[data-stack] tfoot td[colspan]~td[data-stack-titel]::before{content:attr(data-label)}
            table[data-stack] tfoot td[colspan]~td[data-stack-titel]>.fw-wert{text-align:right}
            table[data-stack] tfoot td[colspan]:not(:first-child)>.fw-wert{text-align:left;font-weight:500}
        }
        /* ---- Ende Tranche D ---- */
        /* ---- Tranche C: Finanzen und Berichte nach konzept-v8 (#finanzen, #berichte) ----
           Gutschriften-Liste (`.feed` + `.sugg`), Aging-Tabelle (`.tbl`),
           zwei Diagrammkarten nebeneinander (`.two`), Linie (`.chart`) und

        .fw-fin-kpis .fw-v{overflow-wrap:anywhere}
        .fw-fin-links{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto}
        .fw-gutschriften .fw-leer{padding:28px 20px}
        .fw-gs-liste{list-style:none;margin:0;padding:8px 0}
        .fw-gs{display:flex;gap:12px;padding:12px 20px}
        .fw-gs + .fw-gs{border-top:1px solid var(--ds-line)}
        .fw-gs .fw-mitte{flex:1;min-width:0}
        .fw-gs .fw-s{font-size:12px;color:var(--ds-faint);margin-top:2px;overflow-wrap:anywhere}
        .fw-gs-kopf{display:flex;gap:12px;justify-content:space-between;align-items:baseline}
        .fw-gs-wer{font-size:13px;font-weight:500;color:var(--ds-ink);min-width:0;overflow-wrap:anywhere}
