{% comment %}
DIE KOMPONENTENSCHICHT — Tokens und `fw-*`-Bausteine.

WARUM SIE SEIT E2.10 IN EINER EIGENEN DATEI STEHT

Bis hierher lag sie im <style>-Block von `fw/base.html`. Wer nicht von dieser
Huelle erbt, sah sie nie — und das betraf ausgerechnet die zwei dichtesten
Vorlagen der Anwendung: `schaden_melden.html` (264 Farbklassen) und
`public_bewerbung_form.html` (205). In E2.3 waren beide bereits umgestellt und
mussten zurueckgenommen werden, weil sie unformatiert gerendert haetten — die
Seiten, die MIETER UND BEWERBER sehen.

Jetzt ist die Schicht ein eigener Baustein, den beide Huellen einbinden:
`fw/_assets.html` (Anwendung) und `core/_assets_aussen.html` (Aussenseiten).

WAS DAS FUER DIE AUSSENSEITEN BEDEUTET

Sie bekommen damit die Petrol-Tokens. Das ist eine Aenderung an dem, was
Dritte sehen, und ausdruecklich entschieden: Mieterportal und
Bewerbungsformular tragen dieselbe Marke wie die Anwendung, statt in
Tailwinds Voreinstellung zu bleiben. Der Dunkelmodus folgt ihnen mit.

DIESE DATEI IST REIN ADDITIV. Alle Klassen tragen `fw-`; sie kollidieren
weder mit Tailwind noch mit dem Bestand.

ACHTUNG — DIESER KOPF MUSS EIN DJANGO-KOMMENTAR BLEIBEN

Er steht VOR dem `<style>`-Tag. Als CSS-Kommentar (`/* … */`) ist er dort
kein Kommentar, sondern Text: Der Browser hat ihn oben auf jeder Seite
ausgegeben, sichtbar auch auf dem oeffentlichen Ticketformular.

Passiert beim Zurueckstellen einer Massenaenderung: Erst wurden alle
CSS-Kommentare in Django-Kommentare umgewandelt (falsch — der schliessende Django-Kommentar
enthaelt eine geschweifte Klammer und zerschneidet den Tokenblock fuer die
Waechter), dann alle zurueck — und dabei auch dieser eine, der von Anfang an
richtig war.

Regel: INNERHALB von `<style>` gehoeren CSS-Kommentare hin, AUSSERHALB
Django-Kommentare. Beides ist hier noetig, weil die Datei eine Vorlage ist
und einen Stilblock enthaelt.

           Vorher: konzept-v3 bis v6 (Phase 4b).
           Der Bestand fuhr Indigo #4f46e5 auf Slate; das Konzept fuehrt Petrol

           derselbe Petrolton, eine Stufe dunkler. Die Regel weiter unten haengt
           text-slate-400/-300 an --ds-muted; das bleibt unveraendert. */
        :root{
            --ds-bg:#f7f6f3;--ds-surface:#fff;--ds-surface-2:#f6f5f3;--ds-ink:#17181b;--ds-muted:#5d6068;--ds-faint:#62656d;--ds-line:#e7e5e1;
            --ds-brand:#b04416;--ds-brand-600:#8a3410;--ds-brand-soft:#fbe7dc;
            /* Flaeche unter dem Zeiger (Zeilen, Menues, Knoepfe) — eine Stufe

               ist. Grau darauf erreicht noch 4.52:1. */
            --ds-hover:#f3f1ee;
            /* Markenverlauf mit weisser Schrift (Kopf des Mieterportals).
               BEWUSST in beiden Modi gleich und nicht an --ds-brand gehaengt:
               Im Dunkelmodus ist die Marke hell, weisse Schrift darauf
               erreichte nur 2.5:1. Mit diesen Werten: Weiss 8.8:1. */
            --ds-verlauf-von:#74300f;--ds-verlauf-bis:#3d1706;
            /* Schrift auf einer GESAETTIGTEN Flaeche — Marke, kritisch,
               gut, Warnung. Nachgemessen fuer alle vier: Im Hellmodus
               gewinnt Weiss (5.8-6.8:1), im Dunkelmodus die dunkle Tinte
               (7.2-8.8:1). Ein fester Wert kann das nicht leisten. */
            --ds-auf-satt:#ffffff;
            /* Dunkle Karte der Startseite (Mix-Entwurf): in beiden Modi dunkel, mit heller Schrift und hellem Akzent. */
            --ds-hero:#16171a;--ds-auf-hero:#f4f3ef;--ds-hero-leise:#a9aab0;--ds-hero-akzent:#f59e6b;--ds-hero-gut:#d9f26b;
            /* Eine Stufe deutlicher als die Grundlinie: fuer Umrandungen,
               die beim Ueberfahren hervortreten sollen. */
            --ds-line-stark:#d6d3ce;
            --ds-good:#15683a;--ds-good-soft:#e3f3e8;--ds-warn:#955708;--ds-warn-soft:#fbf0de;--ds-crit:#b0222e;--ds-crit-soft:#fbe9eb;--ds-info:#0e6b65;--ds-info-soft:#e2f1ef;
            /* Drei Hoehen wie im Mockup: aufliegend (Karten), schwebend
               (Popover, Freigabeleiste), abgehoben (Schublade, Dialog). */
            --ds-shadow-sm:0 1px 2px rgba(23,24,27,.04),0 14px 34px -22px rgba(23,24,27,.16);--ds-shadow:0 2px 4px rgba(23,24,27,.05),0 26px 50px -22px rgba(23,24,27,.26);--ds-shadow-lg:0 30px 70px -18px rgba(23,24,27,.34);
            /* Vorhang hinter Schublade, Palette und Dialog. */
            --ds-scrim:rgba(23,24,27,.38);
            --ds-glow:rgba(224,100,47,.07);--ds-glow-2:rgba(255,255,255,.55);
            /* Ember-Akzent fuer Flaechen (aktiver Balken, Punkte) — als Flaeche,
               nie als Schrift auf Weiss (3.5:1). */
            --ds-akzent:#e0642f;--ds-akzent-hell:#f08a55;--ds-akzent-tief:#c4531f;
            /* Die orange Hauptkarte (fw-kachel.akzent, fw-kpi.fw-accent) und der Avatar tragen WEISSE Schrift.
               Gemessen am 29.10.2026 (DESIGN-10): Der Verlauf aus --ds-akzent und der Aufheller aus
               --ds-akzent-hell erreichten 2.5:1 bis 3.5:1 (der Kommentar hier sagte 4.8:1). Diese drei Toene
               sind die hellste und die dunkelste Stelle der Karte: Weiss darauf 5.2:1 / 6.1:1 / 7.7:1, auch
               mit 92 % Deckung noch >= 4.5:1. Heller darf kein Pixel einer Karte mit weisser Kleinschrift sein. */
            --ds-karte-hell:#b84a1a;--ds-karte-mitte:#a8421a;--ds-karte-tief:#8f3714;
            --ds-radius:24px;--ds-radius-sm:14px;--ds-pill:999px;--ds-kreis:50%;
            /* Knoepfe und Felder (9), Kapsel-Etiketten (5), Dialoge (14). */
            --ds-radius-knopf:12px;--ds-radius-xs:8px;--ds-radius-lg:28px;--ds-radius-0:0px;
            /* Mix-Entwurf (21.11.2026): Inter fuer die Oberflaeche, Sora fuer Titel und grosse Zahlen (lokal, static/css/schriften.css). */
            --ds-font:'Inter','DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
            --ds-disp:'Sora','Inter','DM Sans',ui-sans-serif,system-ui,sans-serif;
            --ds-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;

        }

        .fw-num{font-variant-numeric:tabular-nums}
        /* A11y-Fundament: Kontrast + Tastatur-Fokus (wirkt global auf /neu) */
        /* text-slate-400 (#94a3b8 = 2.56:1) und -300 (1.48:1) erfüllen WCAG AA nicht.
           Nur die Textfarbe auf --ds-muted (≥4.5:1, theme-aware) anheben — Border/BG unberührt. */
        .text-slate-400{color:var(--ds-muted)!important}
        .text-slate-300{color:var(--ds-muted)!important}
        /* Beim Ueberfahren wird es heller, nicht gleich hell: sonst waere der
           Zustand `hover` von `normal` nicht zu unterscheiden. */
        /* Sichtbarer Fokusring nur bei Tastaturnavigation (kein Maus-Klick-Ring) */
        a:focus-visible,button:focus-visible,summary:focus-visible,[role="button"]:focus-visible,
        input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{
            outline:2px solid var(--ds-brand);outline-offset:2px;border-radius:6px
        }
        /* Seitenkopf */
        .fw-phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
        /* Die zwei Kopf-Filter aus v7. Eine eigene Zeile UNTER dem Kopf, nicht
           darin: `fw-phead` verteilt genau zwei Kinder auf die Zeilenenden,
           ein drittes schoebe die Knoepfe um. */
        .fw-kopffilter{display:flex;flex-wrap:wrap;align-items:center;gap:12px;
            margin:-8px 0 16px;font-size:13px}
        /* Das Fallart-Band unter den Reitern. Kapseln statt Reiter, damit es
           sich von der Reiterzeile darueber klar unterscheidet — es filtert
           innerhalb der Ansicht, es wechselt sie nicht. */
        .fw-band{display:flex;flex-wrap:wrap;align-items:center;gap:6px;
            padding:12px 20px;border-bottom:1px solid var(--ds-line);font-size:13px}
        .fw-band>a{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:var(--ds-pill);
            border:1px solid var(--ds-line);color:var(--ds-muted);background:var(--ds-surface);font-weight:500;
            text-decoration:none;white-space:nowrap;transition:border-color .12s,color .12s,background .12s}
        .fw-band>a b{font-weight:600;opacity:.7}
        .fw-band>a:hover{border-color:var(--ds-line-stark);color:var(--ds-ink)}
        .fw-band>a.hier{border-color:var(--ds-ink);color:var(--ds-surface);
            background:var(--ds-ink);font-weight:600}
        /* DIE FILTER ALS KAPSELN — NACH KONZEPT v7 (E2.68).

           Der Prototyp zeigt zwei Kapseln nebeneinander: «Zuständigkeit:
           Alle ⌄» und «Mandat: Alle 9 ⌄». Beschriftung und Wert stehen IN
           der Kapsel.

           Vorher stand die Beschriftung daneben und das Auswahlfeld trug
           einen eigenen Rahmen — am Telefon wurden daraus zwei volle Zeilen,
           weil `label` und `select` je eigene Breite beanspruchten. Mit dem
           Rahmen am `label` und dem Feld ohne eigenen bleiben es zwei
           Kapseln, die nebeneinander passen. */
        .fw-kopffilter label{display:inline-flex;align-items:center;gap:5px;
            height:30px;padding:0 11px;border:1px solid var(--ds-line);border-radius:var(--ds-pill);
            background:var(--ds-surface);white-space:nowrap;max-width:100%;transition:border-color .12s}
        .fw-kopffilter label:focus-within{border-color:var(--ds-brand);box-shadow:0 0 0 3px var(--ds-brand-soft)}
        /* DAS AUSWAHLFELD BEMISST SICH AM LAENGSTEN EINTRAG, nicht an der
           Auswahl. Ein Mandat «Muster Immobilien AG» machte die Kapsel 235
           Pixel breit — dann passen die zwei nicht mehr nebeneinander. */
        .fw-kopffilter .fw-feld{padding:0;border:0;background:none;
            font-weight:700;color:var(--ds-ink);max-width:130px;
            text-overflow:ellipsis}
        .fw-kopffilter .fw-feld:focus{outline:none;box-shadow:none}
        .fw-kopffilter .fw-feld{min-height:0;width:auto}
        @media (max-width:640px){
            .fw-kopffilter{gap:8px}
            .fw-kopffilter label{padding:4px 9px;font-size:12px}
            .fw-kopffilter .fw-feld{max-width:78px}
        }
        .fw-phead h1{font-size:28px;line-height:1.15;letter-spacing:-.025em;font-weight:600;color:var(--ds-ink);text-wrap:balance}
        .fw-phead p{font-size:14px;color:var(--ds-muted);margin-top:6px}
        /* Buttons */
        .fw-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;font-size:13px;font-weight:600;line-height:1.2;text-decoration:none;padding:7px 14px;border-radius:var(--ds-radius-knopf);cursor:pointer;border:1px solid var(--ds-line);background:var(--ds-surface);color:var(--ds-ink);white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s,transform .08s}
        .fw-btn:hover{border-color:var(--ds-line-stark);box-shadow:var(--ds-shadow-sm)}
        .fw-btn.fw-primary{background:var(--ds-brand);color:var(--ds-auf-satt);border-color:transparent}
        .fw-btn.fw-primary:hover{background:var(--ds-brand-600);border-color:transparent;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--ds-brand) 60%,transparent)}
        .fw-btn:active{transform:scale(.97)}
        /* Farbiger Schatten unter einem Markenknopf. `shadow-indigo-600/25`
           war zur Bauzeit auf Petrol festgeschrieben; ueber den Token folgt er
           dem Dunkelmodus und spaeterem Branding. `color-mix` faellt in alten
           Browsern still auf keinen Schatten zurueck — ein Schatten ist
           Beiwerk, sein Fehlen kostet keine Information. */
        .fw-schatten-marke{box-shadow:0 4px 14px color-mix(in srgb, var(--ds-brand) 25%, transparent)}
        /* Farbige Schatten fuer die zwei uebrigen Bedeutungen. Beiwerk:
           Wo `color-mix` fehlt, bleibt der Schatten aus, ohne dass
           Information verloren geht. */
        .fw-schatten-gut{box-shadow:0 4px 14px color-mix(in srgb, var(--ds-good) 25%, transparent)}
        .fw-ring-krit{box-shadow:0 0 0 3px color-mix(in srgb, var(--ds-crit) 35%, transparent)}
        /* Knoepfe mit Bedeutung. Ein Loeschknopf ist rot, weil Rot «Achtung»
           heisst — nicht, weil `bg-rose-600` gerade zur Hand war. Ueber Tokens
           folgen sie Dunkelmodus und Branding wie alles andere.
           Die Schrift bleibt weiss: Sie steht auf einer gesaettigten Flaeche
           und ist dort nicht tokenabhaengig. */
        .fw-btn.fw-gefahr{background:var(--ds-crit);color:var(--ds-auf-satt);border-color:transparent}
        .fw-btn.fw-gefahr:hover{filter:brightness(.92);border-color:transparent}
        .fw-btn.fw-warnknopf{background:var(--ds-warn);color:var(--ds-auf-satt);border-color:transparent}
        .fw-btn.fw-warnknopf:hover{filter:brightness(.92);border-color:transparent}
        .fw-btn.fw-gutknopf{background:var(--ds-good);color:var(--ds-auf-satt);border-color:transparent}
        .fw-btn.fw-gutknopf:hover{filter:brightness(.92);border-color:transparent}
        /* Knopf-Varianten (Audit Etappe 3, Teil 2). Ersetzen die selbst
           zusammengesetzten `px-3 py-1.5 rounded-lg text-xs …`-Knöpfe: eine
           Grösse (`fw-knapp`) und Farben, die es vorher nur als Einzelklassen
           gab. Namen bewusst eigen — `fw-klein` und `fw-akzent` sind schon
           belegt (Schriftgrösse, Formularfarbe). */
        .fw-btn.fw-knapp{min-height:30px;padding:5px 11px;font-size:13px;gap:6px;border-radius:var(--ds-radius-sm)}
        .fw-btn.fw-leise{background:var(--ds-surface-2);border-color:transparent;color:var(--ds-muted)}
        .fw-btn.fw-leise:hover{color:var(--ds-ink);border-color:var(--ds-line)}
        .fw-btn.fw-geist{background:transparent;border-color:transparent;color:var(--ds-muted)}
        .fw-btn.fw-geist:hover{background:var(--ds-hover);color:var(--ds-ink);box-shadow:none}
        .fw-btn.fw-weich{background:var(--ds-brand-soft);border-color:transparent;color:var(--ds-brand-600)}
        .fw-btn.fw-weich:hover{border-color:var(--ds-brand)}
        .fw-btn.fw-rand-marke{border-color:var(--ds-brand);color:var(--ds-brand)}
        .fw-btn.fw-rand-marke:hover{background:var(--ds-brand-soft)}
        .fw-btn.fw-rand-krit{border-color:var(--ds-crit);color:var(--ds-crit)}
        .fw-btn.fw-rand-krit:hover{background:var(--ds-crit-soft)}
        .fw-btn.fw-rand-warn{border-color:var(--ds-warn);color:var(--ds-warn)}
        .fw-btn.fw-rand-warn:hover{background:var(--ds-warn-soft)}
        .fw-btn.fw-rand-gut{border-color:var(--ds-good);color:var(--ds-good)}
        .fw-btn.fw-rand-gut:hover{background:var(--ds-good-soft)}
        .fw-btn:disabled,.fw-btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
        /* KPI-Kacheln */
        /* Ein Streifen: Trennlinien je Zelle rechts und unten, die aeusseren
           schneidet der Rahmen ab. Keine graue Restflaeche, wenn die letzte
           Reihe nicht voll ist (so im Eigentuemerportal gesehen). */
        .fw-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:24px;background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:var(--ds-radius);overflow:hidden;box-shadow:var(--ds-shadow-sm)}
        .fw-kpi{background:var(--ds-surface);padding:18px 20px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:background .12s;
            border-right:1px solid var(--ds-line);border-bottom:1px solid var(--ds-line);margin:0 -1px -1px 0}
        .fw-kpi.fw-accent{background:linear-gradient(150deg,color-mix(in srgb,var(--ds-brand) 12%,var(--ds-surface)),var(--ds-surface))}
        .fw-kpi .fw-l{font-size:13px;color:var(--ds-muted);font-weight:500}
        .fw-kpi .fw-v{font-size:28px;line-height:1.1;font-weight:600;letter-spacing:-.03em;color:var(--ds-ink);font-variant-numeric:tabular-nums}
        .fw-kpi .fw-v.fw-crit{color:var(--ds-crit)}.fw-kpi .fw-v.fw-warn{color:var(--ds-warn)}.fw-kpi .fw-v.fw-good{color:var(--ds-good)}
        .fw-kpi .fw-f{font-size:12px;color:var(--ds-faint)}
        /* Karte */
        .fw-card{background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:var(--ds-radius);box-shadow:var(--ds-shadow-sm);margin-bottom:24px;overflow:hidden}
        .fw-card>.fw-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--ds-line)}
        .fw-card>.fw-h .fw-t{font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--ds-ink)}

        /* Zahlenspalten immer mit gleich breiten Ziffern — sonst «tanzen» die
           Beträge untereinander und Spaltensummen lassen sich nicht mit dem Auge
           prüfen. Zentral statt in jedem Template, damit keine Tabelle vergessen
           geht (Praxis-Audit). Rechtsbündige Zellen sind hier immer Zahlen. */
        table td.text-right, table th.text-right { font-variant-numeric: tabular-nums; }
        /* Auf dem Desktop ist die Wert-Hülle wirkungslos — display:contents
           lässt die Zelle exakt so aussehen wie ohne sie. */
        .fw-wert { display: contents; }
        /* ---- Tabellen auf dem Handy: gestapelt statt quer scrollbar ----
           Eine breite Tabelle in einem overflow-x-auto zwang zum Querscrollen —
           man sah entweder die Bezeichnung ODER den Betrag, nie beides. Unter
           768 px wird jede Zeile deshalb zu einer Karte: links die Spalten-
           überschrift, rechts der Wert. Die Beschriftungen setzt das Skript am
           Seitenende aus dem <thead>, damit das ohne Eingriff in die ~40
           Tabellen-Templates greift und auch für neue Tabellen gilt. */
        @media (max-width: 767px) {
            /* Tabellen ohne Kopfzeile lassen sich nicht beschriften und werden
               daher nicht gestapelt. Sie sind in der Praxis schmal (Nummer ·
               Bezeichnung · Betrag); dort reicht es, die erzwungene Mindestbreite
               aufzuheben, damit der Text umbricht statt quer zu scrollen. */
            table.min-w-max { min-width: 0 !important; }
            /* display:block auch auf der Tabelle selbst — sonst steckt der Browser
               die Block-Zeilen in eine anonyme Tabellenzelle und misst die Breite
               wieder am Inhalt, die Tabelle bleibt also breiter als der Bildschirm. */
            table[data-stack] { display: block; min-width: 0 !important; width: 100% !important; }
            table[data-stack] thead { display: none; }
            table[data-stack] tbody,
            table[data-stack] tfoot,
            table[data-stack] tr,
            table[data-stack] td { display: block; width: auto; }
            /* Per Skript versteckte Zeilen (Bearbeiten-Zeilen im Kontenplan,
               bei den Kreditoren) bleiben versteckt — die Stapelregel
               darüber setzte sonst display:block und zeigte sie. */
            table[data-stack] tr.hidden { display: none !important; }
            /* Kräftiges Trennband statt Haarlinie: bei vier Feldern pro Zeile
               verschwimmen die Einträge sonst ineinander und man sieht nicht,
               wo ein Mieter aufhört und der nächste anfängt.
               !important ist hier nötig, nicht Bequemlichkeit: Tailwinds
               «divide-y» setzt auf jeder Zeile ausser der ersten
               border-bottom-width: 0 — ohne Vorrang bekäme nur die erste Karte
               ein Trennband und der Rest bliebe an der Haarlinie hängen. */
            table[data-stack] tr {
                padding: 0.75rem 1rem;
                border-top: 0 !important;
                border-bottom: 8px solid var(--ds-bg) !important;
            }
            table[data-stack] tr:last-child { border-bottom: 0 !important; }
            /* Die LETZTE Karte verlor alle Trennlinien in ihrem Innern.
               Ursache ist eine Desktop-Regel weiter oben:

                   table.fw-table tbody tr:last-child td { border-bottom: 0 }

               Am Tisch ist sie richtig — sie nimmt der untersten Tabellenzeile
               die Abschlusslinie. Gestapelt wird aber aus JEDER Zelle eine
               eigene Zeile, und die Regel loescht dann die Linien zwischen
               Typ, Flaeche, Status und Mieter — aber nur beim letzten Eintrag.
               Real gemeldet am 20.08.2026 an der Objektliste einer
               Liegenschaft: Der Parkplatz stand zuunterst und sah als
               einziger anders aus als die Wohnungen darueber.

               Hoehere Spezifitaet statt !important: `[data-stack].fw-table`
               schlaegt `.fw-table` sauber, und die Regel greift nur bei
               Tabellen, die diese Desktop-Regel ueberhaupt betrifft. */
            table[data-stack].fw-table tbody tr:last-child td {
                border-bottom: 1px solid var(--ds-line);
            }
            /* Dieselbe Trennung für die handgebauten Karten-Listen (Liegenschaften,
               Objekte, Personen, Verträge, Debitoren, Journal, Kontoblatt). Die sind
               keine gestapelten Tabellen, hatten also weiter nur die Haarlinie von
               «divide-y» — nebeneinander sah das aus wie zwei verschiedene Regeln.
               Der Doppel-Selektor trifft genau diese Listen: nur mobil sichtbar UND
               unterteilt, das ist per Konstruktion eine Karten-Liste. */
            .md\:hidden.divide-y > * + * { border-top: 8px solid var(--ds-bg) !important; }
            /* Aufklapp-Gruppen (Objekte je Liegenschaft, Hypotheken je
               Liegenschaft) sitzen zu mehreren in EINER Karte und waren nur
               durch die Haarlinie von «border-b» getrennt — auf dem Handy las
               sich das wie eine durchgehende Liste ohne Gruppengrenze.

               Eine Stufe dunkler als das Band zwischen einzelnen Einträgen:
               so bleibt die Hierarchie erkennbar, wenn eine Gruppe offen ist
               (Gruppengrenze deutlicher als die Trennung ihrer Zeilen). */
            main details.group.border-b { border-bottom: 8px solid var(--ds-line) !important; }
            main details.group.border-b:last-child { border-bottom-width: 0 !important; }
            /* «truncate» im Inhaltsbereich mobil aufheben.

               Auf dem Handy schneidet es genau das weg, was die Zeile
               identifiziert: «Selzacherstras…», «B..», «Narrezauber Sol…».
               Auf dem Desktop ist truncate richtig (breite Spalten, eine Zeile
               pro Datensatz) — mobil ist Platz nach unten, nicht nach rechts.

               Nur innerhalb von <main>: Topbar und Seitenleiste (Benutzername,
               Menü-Labels) brauchen ihre feste Zeilenhöhe, dort bleibt truncate.
               Django-seitiges `truncatechars` bleibt ebenfalls unberührt — das
               kürzt bewusst lange Freitexte und ist keine Layout-Notlösung. */
            main .truncate {
                white-space: normal !important;
                overflow: visible !important;
                text-overflow: clip !important;
                /* break-word, NICHT anywhere: `anywhere` senkt auch die
                   min-content-Breite auf ein Zeichen. Ein Flex-Element daneben
                   (Betrag, Button) drückt die Textspalte dann bis auf
                   Buchstabenbreite und der Titel bricht mitten im Wort
                   («überfälli/ge Forderun/gen») — real gemeldet auf der Inbox.
                   Mit break-word bleibt das längste Wort die Untergrenze. */
                overflow-wrap: break-word;
            }
            /* Erste Zelle ist die Überschrift der Zeile — ihr Wert benennt den
               Eintrag («Dominik Gerber»), das Label davor wäre nur Rauschen. */
            table[data-stack] td[data-stack-titel] {
                display: block; text-align: left !important;
                font-size: 1rem; font-weight: 700; color: var(--ds-ink);
                margin-bottom: 0.15rem;
            }
            table[data-stack] td[data-stack-titel]::before { content: none; }
            table[data-stack] td[data-stack-titel] > .fw-wert { text-align: left; }
            table[data-stack] td {
                padding: 0.2rem 0 !important;
                text-align: right !important;
                /* truncate / nowrap / max-w der Desktop-Spalten aufheben — mobil ist Platz nach unten */
                white-space: normal !important;
                overflow: visible !important;
                text-overflow: clip !important;
                max-width: none !important;
                display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem;
            }
            table[data-stack] td::before {
                content: attr(data-label);
                flex: 0 0 auto;
                text-align: left;
                font-size: 12px; font-weight: 600; letter-spacing: 0.03em;
                text-transform: uppercase; color: var(--ds-faint);
            }
            /* Der Wert braucht einen eigenen Kasten mit min-width:0 — sonst
               schrumpft ein Flex-Element nie unter seine Inhaltsbreite und ein
               breiter Block in der Zelle (z.B. das aufklappbare Kostenaufteilungs-
               Feld bei den Kreditoren) schiebt die Zeile wieder aus dem Bild. */
            table[data-stack] td > .fw-wert {
                display: block; flex: 1 1 auto; min-width: 0;
                text-align: right; overflow-wrap: anywhere;
            }
            /* Zellen ohne Überschrift (Aktionsspalte): kein Label. Leere Zellen ganz weg. */
            table[data-stack] td[data-label='']::before { content: none; }
            table[data-stack] td[data-leer] { display: none; }
            /* Zusammengefasste Zellen (Summenzeilen) über die volle Breite */
            table[data-stack] td[colspan]::before { content: none; }
            table[data-stack] tfoot tr { background: var(--ds-surface-2); font-weight: 600; }
        }
        /* ---- Tabellen am PC: in die Spalte passen statt quer scrollen ----
           «min-w-max» stammt aus der Zeit, als dieselbe Tabelle auch das Handy
           bedienen musste. Seit die Handy-Ansicht gestapelt wird (Block oben),
           bewirkt es am PC nur noch eines: Die Tabelle wird so breit wie ihr
           Inhalt, und der Wrapper scrollt quer. Gemessen bei 1440 px Fenster
           (1134 px Inhaltsspalte, echter Tailwind-Build):

               /neu/debitoren/    1412 px nötig  (+278)
               /neu/mietzins/     1295 px nötig  (+161)
               /neu/kreditoren/   1230 px nötig   (+96)
               /neu/vertraege/    1215 px nötig   (+81)

           Man sah also nie die ganze Zeile — Mahnstufe und Aktionen lagen
           ausserhalb des Bildes.

           Die Mindestbreite allein aufzuheben bringt NICHTS (gemessen: exakt
           dieselben 1412 px). Ursache ist «whitespace-nowrap» auf den Text-
           spalten: eine Zelle, die nicht umbrechen darf, ist ihr eigener
           Breiten-Boden. Deshalb dürfen linksbündige Textspalten hier
           umbrechen — rechtsbündige (Beträge, Daten, Aktionsknöpfe) und
           zentrierte bleiben einzeilig, sonst zerfällt die Zahlenkolonne.
           Abzeichen behalten ihr nowrap: das sitzt am <span> in der Zelle,
           nicht an der Zelle selbst.

           Der Wrapper bleibt «overflow-x-auto». Querscrollen soll nicht
           unmöglich sein (eine Tabelle mit Spalte je Bewerber braucht es
           weiterhin) — es soll nur nicht der Normalfall sein. */
        @media (min-width: 768px) {
            main table.min-w-max { min-width: 100%; }
            main table.min-w-max td:not(.text-right):not(.text-center) {
                white-space: normal;
                overflow-wrap: break-word;
            }
            /* Ab sieben Spalten sind 2×20 px Innenabstand je Spalte über
               280 px allein für Luft — dann lieber enger als hoch. Der
               Umbruch oben lässt die Debitoren-Zeile sonst von 49 auf 89 px
               wachsen; mit dem engeren Abstand sind es 69 px, bei den
               Kreditoren bleibt es bei den ursprünglichen 59 px.
               Tabellen mit weniger Spalten passten ohnehin und bleiben
               unverändert. Kennt ein Browser :has() nicht, fällt nur diese
               Feinheit weg — die Tabelle passt trotzdem. */
            main table.min-w-max:has(thead th:nth-child(7)) th.px-5,
            main table.min-w-max:has(thead th:nth-child(7)) td.px-5 {
                padding-left: 0.75rem; padding-right: 0.75rem;
            }
            /* Ab neun Spalten noch eine Stufe enger. Auf einem 1280-px-Laptop
               (974 px Inhaltsspalte) fehlten den Debitoren sonst genau 16 px —
               vom Papierkorb blieb die Hälfte im Bild. Die 8 px sparen 72 px
               und senken die Zeile dort zusätzlich von 89 auf 69 px, weil die
               Textspalten weniger umbrechen müssen. */
            main table.min-w-max:has(thead th:nth-child(9)) th.px-5,
            main table.min-w-max:has(thead th:nth-child(9)) td.px-5 {
                padding-left: 0.5rem; padding-right: 0.5rem;
            }
        }
        /* Auf einem schmalen Fenster ist die Aktionsspalte oft die breiteste
           von allen (Debitoren 192 px, Kreditoren 341 px — mehr als jede
           Datenspalte). Dort dürfen die Knöpfe umbrechen statt die ganze
           Tabelle wegzuschieben. Nur unterhalb 1280 px: auf breiten Schirmen
           bleibt die Aktionszeile wie gewohnt einzeilig.
           `:has(a, button)` trennt Aktions- von Datenzellen — eine letzte
           Spalte mit einem Betrag darf nicht umbrechen. */
        @media (min-width: 768px) and (max-width: 1279px) {
            main table.min-w-max tbody td:last-child:has(a, button) {
                white-space: normal;
            }
        }
        /* iOS: native date/month/time-Felder haben eine Eigenbreite, die w-full
           ignoriert und aus dem Container läuft. Auf Containerbreite zwingen. */
        input[type="date"], input[type="month"], input[type="week"],
        input[type="time"], input[type="datetime-local"] {
            -webkit-appearance: none; appearance: none;
            min-width: 0; max-width: 100%; box-sizing: border-box;
        }
        /* Einklappbare Sidebar — nur auf Desktop (ab lg); mobil ist es ein Drawer */
        @media (min-width: 1024px) {
            html._sbc #fwSidebar { width: 4.5rem; }
            html._sbc #fwSidebar .sb-label,
            html._sbc #fwSidebar .sb-section,
            html._sbc #fwSidebar .sb-filter,
            html._sbc #fwSidebar .sb-logotext,
            html._sbc #fwSidebar .sb-footlabel { display: none !important; }
            html._sbc #fwSidebar .sb-item { justify-content: center; gap: 0; }
            html._sbc #fwSidebar .sb-logo { justify-content: center; }
            html._sbc #fwSidebar .sb-collapse-icon { transform: rotate(180deg); }
            html._sbc #fwSidebar .sb-sub { display: none !important; }
        }
        /* Aufklapp-Pfeil der Navigationsgruppen */
        .nav-open .sb-chev .fw-zeichen { transform: rotate(90deg); }
        /* Embed-Modus (im Modal geladen): Sidebar/Topbar aus, Inhalt füllt das Fenster */
        html._embed #fwSidebar,
        html._embed header,
        html._embed #fwBackdrop,
        html._embed main { padding: 1.25rem !important; max-width: none !important; }
    
        /* ---- Aktenrahmen nach mockups/konzept-v3 (Phase 4b) --------------
           Nur Tokens, die in :root oben tatsaechlich definiert sind. Der
           Test core/tests/test_ds_tokens.py prueft das nach — eine frühere
           Fassung benutzte --ds-brand-100 und --ds-line-stark, die es nie
           gab, und machte die Regeln damit unwirksam. */
                /* Leseansicht der Akte: Gruppen aus Bezeichnung und Wert (Phase 4b).
           Ersetzt die frueheren Karten-Paare mit eingestreuten Formularen. */
                .fw-leer{padding:40px 20px;text-align:center;font-size:14px;color:var(--ds-muted)}
                .fw-leer>b{display:block;color:var(--ds-ink);font-weight:600}
                .fw-leer>b+span{display:block;margin-top:2px}
                .fw-leer>.fw-btn{margin-top:14px}
        /* ===== GRUNDVOKABULAR DER SCHICHT (E2) =====================
           Die kleinsten Bausteine: eine Flaeche, eine Linie, ein Textton.
           Sie ersetzen die fest verdrahteten Tailwind-Farbklassen, von denen
           es am 23.08.2026 noch 7444 in 135 Vorlagen gab
           (`core/tests/test_farbklassen.py` zaehlt sie abwaerts).

           WARUM ES SIE BRAUCHT
           `bg-white` bleibt weiss — auch im Dunkelmodus, auch wenn ein Mandant
           eine eigene Akzentfarbe hat. `fw-flaeche` zeigt auf ein Token und
           folgt beidem. Dasselbe fuer Linien und Textstufen.

           NAMEN AUF DEUTSCH, wie der Rest der Schicht (`fw-mutet`,
           `fw-strong`, `fw-klein`): Wer eine Vorlage liest, soll nicht
           zwischen zwei Sprachen springen.

           `fw-linie` setzt NUR die Farbe — die Breite kommt weiterhin von
           Tailwinds `border`, `border-t` &c. Das ist Absicht: Wo eine Linie
           liegt, ist Layout und gehoert in die Vorlage; WELCHE Farbe sie hat,
           ist Gestaltung und gehoert hierher.
           ========================================================== */
        .fw-flaeche{background:var(--ds-surface)}
        .fw-flaeche2{background:var(--ds-surface-2)}
        .fw-linie{border-color:var(--ds-line)}
        .fw-linie-stark{border-color:var(--ds-line-stark)}
        .hover\:fw-linie-stark:hover{border-color:var(--ds-line-stark)}
        .fw-ink{color:var(--ds-ink)}
        .fw-faint{color:var(--ds-faint)}
        .fw-marke{color:var(--ds-brand)}
        .fw-markenflaeche{background:var(--ds-brand-soft)}
        .fw-kritisch{color:var(--ds-crit)}
        .fw-gut{color:var(--ds-good)}
        .fw-linie-gut{border-color:var(--ds-good)}
        .fw-gut-flaeche{background:var(--ds-good-soft)}
        .fw-krit-flaeche{background:var(--ds-crit-soft)}
        .fw-warn-flaeche{background:var(--ds-warn-soft)}
        .fw-info-flaeche{background:var(--ds-info-soft)}
        /* Eigener Ton fuer sicherheitsrelevante Protokolleintraege. Keine
           Wertung: Eine Anmeldung ist weder gut noch schlecht, sondern
           bemerkenswert. Bis E2.7 war das Violett; seither fiel es mit
           `finanzen` auf denselben Info-Ton zusammen und der Unterschied,
           den das Logbuch machen wollte, war weg. */
        /* Sicherheitsereignisse heben sich durch UMKEHRUNG ab, nicht durch
           einen zweiten Farbton: dunkle Flaeche, helle Schrift. Damit bleibt
           die Anwendung einfarbig (Entscheid 4b.6, bewacht von
           `EinFarbtonTests`) und der Eintrag trotzdem unverwechselbar — er
           ist der einzige mit invertierter Darstellung.
           Beide Werte kippen im Dunkelmodus gemeinsam, die Umkehrung bleibt
           also in beiden Darstellungen lesbar. */
        .fw-merk{color:var(--ds-surface)}
        .fw-merk-flaeche{background:var(--ds-ink)}
        .fw-linie-marke{border-color:var(--ds-brand)}
        .fw-linie-krit{border-color:var(--ds-crit)}
        .fw-linie-warn{border-color:var(--ds-warn)}
        .fw-info{color:var(--ds-info)}
        /* Bedienelemente: Haken, Schieber und Fokusringe faerbt der Browser
           selbst — `accent-color` und `outline` sind die einzigen Wege dorthin.

           NACHGEMESSEN, WEIL DIE ERSTE BEGRUENDUNG NICHT TRUG: Hier stand,
           ohne diese zwei Zeilen blieben «indigoblaue Haken neben
           petrolfarbenen Knoepfen» stehen. Das stimmt nicht — die Palette in
           `tailwind.palette.js` definiert `indigo` auf die Marke um, und im
           Bau steht tatsaechlich `.accent-indigo-600{accent-color:#0f6f6a}`.
           Die Haken sind also laengst petrol.

           Der Gewinn ist ein anderer, und er ist echt: `accent-indigo-600`
           steht zur BAUZEIT auf einer festen Farbe. `var(--ds-brand)` folgt
           dem Token — also dem Dunkelmodus und spaeter der Akzentfarbe je
           Mandant (D3). Genau das kann die Palette nicht leisten.

           `accent-indigo` steht noch in 17 weiteren Vorlagen. Sie sehen heute
           richtig aus und fallen erst auf, wenn Branding kommt. */
        .fw-akzent{accent-color:var(--ds-brand)}
        /* Ein Haken, der Loeschen bedeutet, ist rot — auch der Haken selbst.
           `accent-color` ist der einzige Weg dorthin (siehe fw-akzent). */
        .fw-akzent-krit{accent-color:var(--ds-crit)}
        .fw-akzent-warn{accent-color:var(--ds-warn)}
        /* Warnring um ein Feld, das Aufmerksamkeit braucht. */
        .fw-ring-warn{box-shadow:0 0 0 3px color-mix(in srgb, var(--ds-warn) 35%, transparent)}
        /* Abdunkelung hinter einem Dialog. Bewusst KEIN Token: Ein Vorhang
           ist in beiden Darstellungen dunkel — im Hellmodus, damit der Dialog
           heraussticht, im Dunkelmodus, damit der Hintergrund zurueckfaellt. */
        .fw-vorhang{background:rgba(6,20,23,.55)}
        .fw-fokusring:focus{outline:2px solid var(--ds-brand);outline-offset:2px}

        /* ZUSTAENDE — NACHGETRAGEN, WEIL SIE SEIT E2.1 STILL FEHLTEN
           ------------------------------------------------------------------
           `hover:bg-slate-50` funktioniert, weil Tailwind die Regel dafuer
           ERZEUGT. `hover:fw-flaeche2` funktioniert NICHT: `fw-flaeche2` ist
           von Hand geschrieben, Tailwind kennt sie nicht und baut folglich
           auch keine Varianten-Regel. Der Browser sieht dann eine Klasse
           namens `hover:fw-flaeche2`, auf die keine einzige Regel passt.

           Im Browser nachgemessen (Chromium, echte Seite, echte
           Stylesheets): unter 292 geladenen Regeln passte KEINE auf
           `hover:fw-*`, `focus:fw-*`, `file:fw-*` oder `group-hover:fw-*`.
           Die Umstellung auf die Komponentenschicht hatte damit
           funktionierende Hover-Zustaende durch tote Klassennamen ersetzt —
           113 Vorkommen in 17 Vorlagen. Sichtbar wird das nie als Fehler,
           nur als eine Oberflaeche, die sich nicht mehr regt.

           Dieselbe Messung erklaert die Zeilen darunter ohne Modifikator:
           `fw-markenflaeche/60` ergab `rgba(0,0,0,0)` — der Opazitaets-Zusatz
           ist ebenfalls reine Tailwind-Syntax und macht aus einer gueltigen
           Klasse einen toten Namen. Diese Stellen sind in den Vorlagen auf
           die Grundklasse zurueckgesetzt.

           `core/tests/test_fw_klassen_wirken.py` haelt das fest: Jede
           `fw-`-Klasse in einer Vorlage muss von einer Regel getroffen
           werden. Genau dieser Waechter hat in E2.5 die drei Regeln
           nachgefordert, die unten dazugekommen sind (`file:fw-flaeche2`,
           `file:fw-ink`, `hover:fw-warn-flaeche`) — die neu umgestellten
           Seiten brauchten sie. */
        .hover\:fw-flaeche2:hover{background:var(--ds-surface-2)}
        /* Weitere Zustands-Praefixe, die beim Umstellen entstanden sind.
           `placeholder:` und `disabled:` tragen Bedeutung — ein deaktiviertes
           Feld MUSS anders aussehen —, deshalb bekommen sie Regeln statt
           gekuerzt zu werden. */
        .placeholder\:fw-faint::placeholder{color:var(--ds-faint)}
        .disabled\:fw-balken:disabled{background:var(--ds-line)}
        .disabled\:fw-faint:disabled{color:var(--ds-faint)}
        .disabled\:fw-flaeche2:disabled{background:var(--ds-surface-2)}
        .hover\:fw-flaeche:hover{background:var(--ds-surface)}
        .focus\:fw-flaeche:focus{background:var(--ds-surface)}
        .focus\:fw-linie:focus{border-color:var(--ds-line)}
        .hover\:fw-markenflaeche:hover{background:var(--ds-brand-soft)}
        .hover\:fw-krit-flaeche:hover{background:var(--ds-crit-soft)}
        .hover\:fw-info-flaeche:hover{background:var(--ds-info-soft)}
        .hover\:fw-warn-voll:hover{background:var(--ds-warn)}
        .hover\:fw-warnton:hover{color:var(--ds-warn)}
        .group:hover .group-hover\:fw-balken-voll{background:var(--ds-brand)}
        .group:hover .group-hover\:fw-markenflaeche{background:var(--ds-brand-soft)}
        .group:hover .group-hover\:fw-warnton{color:var(--ds-warn)}
        .group:hover .group-hover\:fw-marke{color:var(--ds-brand)}
        .hover\:fw-warn-flaeche:hover{background:var(--ds-warn-soft)}
        .hover\:fw-gut-flaeche:hover{background:var(--ds-good-soft)}
        .hover\:fw-marke:hover{color:var(--ds-brand)}
        .hover\:fw-kritisch:hover{color:var(--ds-crit)}
        .hover\:fw-gut:hover{color:var(--ds-good)}
        .hover\:fw-ink:hover{color:var(--ds-ink)}
        .hover\:fw-mutet:hover{color:var(--ds-faint)}
        .hover\:fw-linie-marke:hover{border-color:var(--ds-brand)}
        .focus\:fw-linie-marke:focus{border-color:var(--ds-brand)}
        .hover\:fw-linie-krit:hover{border-color:var(--ds-crit)}
        .hover\:fw-linie-gut:hover{border-color:var(--ds-good)}
        .hover\:fw-linie-warn:hover{border-color:var(--ds-warn)}
        .hover\:fw-balken:hover{background:var(--ds-line)}
        .hover\:fw-balken-voll:hover{background:var(--ds-brand)}
        .focus-within\:fw-markenflaeche:focus-within{background:var(--ds-brand-soft)}
        .group:hover .group-hover\:fw-marke{color:var(--ds-brand)}
        /* Dateiwahl-Knopf: der Browser gestaltet ihn ueber ein eigenes
           Pseudoelement, an das weder Hintergrund- noch Textfarbe des
           Elternelements herankommt. */
        .file\:fw-marke::file-selector-button{color:var(--ds-brand)}
        /* Nachgetragen mit E2.10: Die oeffentlichen Seiten benutzen diese
           Zustaende, und seit die Schicht auch dort ankommt, faellt auf,
           dass es die Regeln dafuer nie gab. */
        .focus\:fw-ring-krit:focus{box-shadow:0 0 0 3px color-mix(in srgb, var(--ds-crit) 35%, transparent)}
        .hover\:fw-info:hover{background:var(--ds-info-soft);color:var(--ds-info)}
        .hover\:fw-strong:hover{font-weight:600;color:var(--ds-ink)}
        .hover\:file\:fw-markenflaeche:hover::file-selector-button{background:var(--ds-brand-soft)}
        .hover\:file\:fw-balken:hover::file-selector-button{background:var(--ds-line)}
        .file\:fw-flaeche2::file-selector-button{background:var(--ds-surface-2)}
        .file\:fw-ink::file-selector-button{color:var(--ds-ink)}
        .file\:fw-markenflaeche::file-selector-button{background:var(--ds-brand-soft)}
        .file\:fw-balken-voll::file-selector-button{background:var(--ds-brand)}
        .hover\:file\:fw-balken-voll:hover::file-selector-button{background:var(--ds-brand)}

        /* Balken und Fuellstaende (Fortschritt, Auslastung). */
        .fw-balken{background:var(--ds-line)}
        .fw-balken-voll{background:var(--ds-brand);color:var(--ds-auf-satt)}
        /* Verlauf in der Markenfarbe — Kopfzeile des Mieterportals.
           Eigene Tokens (siehe --ds-verlauf-von): Die Schrift darauf ist
           immer weiss, also muss der Grund in beiden Modi dunkel bleiben. */
        .fw-marke-verlauf{background:linear-gradient(135deg,var(--ds-verlauf-von),var(--ds-verlauf-bis))}
        /* Glasflaeche AUF dem Markenverlauf: halbdurchsichtiges Weiss, damit
           weisse Schrift darauf lesbar bleibt. `fw-flaeche` ist dort falsch —
           sie ist im hellen Modus weiss, und weiss auf weiss ist unsichtbar. */
        .fw-glas{background:rgba(255,255,255,.15)}
        .fw-marke-verlauf .fw-faint{color:rgba(255,255,255,.85)}
        /* Gesaettigtes Gruen als Flaeche — fuer Absendeknoepfe mit
           eigenen Massen, die `fw-btn` nicht mitnehmen koennen. */
        .fw-gut-voll{background:var(--ds-good);color:var(--ds-auf-satt)}
        .fw-krit-voll{background:var(--ds-crit);color:var(--ds-auf-satt)}
        .fw-warn-voll{background:var(--ds-warn);color:var(--ds-auf-satt)}
        /* Neutraler Schatten — bisher `shadow-slate-300/40` im Profilmenue. */
        .fw-schatten{box-shadow:var(--ds-shadow)}
        .fw-gut-voll:hover{filter:brightness(.92)}
        .fw-link{color:var(--ds-brand);font-weight:600;text-decoration:none;font-size:13px}
        .fw-link:hover{text-decoration:underline}
        .fw-klein{font-size:12px;color:var(--ds-faint)}

        /* Bereichsinhalte (Phase 4b.4). Bis hierher deckte die Komponenten-
           schicht nur den Aktenkopf ab; die Reiterinhalte blieben deshalb
           Tailwind. Drei Bausteine fehlten und werden in jedem Bereich
           gebraucht — Betrag, Eingabefeld, Symbolknopf. */
        .fw-betrag{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ds-ink);
            white-space:nowrap}
        .fw-betrag.crit{color:var(--ds-crit)}
        .fw-betrag.good{color:var(--ds-good)}
        .fw-betrag.mut{color:var(--ds-muted);font-weight:500}
        /* Ein Formularfeld, das nicht nach Systemelement aussieht. `font:inherit`
           ist Absicht: Ohne das erben `select` und `textarea` die Schriftart des
           Betriebssystems und stehen neben dem Fliesstext. */
        .fw-feld{background:var(--ds-surface);border:1px solid var(--ds-line-stark);
            border-radius:var(--ds-radius-knopf);padding:8px 12px;font-size:14px;min-height:38px;
            color:var(--ds-ink);font-family:inherit;max-width:100%;transition:border-color .12s,box-shadow .12s}
        .fw-feld:focus{outline:none;border-color:var(--ds-brand);box-shadow:0 0 0 3px var(--ds-brand-soft)}
        /* Feldfehler (Audit Etappe 2): Ein Formular kommt mit der Meldung AM
           Feld zurück, nicht mit einem Toast und leeren Feldern. Die Rahmenfarbe
           allein trägt die Aussage nicht (Farbsehschwäche) — deshalb steht der
           Text darunter, und `aria-describedby` verknüpft ihn mit dem Feld. */
        .fw-feld[aria-invalid="true"]{border-color:var(--ds-crit)}
        .fw-feld[aria-invalid="true"]:focus{outline-color:var(--ds-crit)}
        /* Dieselbe Aussage für Felder, die noch nicht auf `fw-feld` stehen
           (Personenformular): Wer `aria-invalid` trägt, ist als fehlerhaft
           markiert — dann auch sichtbar, nicht nur für den Screenreader. */
        input[aria-invalid="true"],textarea[aria-invalid="true"],select[aria-invalid="true"]{
            border:1px solid var(--ds-crit)}
        .fw-feldfehler{margin-top:4px;font-size:12px;line-height:1.35;color:var(--ds-crit)}
        .fw-formfehler{background:var(--ds-crit-soft);color:var(--ds-ink);
            border-radius:var(--ds-radius);padding:12px 16px;font-size:13px}
        .fw-formfehler b{color:var(--ds-crit)}
        /* `fw-ikon` war bisher nur Zierrat im Kartenkopf. Als Knopf braucht es
           einen stummen Ruhezustand (`mut`) und, wo geloescht wird, eine
           Warnfarbe erst beim Darueberfahren (`gefahr`) — ein dauerrotes
           Papierkorbsymbol in jeder Zeile schreit ohne Anlass. */
        /* Zeile in einem Aktionsmenue («Mehr»). Die Farbe sagt, wie weit die
           Aktion reicht — `crit` loescht, `warn` greift ein. */
        .fw-menuzeile{width:100%;text-align:left;display:flex;align-items:center;gap:10px;
            padding:8px 16px;font-size:13px;font-weight:600;background:none;border:0;
            cursor:pointer;color:var(--ds-ink)}
        .fw-menuzeile:hover{background:var(--ds-surface-2)}
        .fw-menuzeile.warn{color:var(--ds-warn)}
        .fw-menuzeile.warn:hover{background:var(--ds-warn-soft)}
        .fw-menuzeile.crit{color:var(--ds-crit)}
        .fw-menuzeile.crit:hover{background:var(--ds-crit-soft)}
        .fw-menutrenner{margin:5px 0;border-top:1px solid var(--ds-line)}
        /* Aktionsmenüs liegen über allem auf der Seite (Kopfleiste und Schubladen ausgenommen).
           Der Block, in dem ein Menü offen ist, wird angehoben — sonst malt ihn der nächste
           Block mit eigenem Stapelkontext (Karte beim Zeigen, laufende Animation) darüber. */
        div[data-menu-list]{z-index:70}
        div[data-menu-list].fw-menu-oben{top:auto;bottom:100%;margin-top:0;margin-bottom:6px}
        .fw-inhalt>*:has(>[data-menu] [data-menu-list]:not(.hidden)),
        .fw-inhalt>*:has([data-menu-list]:not(.hidden)){position:relative;z-index:50}
        .fw-card:has([data-menu-list]:not(.hidden)),.fw-phead:has([data-menu-list]:not(.hidden)){position:relative;z-index:50;overflow:visible}
        .fw-ikon.mut{background:var(--ds-surface-2);color:var(--ds-faint)}
        button.fw-ikon{border:0;cursor:pointer;padding:0}
        button.fw-ikon.gefahr:hover{background:var(--ds-crit-soft);color:var(--ds-crit)}

        .fw-gruppe{padding:12px 16px 5px;font-size:12px;font-weight:700;letter-spacing:.14em;
            text-transform:uppercase;color:var(--ds-brand);background:var(--ds-surface-2);
            border-top:1px solid var(--ds-line);border-bottom:1px solid var(--ds-line)}
        .fw-dz{display:flex;gap:16px;padding:9px 16px;border-bottom:1px solid var(--ds-line);
            align-items:baseline}
        .fw-dz:last-child{border-bottom:0}
        .fw-dl{flex:0 0 205px;font-size:12px;color:var(--ds-faint)}
        .fw-dl.fw-dl-schmal{flex-basis:105px}  /* kurze Beschriftung (Kontaktzeilen im Vertrag); mit .fw-dl allein gewänne dessen 205px */
        .fw-dv{flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--ds-ink)}
        .fw-dv small{display:block;font-size:12px;color:var(--ds-faint);font-weight:400;
            margin-top:2px;line-height:1.45}
        @media(max-width:640px){.fw-dz{flex-direction:column;gap:2px}.fw-dl,.fw-dl.fw-dl-schmal{flex-basis:auto}}

        /* Erfassen gehoert nicht in eine Leseansicht — aber auch nicht weg. */
        .fw-aufklapp{border-bottom:1px solid var(--ds-line)}
        .fw-aufklapp>summary{padding:9px 16px;font-size:13px;font-weight:600;
            color:var(--ds-brand);cursor:pointer;list-style:none;display:flex;
            align-items:center;gap:7px}
        /* Pfeil aus zwei Raendern statt aus Font Awesome. Die Schrift wird
           seit E2.43 nicht mehr geladen — bis zum Redesign stand hier ein
           leeres Kaestchen. */
        .fw-aufklapp>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;
            border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
        .fw-aufklapp[open]>summary::before{transform:rotate(45deg)}
        .fw-aufklapp>summary:hover{background:var(--ds-surface-2)}
        .fw-aufklapp-inhalt{padding:4px 16px 14px;background:var(--ds-surface-2)}

        .fw-statuswahl{padding:5px 11px;border-radius:var(--ds-radius-sm);font-size:12px;
            font-weight:600;color:var(--ds-muted);background:none;border:0;cursor:pointer}
        .fw-statuswahl:hover{color:var(--ds-ink)}
        .fw-statuswahl.an{background:var(--ds-surface);color:var(--ds-ink);box-shadow:var(--ds-shadow-sm)}
        .fw-statuswahl.an.gut{background:var(--ds-good);color:var(--ds-auf-satt)}
        .fw-aktenkopf{background:var(--ds-surface);border:1px solid var(--ds-line);
            border-radius:var(--ds-radius);box-shadow:var(--ds-shadow);
            margin-bottom:16px;overflow:hidden}
        .fw-akte-oben{padding:17px 20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
        .fw-akte-bild{width:48px;height:48px;border-radius:var(--ds-radius-sm);
            background:var(--ds-brand-soft);color:var(--ds-brand);display:flex;
            align-items:center;justify-content:center;flex:0 0 48px;font-size:22px}
        .fw-akte-typ{font-size:12px;font-weight:700;letter-spacing:.14em;
            text-transform:uppercase;color:var(--ds-faint);margin-bottom:4px}
        .fw-akte-oben h1{margin:0;font-size:22px;line-height:1.2;font-weight:600;letter-spacing:-.02em;color:var(--ds-ink)}
        .fw-akte-pfad{font-size:12px;color:var(--ds-faint);margin-top:4px;line-height:1.55}
        .fw-akte-pfad b{color:var(--ds-muted);font-weight:600}
        /* Eine Angabe je Zeile, Beschriftungen untereinander ausgerichtet.
           Die feste Spaltenbreite ist der Zweck der Uebung: Ohne sie stuenden
           die Werte je nach Laenge der Beschriftung versetzt und die Spalte
           waere wieder nicht lesbar. Unter 640 px klappt es auf zwei Zeilen
           je Angabe um, statt die Werte zu quetschen. */
        .fw-akte-pfad .fw-pz{display:flex;gap:10px;align-items:baseline}
        .fw-akte-pfad .fw-pz>span{flex:0 0 84px;color:var(--ds-faint)}
        .fw-akte-pfad .fw-pz>b{flex:1;min-width:0}
        @media(max-width:640px){
            .fw-akte-pfad .fw-pz{flex-direction:column;gap:0;margin-bottom:4px}
            .fw-akte-pfad .fw-pz>span{flex-basis:auto;font-size:12px;
                text-transform:uppercase;letter-spacing:.08em}
        }
        .fw-akte-rechts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

        .fw-kzn{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ds-line)}
        .fw-kzn>div{padding:12px 20px;border-right:1px solid var(--ds-line)}
        .fw-kzn>div:last-child{border-right:0}
        .fw-kzn .fw-l{font-size:13px;font-weight:500;color:var(--ds-muted)}
        .fw-kzn .fw-w{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:4px;
            font-variant-numeric:tabular-nums;color:var(--ds-ink)}
        .fw-kzn .fw-w.warn{color:var(--ds-warn)}
        .fw-kzn .fw-w.crit{color:var(--ds-crit)}
        .fw-kzn .fw-w.good{color:var(--ds-good)}
        .fw-kzn .fw-f{font-size:12px;color:var(--ds-faint);margin-top:2px}
        /* Der Titel einer Frist ist regelmaessig breiter als seine Spalte:
           «Art. 257d: Zahlungsfrist läuft ab – Behlül Piskin» sind 48 Zeichen.
           Vorher schnitt `truncatechars:38` ihn mitten im Namen ab («– B…»),
           und gerade der Name sagt, um wen es geht. Jetzt zwei Zeilen, danach
           erst die Auslassung; der volle Text steht zusaetzlich im
           title-Attribut. Kennt ein Browser `-webkit-line-clamp` nicht,
           bricht der Text einfach vollstaendig um — auch das ist besser als
           ein abgeschnittenes Wort. */
        .fw-kzn .fw-f.fw-lang{display:-webkit-box;-webkit-line-clamp:2;
            -webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
        @media(max-width:900px){.fw-kzn{grid-template-columns:1fr 1fr}}
        /* DIE ZELLE WIRD AM TELEFON ENGER (E2.76).

           Bei 390 Pixel steht die Leiste als 2x2-Raster, und jede Zelle bringt
           ihre vollen 24 Pixel Innenabstand ZWEIMAL ein — einmal je Reihe. Die
           Fusszeile bricht dort ohnehin auf zwei Zeilen (129 Pixel Spaltenbreite),
           die Zelle wird 104 Pixel hoch, die Leiste 206.

           Gemessen, alle Akten mit Kennzahlenleiste: je MINUS 24 PIXEL.
             Vertrag 206->182 · Liegenschaft 190->166 · Objekt 192->168
           Die Personenakte fuehrt keine und bleibt unberuehrt.

           NICHT ueber den Falz — die Linie 844 ist der CSS-Viewport im Test;
           echtes Mobile-Safari zeigt mit Adressleiste weniger. Was das bringt,
           ist kuerzerer Scrollweg auf jeder Akte, keine geloeste Falzfrage.

           VERWORFEN: die Fusszeile auf eine Zeile zwingen (`nowrap` +
           `ellipsis`). Gemessen 206->212 — es wurde SCHLECHTER, und es haette
           ausserdem Text abgeschnitten. Am Bildschirm nachgemessen statt
           angenommen. */
        @media(max-width:820px){
            .fw-kzn>div{padding:8px 14px}
            .fw-kzn .fw-w{margin-top:1px}
            .fw-kzn .fw-f{margin-top:0}
            /* v8: Werte 20 px am Desktop; am Telefon 18 px, sonst wuchs die
               Leiste der Vertragsakte von 182 auf 197 px (telefon.spec.ts). */
            .fw-kzn .fw-w{font-size:18px}
        }

        /* EINE REIHE, SEITLICH ROLLBAR — nicht umbrechen.

           `flex-wrap:wrap` machte auf 390 Pixel drei Reihen und 130 Pixel
           Hoehe; Konzept v7 zeigt eine Reihe.

           Nur der Behaelter aendert sich. Die Reiter selbst tragen bereits
           `white-space:nowrap` — sowohl `.fw-reiter a` (Startseite) als auch
           `.fw-reiter button` (Aktenreiter). Eine zusaetzliche Regel dafuer
           waere doppelt, und die auf `button` griffe auf der Startseite
           ohnehin nicht: Dort sind die Reiter `<a>`. */
        .fw-reiter{display:flex;gap:2px;border-top:1px solid var(--ds-line);border-bottom:1px solid var(--ds-line);
            padding:6px 14px 0;background:var(--ds-surface);
            flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
        .fw-reiter::-webkit-scrollbar{display:none}
        .fw-reiter button{position:relative;padding:9px 10px 12px;font-size:13px;font-weight:500;
            color:var(--ds-muted);cursor:pointer;background:none;border:0;
            white-space:nowrap;
            display:flex;align-items:center;gap:7px;transition:color .12s}
        .fw-reiter button:hover{color:var(--ds-ink)}
        .fw-reiter button.hier{color:var(--ds-ink);font-weight:600}
        .fw-reiter button.hier::after,.fw-reiter a.hier::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;
            height:2px;border-radius:var(--ds-radius-xs);background:var(--ds-brand)}
        .fw-reiter .fw-z{font-size:12px;font-weight:600;background:var(--ds-surface-2);color:var(--ds-faint);
            border:1px solid var(--ds-line);border-radius:var(--ds-pill);padding:0 6px;min-width:20px;text-align:center}

        .fw-kopf{padding:16px 20px;border-bottom:1px solid var(--ds-line);
            display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .fw-kopf h2,.fw-kopf .fw-t{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ds-ink)}
        .fw-kopf .fw-neben{font-size:13px;color:var(--ds-faint)}
        .fw-kopf .fw-rechts{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
        .fw-ikon{width:30px;height:30px;border-radius:var(--ds-radius-knopf);
            background:var(--ds-brand-soft);color:var(--ds-brand);display:flex;
            align-items:center;justify-content:center;flex:0 0 30px;font-size:14px}
        .fw-ikon.warn{background:var(--ds-warn-soft);color:var(--ds-warn)}
        .fw-ikon.crit{background:var(--ds-crit-soft);color:var(--ds-crit)}
        .fw-ikon.good{background:var(--ds-good-soft);color:var(--ds-good)}
        .fw-fuss{padding:12px 20px;border-top:1px solid var(--ds-line);display:flex;
            justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ds-faint)}
        /* Listen-Werkzeugkasten (Audit Etappe 4): Suche, Sortierung, Export in
           einer Zeile; am Telefon bricht sie um, die Suche nimmt die ganze Breite. */
        .fw-listwerkzeug{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
        .fw-listwerkzeug .fw-suchfeld{flex:1 1 240px;max-width:384px;min-width:0}
        .fw-listwerkzeug .fw-suchfeld .fw-feld{width:100%}
        /* Platz für die Lupe links im Suchfeld (vorher Inline-Stil) */
        .fw-suchfeld > .fw-zeichen ~ .fw-feld{padding-left:2.5rem}
        .fw-listwerkzeug.fw-imkopf{margin:0 0 0 auto}
        /* Mit Skript wirkt die Auswahl der Sortierung sofort (`data-absenden`) und Enter sucht: «Anwenden» entfällt (UI-Zielbild,
           Phase 0). Ohne Skript bleibt der Knopf, sonst liesse sich die Liste nicht umsortieren. */
        html.fw-js .fw-listwerkzeug button[type="submit"]{display:none}
        .fw-listwerkzeug label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ds-muted)}
        .fw-seiten{padding:10px 15px;border-top:1px solid var(--ds-line);display:flex;
            justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
            font-size:12px;color:var(--ds-muted)}
        .fw-card > .fw-seiten:first-child{border-top:0}
        .fw-seiten-knoepfe{display:inline-flex;align-items:center;gap:8px}
        .fw-seiten .fw-btn{padding:6px 11px;font-size:12px}

        .fw-zeile{display:flex;align-items:center;gap:16px;padding:12px 20px;
            flex-wrap:nowrap;border-bottom:1px solid var(--ds-line);transition:background .12s}
        .fw-zeile:last-child{border-bottom:0}
        .fw-zeile.klick{cursor:pointer}
        .fw-zeile.klick:hover{background:var(--ds-hover)}
        .fw-zeile .fw-mitte{flex:1;min-width:0}
        .fw-zeile .fw-t{font-size:14px;font-weight:600;letter-spacing:-.005em;color:var(--ds-ink)}
        .fw-zeile .fw-s{font-size:13px;color:var(--ds-muted);margin-top:3px;line-height:1.45}
        .fw-zeile .fw-zeit{font-size:13px;font-weight:700;color:var(--ds-muted);
            font-variant-numeric:tabular-nums;white-space:nowrap}
        /* Auf dem Handy bekommt der Titel die VOLLE Breite, alles andere
           rutscht darunter.
           Betrag, Datum und Knopf sind `white-space:nowrap` und geben keine
           Breite ab; in einer einzeiligen Flexbox wird der Titel dazwischen
           auf Handbreit zusammengedrueckt und die Zeile dadurch turmhoch —
           bei 390 px gemessen: Titelbreite 55–95 px.
           Dieselbe Loesung hatte die alte Inbox als Tailwind-Utilities am
           einzelnen Element (`basis-full sm:basis-0`). Hier steht sie einmal
           an `.fw-zeile` und gilt damit fuer jede Zeile der Anwendung —
           Arbeitsvorrat, Termine, Freigaben, Mandate, Regelwerk. */
        @media(max-width:640px){
            /* Am Telefon zurueck auf 12 px Abstand: Die Rechnung unten zieht
               genau 3 (Marker) + 12 (Abstand) ab. Auf dem Desktop sind es seit
               dem Redesign 16. */
            .fw-zeile{flex-wrap:wrap;gap:12px;padding:12px 16px}
            /* DER MARKER GEHOERT NEBEN DEN TEXT, NICHT DARUEBER.

               `flex-basis:100%` an der Mitte draengte ihn auf eine eigene
               Zeile — ein Farbbalken ueber leerem Grund. Abgezogen werden
               genau seine 3 Pixel plus die 12 des `gap` an `.fw-zeile`:
               fuenfzehn. Elf waeren vier zu wenig, und die Zeile braeche
               trotzdem um; bei Flexbox entscheidet das einzelne Pixel.

               MEHR ABZUZIEHEN IST NICHT ERLAUBT. Ein Zwischenstand nahm 120
               Pixel, um die Zeit neben den Titel zu stellen — die Zeile wurde
               kuerzer, aber der Titel schmaler, und genau davor warnt die
               Messung an `test_inbox_titel_bekommt_mobil_die_volle_breite`
               (55-95 Pixel Restbreite). Kuerzer ist nicht richtig. */
            .fw-zeile .fw-mitte{flex-basis:calc(100% - 15px);min-width:0}
            .fw-zeile .fw-marker{align-self:stretch}
            .fw-zeile .fw-zeit{flex:0 0 auto;text-align:left;font-size:12px;
                display:flex;align-items:baseline;gap:6px}
            .fw-zeile .fw-zeit br{display:none}
            /* DER CHIP HINTER DIE MITTE (E2.73).
               Im Markup steht er ZWISCHEN Marker und Mitte. `.fw-mitte` hat
               oben `flex-basis:calc(100% - 15px)` und passt damit exakt neben
               den 3px-Marker — der Chip dazwischen draengt sie auf eine eigene
               Zeile, und die erste traegt dann nur noch ein Wort («Geld»).
               Gemessen bei 390 Pixel auf `/neu/`: Zeile 157 -> 113 Pixel,
               Karte 717 -> 541.
               KIND-SELEKTOR, nicht Nachfahre: Chips innerhalb von `.fw-mitte`
               sind keine Flex-Kinder der Zeile, `order` bliebe dort wirkungs-
               los und die Regel nur Behauptung. Nachgemessen: betroffen sind
               ausschliesslich die vier Zeilen der Aufgaben-Karte. */
            .fw-zeile > .fw-chip{order:4}
            .fw-zeile .fw-kuerzel{order:5}
            .fw-zeile .fw-btn{order:6;flex:0 0 auto}
            /* Die Ikone entfaellt: Der Balken links sagt dasselbe in 3 statt
               27 Pixel, und die sind am Telefon der Unterschied. */
            .fw-zeile .fw-ikon{display:none}
        }

        .fw-marker{width:3px;align-self:stretch;border-radius:2px;background:var(--ds-line);
            flex:0 0 3px;min-height:32px}
        .fw-marker.crit{background:var(--ds-crit)}
        .fw-marker.warn{background:var(--ds-warn)}
        .fw-marker.good{background:var(--ds-good)}
        .fw-marker.brand{background:var(--ds-brand)}

        .fw-hinweis{padding:13px 16px;display:flex;gap:12px;align-items:flex-start;
            border-bottom:1px solid var(--ds-line)}
        .fw-hinweis:last-child{border-bottom:0}
        /* Per Skript versteckt: Bausteine mit eigenem display (flex/grid)
           kommen nach Tailwinds .hidden und würden es sonst überstimmen. */
        .fw-btn.hidden,.fw-hinweis.hidden,.fw-formular.hidden,.fw-feldblock.hidden,.fw-kpis.hidden,.fw-zeile.hidden{display:none}
        .fw-hinweis.warn{background:var(--ds-warn-soft)}
        .fw-hinweis.crit{background:var(--ds-crit-soft)}
        .fw-hinweis.info{background:var(--ds-info-soft)}
        .fw-hinweis.good{background:var(--ds-good-soft)}
        .fw-hinweis .fw-hi{width:26px;height:26px;border-radius:var(--ds-pill);display:flex;
            align-items:center;justify-content:center;flex:0 0 26px;color:var(--ds-auf-satt);font-size:12px}
        .fw-hinweis.warn .fw-hi{background:var(--ds-warn)}
        .fw-hinweis.crit .fw-hi{background:var(--ds-crit)}
        .fw-hinweis.info .fw-hi{background:var(--ds-info)}
        .fw-hinweis.good .fw-hi{background:var(--ds-good)}
        .fw-hinweis .fw-ht{flex:1;font-size:13px;line-height:1.55;color:var(--ds-muted)}
        .fw-hinweis .fw-ht b{display:block;margin-bottom:3px;color:var(--ds-ink)}
        /* Fliesstext: <b> in übersetzten Sätzen bleibt in der Zeile */
        .fw-hinweis .fw-ht.fliess b{display:inline;margin:0}

        /* Befund einer Regelpruefung (Fristenwaechter). Anders als .fw-hinweis
           traegt er eine aufklappbare Rechnung und eine Fusszeile mit dem
           Regelstand — der Rand links macht die Schwere ohne Farbflaeche
           lesbar, auch bei Rot-Gruen-Schwaeche. */
        .fw-befund{border:1px solid var(--ds-line);border-left-width:3px;
            border-radius:var(--ds-radius);overflow:hidden;background:var(--ds-surface)}
        .fw-befund.good{border-left-color:var(--ds-good);background:var(--ds-good-soft)}
        .fw-befund.warn{border-left-color:var(--ds-warn);background:var(--ds-warn-soft)}
        .fw-befund.crit{border-left-color:var(--ds-crit);background:var(--ds-crit-soft)}
        .fw-befund-kopf{display:flex;gap:12px;align-items:flex-start;padding:13px 16px}
        .fw-befund-kosten{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;
            padding:0 16px 13px}
        .fw-befund-kosten .fw-betrag{font-size:18px}
        .fw-befund-fuss{padding:9px 16px;border-top:1px solid var(--ds-line);
            background:var(--ds-surface)}
        .fw-befund .fw-aufklapp{border-top:1px solid var(--ds-line);border-bottom:0}
        .fw-befund .fw-aufklapp-inhalt{background:var(--ds-surface)}

        /* Kleinteile, die beim Umstellen der Objektakte (4b.11) aus
           Tailwind-Utilities wurden. Sie standen dort als je vier bis sechs
           Klassen nebeneinander — an 170 Stellen. */
        .fw-pflicht{color:var(--ds-crit)}                 /* das * hinter «Feld *» */
        /* KLEINE SCHRIFTGRADE (Audit Etappe 3). Vorher standen in den fw-Vorlagen
           acht frei gewählte Pixelwerte (8, 9, 10, 11, 12, 12.5, 13, 15 px, zusammen
           471 Stellen) — 8 und 9 px sind am Telefon kaum lesbar, und niemand wusste,
           welcher Wert wofür gilt. Jetzt vier Stufen unterhalb von Tailwinds
           `text-sm`. Wie die alten `text-[Npx]` setzen sie NUR die Grösse, nicht die
           Zeilenhöhe — sonst verschöbe sich jede dichte Zeile.
           Neue Pixelwerte in fw-Vorlagen hält test_audit_etappe3 fern. */
        .fw-fs-mikro{font-size:10px}   /* Kürzel, Zähler, kleine Symbole */
        .fw-fs-klein{font-size:12px}   /* Beschriftungen, Nebenzeilen */
        .fw-fs-fein{font-size:13px}    /* dichter Fliesstext in Karten */
        .fw-fs-text{font-size:14px}    /* wie text-sm, aber ohne Zeilenhöhe */
        .fw-fs-15{font-size:15px}      /* Kennzahl in der Kopfzeile eines Falls oder Schadens */
        .fw-status-gruppe{background:var(--ds-surface-2);border-radius:var(--ds-radius-sm);padding:2px;gap:2px}  /* Status-Schnellwahl im Vertrag */
        .fw-marke-link{color:var(--ds-brand)}  /* Textlink in der Markenfarbe */
        .pvsec{background:var(--ds-surface-2);font-weight:700;font-size:12px;padding:4px 8px;margin-top:14px;border-radius:var(--ds-radius-sm)}  /* Abschnittskopf der Live-Vorschau im Vertragsassistenten (stand als <style> im Skript) */
        .fw-zeichenflaeche{height:150px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}  /* Unterschriftsfeld: iOS wertet einen Zug sonst als Textauswahl */
        .fw-card-compliance{border:2px solid #c0392b}  /* STWEG: Gemeinschaft nicht compliance-konform */
        .fw-chip.fw-chip-compliance{background:#c0392b;color:#fff}
        /* Bestätigungsdialog (fw/_bestaetigen.html) statt der Browser-Rückfrage.
           `<dialog>` mit showModal(): Fokusfalle, Esc und Hintergrund liefert der
           Browser; hier nur das Aussehen. */
        .fw-bestaetigen{border:1px solid var(--ds-line);border-radius:var(--ds-radius-lg);padding:22px 24px;
            width:calc(100% - 32px);max-width:440px;background:var(--ds-surface);
            color:var(--ds-ink);box-shadow:var(--ds-shadow-lg)}
        .fw-bestaetigen::backdrop{background:var(--ds-scrim)}
        .fw-bestaetigen-titel{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0 0 8px}
        .fw-bestaetigen-text{font-size:14px;line-height:1.5;color:var(--ds-muted);margin:0 0 18px;white-space:pre-line}
        .fw-bestaetigen-knoepfe{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
        .fw-mutet{color:var(--ds-faint)}
        .fw-kopfzeile{text-align:left;font-size:12px;text-transform:uppercase;
            letter-spacing:.04em;color:var(--ds-faint);
            border-bottom:1px solid var(--ds-line)}
        .fw-hover:hover{background:var(--ds-surface-2)}
        /* Die aktuell gueltige Zeile einer datierten Reihe (Sollmietzins,
           Staffel). Weiche Markenflaeche, kein Rahmen — sie soll auffallen,
           ohne wie ein Fehler auszusehen. */
        .fw-markiert{background:var(--ds-brand-soft)}
        /* Kontrollkaestchen und Auswahlknoepfe in Markenfarbe. Ersetzt
           `accent-indigo-600` — die Utility trug die Farbe fest, statt sie aus
           dem Token zu nehmen, und lief damit an der Palette vorbei. */
        .fw-haken{accent-color:var(--ds-brand)}
        .fw-punkt{width:8px;height:8px;border-radius:var(--ds-pill);flex-shrink:0;
            background:var(--ds-faint)}
        .fw-punkt.crit{background:var(--ds-crit)}
        .fw-punkt.warn{background:var(--ds-warn)}
        .fw-punkt.good{background:var(--ds-good)}
        .fw-warnton{color:var(--ds-warn)}
        .fw-bild{width:100%;height:160px;object-fit:cover;
            border-radius:var(--ds-radius-sm);border:1px solid var(--ds-line)}
        .fw-abtrenner{margin-top:12px;padding-top:12px;
            border-top:1px solid var(--ds-line)}

        /* Lage-Streifen der Startseite (4b.13). Schmal und immer sichtbar —
           vier Zahlen mit Vormonatspfeil. Er tritt an die Stelle der vier
           alten Kacheln (Mietertrag, Portfolio-Donut, Belegung, unbelegte Flaeche),
           die den BESTAND zeigten. Ein Donut, der seit zwei Jahren gleich
           aussieht, ist Dekoration; der Pfeil daneben ist die Aussage. */
        /* KONZEPT-V8, ZWEITER DURCHGANG: jede Kachel ein Verweis (`a.fw-lage-kachel`),
           Wert und Zwoelf-Monats-Linie nebeneinander, darunter die Delta-Kapsel. */
        .fw-lage{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
            background:var(--ds-surface);border:1px solid var(--ds-line);
            border-radius:var(--ds-radius);box-shadow:var(--ds-shadow-sm);
            margin-bottom:24px;overflow:hidden}
        .fw-lage-kachel{padding:18px 20px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;
            border-left:1px solid var(--ds-line);color:inherit;text-decoration:none;transition:background .12s}
        .fw-lage-kachel:first-child{border-left:0}
        .fw-lage-kachel:hover{background:var(--ds-surface-2)}
        .fw-lage-zeile{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
        .fw-lage .fw-l{font-size:13px;font-weight:500;color:var(--ds-muted)}
        .fw-lage .fw-w{font-size:28px;line-height:1.1;font-weight:600;letter-spacing:-.03em;
            font-variant-numeric:tabular-nums;color:var(--ds-ink);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
        .fw-lage .fw-f{font-size:12px;color:var(--ds-faint);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .fw-spark{width:96px;height:34px;flex:0 0 auto;overflow:visible;color:var(--ds-brand)}
        .fw-spark.good{color:var(--ds-good)}
        .fw-spark.crit{color:var(--ds-crit)}
        /* Die Kapsel heisst nach der BEWERTUNG, nicht nach der Richtung
           (`k.ton` aus `delta_gut_wenn`). `hoch`/`runter` bleiben fuer die
           alten Aufrufer. */
        .fw-trend{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:12px;
            padding:1px 7px;border-radius:var(--ds-pill);background:var(--ds-surface-2);color:var(--ds-muted)}
        .fw-trend.good,.fw-trend.runter{color:var(--ds-good);background:var(--ds-good-soft)}
        .fw-trend.crit,.fw-trend.hoch{color:var(--ds-crit);background:var(--ds-crit-soft)}
        @media (max-width:1024px){
            .fw-lage{grid-template-columns:repeat(2,minmax(0,1fr))}
            .fw-lage-kachel:nth-child(3){border-left:0}
            .fw-lage-kachel:nth-child(n+3){border-top:1px solid var(--ds-line)}
        }
        @media (max-width:720px){
            .fw-lage-kachel{padding:14px 14px 12px}
            .fw-lage .fw-w{font-size:22px}
            .fw-spark{width:64px;height:28px}
        }
        @media (max-width:420px){.fw-lage-zeile{flex-direction:column;align-items:flex-start;gap:6px}}

        /* Zugeklappter Block — «Lage des Bestands». Zu ist der Normalfall:
           Was ruhig ist, soll keinen Platz beanspruchen. */
        .fw-klapp{background:var(--ds-surface);border:1px solid var(--ds-line);
            border-radius:var(--ds-radius);box-shadow:var(--ds-shadow);
            margin-bottom:14px;overflow:hidden}
        .fw-klapp>summary{padding:11px 15px;font-size:14px;font-weight:700;
            cursor:pointer;list-style:none;display:flex;align-items:center;
            gap:10px;color:var(--ds-ink)}
        .fw-klapp>summary::-webkit-details-marker{display:none}
        .fw-klapp>summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--ds-faint);
            border-bottom:1.6px solid var(--ds-faint);transform:rotate(45deg);margin:0 4px 3px auto;transition:transform .15s}
        .fw-klapp[open]>summary::after{transform:rotate(-135deg);margin-bottom:-3px}
        .fw-klapp>summary:hover{background:var(--ds-surface-2)}

        /* Zahl am Reiter der Startseite. `.fw-reiter .fw-z` gibt es schon für
           die Aktenreiter — dort sitzt sie an einem <button>, hier an einem
           <a>. Derselbe Bauteil, deshalb keine zweite Klasse. */
        .fw-reiter a{position:relative;padding:9px 10px 12px;font-size:13px;font-weight:500;
            color:var(--ds-muted);text-decoration:none;
            white-space:nowrap;
            display:flex;align-items:center;gap:7px;transition:color .12s}
        .fw-reiter a:hover{color:var(--ds-ink)}
        .fw-reiter a.hier{color:var(--ds-ink);font-weight:600}

    
        /* Zeichen aus dem Sprite (D5). Groesse und Farbe kommen aus der
           Umgebung: ein Zeichen waechst mit der Schrift und uebernimmt die
           Farbe der Zeile.

           WARUM ES DIESE REGEL BRAUCHT. Tailwinds Preflight setzt
           `audio,canvas,embed,iframe,img,object,svg,video{display:block}` —
           eine Vorgabe fuer BILDER. Ein SVG ohne eigene Groesse faellt damit
           auf die Ersatzmasse zurueck. In Chromium gemessen, ohne diese
           Regel: 300x150 Pixel statt 12x12. Der Fehler ist still — das
           Zeichen ist da, nur riesig.

           WARUM `!important`. Nicht wegen der Ladereihenfolge: `.fw-zeichen`
           ist ein Klassenwaehler und schlaegt den Elementwaehler `svg` in
           jeder Reihenfolge. Nachgemessen ohne `!important`: unveraendert
           12x12. Es wirkt gegen die Hilfsklassen GLEICHER Spezifitaet, die
           ein Aufruf mitgeben kann — `tailwind.css` laedt nach der Schicht,
           also gewaenne dort ein `w-4`. Gemessen: mit `klasse='w-4'` ohne
           `!important` 16x12 statt 12x12, also ein verzerrtes Zeichen.

           Die Groesse steuert man folglich ueber die SCHRIFTGROESSE
           (`text-[12px]`), nicht ueber `w-*`. Gemessen: `text-[12px]` ergibt
           12x12, `w-4` allein bleibt bei 16x16 (der geerbten Schrift).

           HEISST `fw-zeichen`, NICHT `fw-z`: Letzteres ist seit langem die
           Zaehler-Plakette in den Reitern (`.fw-reiter .fw-z`,
           schicht.css:381). Ein Zeichen haette dort Rahmen und Innenabstand
           geerbt. */
        .fw-zeichen{width:1em!important;height:1em!important;
              display:inline-block!important;vertical-align:-.125em;
              flex-shrink:0}

        /* Die Drehung fuer `laedt` — der letzte Grund, Font Awesome zu laden.
           Zwei Spinner (`fa-spin`) hielten 89 KB CSS und 119 KB Schrift am
           Leben, nachdem 1136 Vorkommen auf 11 gefallen waren. Acht Zeilen
           hier ersetzen das.

           `prefers-reduced-motion`: Wer Bewegung abgestellt hat, bekommt
           keine. Das Zeichen bleibt sichtbar — es sagt weiterhin «es laeuft»,
           nur ohne zu drehen. */
        @keyframes fw-drehung{to{transform:rotate(360deg)}}
        .fw-dreht{animation:fw-drehung 1s linear infinite}
        @media (prefers-reduced-motion: reduce){.fw-dreht{animation:none}}

        /* Schrift auf der Markenflaeche — dieselbe Frage wie bei
           `.fw-btn.fw-primary` in E2.21: Weiss stimmt im Hellmodus und bricht
           im Dunkelmodus, weil die Marke dort heller wird. Der Token
           `--ds-auf-satt` traegt beides — das Token heisst so, nicht
           `--ds-auf-marke`; nachgesehen statt geraten.

           Angelegt, weil die Portalseiten `text-white` hart im SVG hatten:
           sieben Vorlagen ohne jede Farbklasse bekamen dadurch eine, und der
           Farbklassen-Waechter stieg von 325 auf 332. */
        .fw-auf-marke{color:var(--ds-auf-satt)}

        /* Das Kuerzel der zustaendigen Person im Arbeitsvorrat (E2.62).
           Rund und gedaempft: Es soll die Zeile einordnen, nicht mit dem
           Titel um Aufmerksamkeit streiten. */
        .fw-kuerzel{display:inline-flex;align-items:center;justify-content:center;
              min-width:30px;height:30px;padding:0 8px;border-radius:var(--ds-pill);
              background:var(--ds-surface-2);border:1px solid var(--ds-line);
              color:var(--ds-muted);font-size:12px;font-weight:600;flex:0 0 auto}

        /* DIE ZEILENKOPFZEILE NACH KONZEPT v7 (E2.66).
           Fallart als Kapsel, Nummer in Ziffernschrift — beide klein und
           gedaempft, damit der Titel darunter die Zeile fuehrt. */
        .fw-zkopf{display:flex;align-items:center;gap:7px;margin-bottom:2px}
        .fw-marke-kapsel{display:inline-block;padding:1px 7px;border-radius:var(--ds-radius-xs);
              background:var(--ds-surface-2);border:1px solid var(--ds-line);
              color:var(--ds-muted);font-size:12px;font-weight:600;
              letter-spacing:.02em}
        .fw-mono{font-family:var(--ds-mono);font-variant-numeric:tabular-nums;font-size:12px;
              color:var(--ds-faint);letter-spacing:-.01em}

        /* Das Wort vor dem Datum (v7: `st`). Klein und gedaempft — es ordnet
           die Frist ein, ohne mit ihr zu konkurrieren. Ein Datum ohne dieses
           Wort ist eine Zahl: Termin, Frist oder Beginn? */
        .fw-wofuer{font-size:12px;font-weight:700;letter-spacing:.06em;
              text-transform:uppercase;color:var(--ds-faint)}
