{% comment %}
DIE KOMPONENTENSCHICHT — Tokens und `fw-*`-Bausteine.

WARUM SIE SEIT E2.10 IN EINER EIGENEN DATEI STEHT

Bis hierher lag sie im <style>-Block von `fw/base.html`. Wer nicht von dieser
Huelle erbt, sah sie nie — und das betraf ausgerechnet die zwei dichtesten
Vorlagen der Anwendung: `schaden_melden.html` (264 Farbklassen) und
`public_bewerbung_form.html` (205). In E2.3 waren beide bereits umgestellt und
mussten zurueckgenommen werden, weil sie unformatiert gerendert haetten — die
Seiten, die MIETER UND BEWERBER sehen.

Jetzt ist die Schicht ein eigener Baustein, den beide Huellen einbinden:
`fw/_assets.html` (Anwendung) und `core/_assets_aussen.html` (Aussenseiten).

WAS DAS FUER DIE AUSSENSEITEN BEDEUTET

Sie bekommen damit die Petrol-Tokens. Das ist eine Aenderung an dem, was
Dritte sehen, und ausdruecklich entschieden: Mieterportal und
Bewerbungsformular tragen dieselbe Marke wie die Anwendung, statt in
Tailwinds Voreinstellung zu bleiben. Der Dunkelmodus folgt ihnen mit.

DIESE DATEI IST REIN ADDITIV. Alle Klassen tragen `fw-`; sie kollidieren
weder mit Tailwind noch mit dem Bestand.

ACHTUNG — DIESER KOPF MUSS EIN DJANGO-KOMMENTAR BLEIBEN

Er steht VOR dem `<style>`-Tag. Als CSS-Kommentar (`/* … */`) ist er dort
kein Kommentar, sondern Text: Der Browser hat ihn oben auf jeder Seite
ausgegeben, sichtbar auch auf dem oeffentlichen Ticketformular.

Passiert beim Zurueckstellen einer Massenaenderung: Erst wurden alle
CSS-Kommentare in Django-Kommentare umgewandelt (falsch — der schliessende Django-Kommentar
enthaelt eine geschweifte Klammer und zerschneidet den Tokenblock fuer die
Waechter), dann alle zurueck — und dabei auch dieser eine, der von Anfang an
richtig war.

Regel: INNERHALB von `<style>` gehoeren CSS-Kommentare hin, AUSSERHALB
Django-Kommentare. Beides ist hier noetig, weil die Datei eine Vorlage ist
und einen Stilblock enthaelt.

        /* Die Portfolio-Karten (`.fw-pcards`/`.fw-pcard`) und der Vermietungs-

        /* Chart + Donut */
        svg.fw-chart{width:100%;height:150px;display:block}
        .fw-donut{width:120px;height:120px;border-radius:50%;position:relative;flex:none}

        .fw-avci{width:30px;height:30px;border-radius:50%;background:var(--ds-brand-soft);color:var(--ds-brand-600);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}

        .fw-ic.b{background:var(--ds-brand-soft);color:var(--ds-brand-600)}

        .fw-subhead{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ds-faint);font-weight:800;padding:10px 0 1px}
        /* Zahlenspalten immer mit gleich breiten Ziffern — sonst «tanzen» die
           Beträge untereinander und Spaltensummen lassen sich nicht mit dem Auge
           prüfen. Zentral statt in jedem Template, damit keine Tabelle vergessen
           geht (Praxis-Audit). Rechtsbündige Zellen sind hier immer Zahlen. */
        table td.text-right, table th.text-right { font-variant-numeric: tabular-nums; }
        /* Auf dem Desktop ist die Wert-Hülle wirkungslos — display:contents
           lässt die Zelle exakt so aussehen wie ohne sie. */
        .fw-wert { display: contents; }
        /* ---- Tabellen auf dem Handy: gestapelt statt quer scrollbar ----
           Eine breite Tabelle in einem overflow-x-auto zwang zum Querscrollen —
           man sah entweder die Bezeichnung ODER den Betrag, nie beides. Unter
           768 px wird jede Zeile deshalb zu einer Karte: links die Spalten-
           überschrift, rechts der Wert. Die Beschriftungen setzt das Skript am
           Seitenende aus dem <thead>, damit das ohne Eingriff in die ~40
           Tabellen-Templates greift und auch für neue Tabellen gilt. */
        @media (max-width: 767px) {
            /* Tabellen ohne Kopfzeile lassen sich nicht beschriften und werden
               daher nicht gestapelt. Sie sind in der Praxis schmal (Nummer ·
               Bezeichnung · Betrag); dort reicht es, die erzwungene Mindestbreite
               aufzuheben, damit der Text umbricht statt quer zu scrollen. */
            table.min-w-max { min-width: 0 !important; }
            /* display:block auch auf der Tabelle selbst — sonst steckt der Browser
               die Block-Zeilen in eine anonyme Tabellenzelle und misst die Breite
               wieder am Inhalt, die Tabelle bleibt also breiter als der Bildschirm. */
            table[data-stack] { display: block; min-width: 0 !important; width: 100% !important; }
            table[data-stack] thead { display: none; }
            table[data-stack] tbody,
            table[data-stack] tfoot,
            table[data-stack] tr,
            table[data-stack] td { display: block; width: auto; }
            /* Kräftiges Trennband statt Haarlinie: bei vier Feldern pro Zeile
               verschwimmen die Einträge sonst ineinander und man sieht nicht,
               wo ein Mieter aufhört und der nächste anfängt.
               !important ist hier nötig, nicht Bequemlichkeit: Tailwinds
               «divide-y» setzt auf jeder Zeile ausser der ersten
               border-bottom-width: 0 — ohne Vorrang bekäme nur die erste Karte
               ein Trennband und der Rest bliebe an der Haarlinie hängen. */
            table[data-stack] tr {
                padding: 0.75rem 1rem;
                border-top: 0 !important;
                border-bottom: 8px solid var(--ds-bg) !important;
            }
            table[data-stack] tr:last-child { border-bottom: 0 !important; }
            /* Die LETZTE Karte verlor alle Trennlinien in ihrem Innern.
               Ursache ist eine Desktop-Regel weiter oben:

                   table.fw-table tbody tr:last-child td { border-bottom: 0 }

               Am Tisch ist sie richtig — sie nimmt der untersten Tabellenzeile
               die Abschlusslinie. Gestapelt wird aber aus JEDER Zelle eine
               eigene Zeile, und die Regel loescht dann die Linien zwischen
               Typ, Flaeche, Status und Mieter — aber nur beim letzten Eintrag.
               Real gemeldet am 20.08.2026 an der Objektliste einer
               Liegenschaft: Der Parkplatz stand zuunterst und sah als
               einziger anders aus als die Wohnungen darueber.

               Hoehere Spezifitaet statt !important: `[data-stack].fw-table`
               schlaegt `.fw-table` sauber, und die Regel greift nur bei
               Tabellen, die diese Desktop-Regel ueberhaupt betrifft. */
            table[data-stack].fw-table tbody tr:last-child td {
                border-bottom: 1px solid var(--ds-line);
            }
            /* Dieselbe Trennung für die handgebauten Karten-Listen (Liegenschaften,
               Objekte, Personen, Verträge, Debitoren, Journal, Kontoblatt). Die sind
               keine gestapelten Tabellen, hatten also weiter nur die Haarlinie von
               «divide-y» — nebeneinander sah das aus wie zwei verschiedene Regeln.
               Der Doppel-Selektor trifft genau diese Listen: nur mobil sichtbar UND
               unterteilt, das ist per Konstruktion eine Karten-Liste. */
            .md\:hidden.divide-y > * + * { border-top: 8px solid var(--ds-bg) !important; }
            /* Aufklapp-Gruppen (Objekte je Liegenschaft, Hypotheken je
               Liegenschaft) sitzen zu mehreren in EINER Karte und waren nur
               durch die Haarlinie von «border-b» getrennt — auf dem Handy las
               sich das wie eine durchgehende Liste ohne Gruppengrenze.

               Eine Stufe dunkler als das Band zwischen einzelnen Einträgen:
               so bleibt die Hierarchie erkennbar, wenn eine Gruppe offen ist
               (Gruppengrenze deutlicher als die Trennung ihrer Zeilen). */
            main details.group.border-b { border-bottom: 8px solid var(--ds-line) !important; }
            main details.group.border-b:last-child { border-bottom-width: 0 !important; }
            /* «truncate» im Inhaltsbereich mobil aufheben.

               Auf dem Handy schneidet es genau das weg, was die Zeile
               identifiziert: «Selzacherstras…», «B..», «Narrezauber Sol…».
               Auf dem Desktop ist truncate richtig (breite Spalten, eine Zeile
               pro Datensatz) — mobil ist Platz nach unten, nicht nach rechts.

               Nur innerhalb von <main>: Topbar und Seitenleiste (Benutzername,
               Menü-Labels) brauchen ihre feste Zeilenhöhe, dort bleibt truncate.
               Django-seitiges `truncatechars` bleibt ebenfalls unberührt — das
               kürzt bewusst lange Freitexte und ist keine Layout-Notlösung. */
            main .truncate {
                white-space: normal !important;
                overflow: visible !important;
                text-overflow: clip !important;
                /* break-word, NICHT anywhere: `anywhere` senkt auch die
                   min-content-Breite auf ein Zeichen. Ein Flex-Element daneben
                   (Betrag, Button) drückt die Textspalte dann bis auf
                   Buchstabenbreite und der Titel bricht mitten im Wort
                   («überfälli/ge Forderun/gen») — real gemeldet auf der Inbox.
                   Mit break-word bleibt das längste Wort die Untergrenze. */
                overflow-wrap: break-word;
            }
            /* Erste Zelle ist die Überschrift der Zeile — ihr Wert benennt den
               Eintrag («Dominik Gerber»), das Label davor wäre nur Rauschen. */
            table[data-stack] td[data-stack-titel] {
                display: block; text-align: left !important;
                font-size: 1rem; font-weight: 700; color: var(--ds-ink);
                margin-bottom: 0.15rem;
            }
            table[data-stack] td[data-stack-titel]::before { content: none; }
            table[data-stack] td[data-stack-titel] > .fw-wert { text-align: left; }
            table[data-stack] td {
                padding: 0.2rem 0 !important;
                text-align: right !important;
                /* truncate / nowrap / max-w der Desktop-Spalten aufheben — mobil ist Platz nach unten */
                white-space: normal !important;
                overflow: visible !important;
                text-overflow: clip !important;
                max-width: none !important;
                display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem;
            }
            table[data-stack] td::before {
                content: attr(data-label);
                flex: 0 0 auto;
                text-align: left;
                font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
                text-transform: uppercase; color: var(--ds-faint);
            }
            /* Der Wert braucht einen eigenen Kasten mit min-width:0 — sonst
               schrumpft ein Flex-Element nie unter seine Inhaltsbreite und ein
               breiter Block in der Zelle (z.B. das aufklappbare Kostenaufteilungs-
               Feld bei den Kreditoren) schiebt die Zeile wieder aus dem Bild. */
            table[data-stack] td > .fw-wert {
                display: block; flex: 1 1 auto; min-width: 0;
                text-align: right; overflow-wrap: anywhere;
            }
            /* Zellen ohne Überschrift (Aktionsspalte): kein Label. Leere Zellen ganz weg. */
            table[data-stack] td[data-label='']::before { content: none; }
            table[data-stack] td[data-leer] { display: none; }
            /* Zusammengefasste Zellen (Summenzeilen) über die volle Breite */
            table[data-stack] td[colspan]::before { content: none; }
            table[data-stack] tfoot tr { background: var(--ds-surface-2); font-weight: 600; }
        }
        /* ---- Tabellen am PC: in die Spalte passen statt quer scrollen ----
           «min-w-max» stammt aus der Zeit, als dieselbe Tabelle auch das Handy
           bedienen musste. Seit die Handy-Ansicht gestapelt wird (Block oben),
           bewirkt es am PC nur noch eines: Die Tabelle wird so breit wie ihr
           Inhalt, und der Wrapper scrollt quer. Gemessen bei 1440 px Fenster
           (1134 px Inhaltsspalte, echter Tailwind-Build):

               /neu/debitoren/    1412 px nötig  (+278)
               /neu/mietzins/     1295 px nötig  (+161)
               /neu/kreditoren/   1230 px nötig   (+96)
               /neu/vertraege/    1215 px nötig   (+81)

           Man sah also nie die ganze Zeile — Mahnstufe und Aktionen lagen
           ausserhalb des Bildes.

           Die Mindestbreite allein aufzuheben bringt NICHTS (gemessen: exakt
           dieselben 1412 px). Ursache ist «whitespace-nowrap» auf den Text-
           spalten: eine Zelle, die nicht umbrechen darf, ist ihr eigener
           Breiten-Boden. Deshalb dürfen linksbündige Textspalten hier
           umbrechen — rechtsbündige (Beträge, Daten, Aktionsknöpfe) und
           zentrierte bleiben einzeilig, sonst zerfällt die Zahlenkolonne.
           Abzeichen behalten ihr nowrap: das sitzt am <span> in der Zelle,
           nicht an der Zelle selbst.

           Der Wrapper bleibt «overflow-x-auto». Querscrollen soll nicht
           unmöglich sein (eine Tabelle mit Spalte je Bewerber braucht es
           weiterhin) — es soll nur nicht der Normalfall sein. */
        @media (min-width: 768px) {
            main table.min-w-max { min-width: 100%; }
            main table.min-w-max td:not(.text-right):not(.text-center) {
                white-space: normal;
                overflow-wrap: break-word;
            }
            /* Ab sieben Spalten sind 2×20 px Innenabstand je Spalte über
               280 px allein für Luft — dann lieber enger als hoch. Der
               Umbruch oben lässt die Debitoren-Zeile sonst von 49 auf 89 px
               wachsen; mit dem engeren Abstand sind es 69 px, bei den
               Kreditoren bleibt es bei den ursprünglichen 59 px.
               Tabellen mit weniger Spalten passten ohnehin und bleiben
               unverändert. Kennt ein Browser :has() nicht, fällt nur diese
               Feinheit weg — die Tabelle passt trotzdem. */
            main table.min-w-max:has(thead th:nth-child(7)) th.px-5,
            main table.min-w-max:has(thead th:nth-child(7)) td.px-5 {
                padding-left: 0.75rem; padding-right: 0.75rem;
            }
            /* Ab neun Spalten noch eine Stufe enger. Auf einem 1280-px-Laptop
               (974 px Inhaltsspalte) fehlten den Debitoren sonst genau 16 px —
               vom Papierkorb blieb die Hälfte im Bild. Die 8 px sparen 72 px
               und senken die Zeile dort zusätzlich von 89 auf 69 px, weil die
               Textspalten weniger umbrechen müssen. */
            main table.min-w-max:has(thead th:nth-child(9)) th.px-5,
            main table.min-w-max:has(thead th:nth-child(9)) td.px-5 {
                padding-left: 0.5rem; padding-right: 0.5rem;
            }
        }
        /* Auf einem schmalen Fenster ist die Aktionsspalte oft die breiteste
           von allen (Debitoren 192 px, Kreditoren 341 px — mehr als jede
           Datenspalte). Dort dürfen die Knöpfe umbrechen statt die ganze
           Tabelle wegzuschieben. Nur unterhalb 1280 px: auf breiten Schirmen
           bleibt die Aktionszeile wie gewohnt einzeilig.
           `:has(a, button)` trennt Aktions- von Datenzellen — eine letzte
           Spalte mit einem Betrag darf nicht umbrechen. */
        @media (min-width: 768px) and (max-width: 1279px) {
            main table.min-w-max tbody td:last-child:has(a, button) {
                white-space: normal;
            }
        }
        /* iOS: native date/month/time-Felder haben eine Eigenbreite, die w-full
           ignoriert und aus dem Container läuft. Auf Containerbreite zwingen. */
        input[type="date"], input[type="month"], input[type="week"],
        input[type="time"], input[type="datetime-local"] {
            -webkit-appearance: none; appearance: none;
            min-width: 0; max-width: 100%; box-sizing: border-box;
        }
        /* Einklappbare Sidebar — nur auf Desktop (ab lg); mobil ist es ein Drawer */
        @media (min-width: 1024px) {
            #fwSidebar { transition: width .18s ease; }
            html._sbc #fwSidebar { width: 4.5rem; }
            html._sbc #fwSidebar .sb-label,
            html._sbc #fwSidebar .sb-section,
            html._sbc #fwSidebar .sb-filter,
            html._sbc #fwSidebar .sb-logotext,
            html._sbc #fwSidebar .sb-footlabel { display: none !important; }
            html._sbc #fwSidebar .sb-item { justify-content: center; gap: 0; }
            html._sbc #fwSidebar .sb-logo { justify-content: center; }
            html._sbc #fwSidebar .sb-collapse-icon { transform: rotate(180deg); }
            html._sbc #fwSidebar .sb-sub { display: none !important; }
        }
        /* Aufklapp-Pfeil der Navigationsgruppen */
        .nav-open .sb-chev i { transform: rotate(90deg); }
        /* Embed-Modus (im Modal geladen): Sidebar/Topbar aus, Inhalt füllt das Fenster */
        html._embed #fwSidebar,
        html._embed header,
        html._embed #fwBackdrop { display: none !important; }
        html._embed main { padding: 1.25rem !important; max-width: none !important; }
    
        /* ---- Aktenrahmen nach mockups/konzept-v3 (Phase 4b) --------------
           Nur Tokens, die in :root oben tatsaechlich definiert sind. Der
           Test core/tests/test_ds_tokens.py prueft das nach — eine frühere
           Fassung benutzte --ds-brand-100 und --ds-line-stark, die es nie
           gab, und machte die Regeln damit unwirksam. */
                /* Leseansicht der Akte: Gruppen aus Bezeichnung und Wert (Phase 4b).
           Ersetzt die frueheren Karten-Paare mit eingestreuten Formularen. */
                .fw-leer{padding:26px 16px;text-align:center;font-size:13px;color:var(--ds-faint);font-style:italic}
        /* ===== GRUNDVOKABULAR DER SCHICHT (E2) =====================
           Die kleinsten Bausteine: eine Flaeche, eine Linie, ein Textton.
           Sie ersetzen die fest verdrahteten Tailwind-Farbklassen, von denen
           es am 23.08.2026 noch 7444 in 135 Vorlagen gab
           (`core/tests/test_farbklassen.py` zaehlt sie abwaerts).

           WARUM ES SIE BRAUCHT
           `bg-white` bleibt weiss — auch im Dunkelmodus, auch wenn ein Mandant
           eine eigene Akzentfarbe hat. `fw-flaeche` zeigt auf ein Token und
           folgt beidem. Dasselbe fuer Linien und Textstufen.

           NAMEN AUF DEUTSCH, wie der Rest der Schicht (`fw-mutet`,
           `fw-strong`, `fw-klein`): Wer eine Vorlage liest, soll nicht
           zwischen zwei Sprachen springen.

           `fw-linie` setzt NUR die Farbe — die Breite kommt weiterhin von
           Tailwinds `border`, `border-t` &c. Das ist Absicht: Wo eine Linie
           liegt, ist Layout und gehoert in die Vorlage; WELCHE Farbe sie hat,
           ist Gestaltung und gehoert hierher.
           ========================================================== */
        .fw-flaeche{background:var(--ds-surface)}
        .fw-flaeche2{background:var(--ds-surface-2)}
        .fw-linie{border-color:var(--ds-line)}
        .fw-linie-stark{border-color:var(--ds-line-stark)}
        .hover\:fw-linie-stark:hover{border-color:var(--ds-line-stark)}
        .fw-ink{color:var(--ds-ink)}
        .fw-faint{color:var(--ds-faint)}
        .fw-marke{color:var(--ds-brand)}
        .fw-markenflaeche{background:var(--ds-brand-soft)}
        .fw-kritisch{color:var(--ds-crit)}
        .fw-gut{color:var(--ds-good)}
        .fw-linie-gut{border-color:var(--ds-good)}
        .fw-gut-flaeche{background:var(--ds-good-soft)}
        .fw-krit-flaeche{background:var(--ds-crit-soft)}
        .fw-warn-flaeche{background:var(--ds-warn-soft)}
        .fw-info-flaeche{background:var(--ds-info-soft)}
        /* Eigener Ton fuer sicherheitsrelevante Protokolleintraege. Keine
           Wertung: Eine Anmeldung ist weder gut noch schlecht, sondern
           bemerkenswert. Bis E2.7 war das Violett; seither fiel es mit
           `finanzen` auf denselben Info-Ton zusammen und der Unterschied,
           den das Logbuch machen wollte, war weg. */
        /* Sicherheitsereignisse heben sich durch UMKEHRUNG ab, nicht durch
           einen zweiten Farbton: dunkle Flaeche, helle Schrift. Damit bleibt
           die Anwendung einfarbig (Entscheid 4b.6, bewacht von
           `EinFarbtonTests`) und der Eintrag trotzdem unverwechselbar — er
           ist der einzige mit invertierter Darstellung.
           Beide Werte kippen im Dunkelmodus gemeinsam, die Umkehrung bleibt
           also in beiden Darstellungen lesbar. */
        .fw-merk{color:var(--ds-surface)}
        .fw-merk-flaeche{background:var(--ds-ink)}
        .fw-linie-marke{border-color:var(--ds-brand)}
        .fw-linie-krit{border-color:var(--ds-crit)}
        .fw-linie-warn{border-color:var(--ds-warn)}
        .fw-info{color:var(--ds-info)}
        /* Bedienelemente: Haken, Schieber und Fokusringe faerbt der Browser
           selbst — `accent-color` und `outline` sind die einzigen Wege dorthin.

           NACHGEMESSEN, WEIL DIE ERSTE BEGRUENDUNG NICHT TRUG: Hier stand,
           ohne diese zwei Zeilen blieben «indigoblaue Haken neben
           petrolfarbenen Knoepfen» stehen. Das stimmt nicht — die Palette in
           `tailwind.palette.js` definiert `indigo` auf die Marke um, und im
           Bau steht tatsaechlich `.accent-indigo-600{accent-color:#0f6f6a}`.
           Die Haken sind also laengst petrol.

           Der Gewinn ist ein anderer, und er ist echt: `accent-indigo-600`
           steht zur BAUZEIT auf einer festen Farbe. `var(--ds-brand)` folgt
           dem Token — also dem Dunkelmodus und spaeter der Akzentfarbe je
           Mandant (D3). Genau das kann die Palette nicht leisten.

           `accent-indigo` steht noch in 17 weiteren Vorlagen. Sie sehen heute
           richtig aus und fallen erst auf, wenn Branding kommt. */
        .fw-akzent{accent-color:var(--ds-brand)}
        /* Ein Haken, der Loeschen bedeutet, ist rot — auch der Haken selbst.
           `accent-color` ist der einzige Weg dorthin (siehe fw-akzent). */
        .fw-akzent-krit{accent-color:var(--ds-crit)}
        .fw-akzent-warn{accent-color:var(--ds-warn)}
        /* Warnring um ein Feld, das Aufmerksamkeit braucht. */
        .fw-ring-warn{box-shadow:0 0 0 3px color-mix(in srgb, var(--ds-warn) 35%, transparent)}
        /* Abdunkelung hinter einem Dialog. Bewusst KEIN Token: Ein Vorhang
           ist in beiden Darstellungen dunkel — im Hellmodus, damit der Dialog
           heraussticht, im Dunkelmodus, damit der Hintergrund zurueckfaellt. */
        .fw-vorhang{background:rgba(6,20,23,.55)}
        .fw-fokusring:focus{outline:2px solid var(--ds-brand);outline-offset:2px}

        /* ZUSTAENDE — NACHGETRAGEN, WEIL SIE SEIT E2.1 STILL FEHLTEN
           ------------------------------------------------------------------
           `hover:bg-slate-50` funktioniert, weil Tailwind die Regel dafuer
           ERZEUGT. `hover:fw-flaeche2` funktioniert NICHT: `fw-flaeche2` ist
           von Hand geschrieben, Tailwind kennt sie nicht und baut folglich
           auch keine Varianten-Regel. Der Browser sieht dann eine Klasse
           namens `hover:fw-flaeche2`, auf die keine einzige Regel passt.

           Im Browser nachgemessen (Chromium, echte Seite, echte
           Stylesheets): unter 292 geladenen Regeln passte KEINE auf
           `hover:fw-*`, `focus:fw-*`, `file:fw-*` oder `group-hover:fw-*`.
           Die Umstellung auf die Komponentenschicht hatte damit
           funktionierende Hover-Zustaende durch tote Klassennamen ersetzt —
           113 Vorkommen in 17 Vorlagen. Sichtbar wird das nie als Fehler,
           nur als eine Oberflaeche, die sich nicht mehr regt.

           Dieselbe Messung erklaert die Zeilen darunter ohne Modifikator:
           `fw-markenflaeche/60` ergab `rgba(0,0,0,0)` — der Opazitaets-Zusatz
           ist ebenfalls reine Tailwind-Syntax und macht aus einer gueltigen
           Klasse einen toten Namen. Diese Stellen sind in den Vorlagen auf
           die Grundklasse zurueckgesetzt.

           `core/tests/test_fw_klassen_wirken.py` haelt das fest: Jede
           `fw-`-Klasse in einer Vorlage muss von einer Regel getroffen
           werden. Genau dieser Waechter hat in E2.5 die drei Regeln
           nachgefordert, die unten dazugekommen sind (`file:fw-flaeche2`,
           `file:fw-ink`, `hover:fw-warn-flaeche`) — die neu umgestellten
           Seiten brauchten sie. */
        .hover\:fw-flaeche2:hover{background:var(--ds-surface-2)}
        /* Weitere Zustands-Praefixe, die beim Umstellen entstanden sind.
           `placeholder:` und `disabled:` tragen Bedeutung — ein deaktiviertes
           Feld MUSS anders aussehen —, deshalb bekommen sie Regeln statt
           gekuerzt zu werden. */
        .placeholder\:fw-faint::placeholder{color:var(--ds-faint)}
        .disabled\:fw-balken:disabled{background:var(--ds-line)}
        .disabled\:fw-faint:disabled{color:var(--ds-faint)}
        .disabled\:fw-flaeche2:disabled{background:var(--ds-surface-2)}
        .hover\:fw-flaeche:hover{background:var(--ds-surface)}
        .focus\:fw-flaeche:focus{background:var(--ds-surface)}
        .hover\:fw-markenflaeche:hover{background:var(--ds-brand-soft)}
        .hover\:fw-krit-flaeche:hover{background:var(--ds-crit-soft)}
        .hover\:fw-info-flaeche:hover{background:var(--ds-info-soft)}
        .hover\:fw-warn-voll:hover{background:var(--ds-warn)}
        .hover\:fw-warnton:hover{color:var(--ds-warn)}
        .group:hover .group-hover\:fw-balken-voll{background:var(--ds-brand)}
        .group:hover .group-hover\:fw-markenflaeche{background:var(--ds-brand-soft)}
        .group:hover .group-hover\:fw-warnton{color:var(--ds-warn)}
        .group:hover .group-hover\:fw-marke{color:var(--ds-brand)}
        .hover\:fw-warn-flaeche:hover{background:var(--ds-warn-soft)}
        .hover\:fw-gut-flaeche:hover{background:var(--ds-good-soft)}
        .hover\:fw-marke:hover{color:var(--ds-brand)}
        .hover\:fw-kritisch:hover{color:var(--ds-crit)}
        .hover\:fw-gut:hover{color:var(--ds-good)}
        .hover\:fw-ink:hover{color:var(--ds-ink)}
        .hover\:fw-mutet:hover{color:var(--ds-faint)}
        .hover\:fw-linie-marke:hover{border-color:var(--ds-brand)}
        .focus\:fw-linie-marke:focus{border-color:var(--ds-brand)}
        .hover\:fw-linie-krit:hover{border-color:var(--ds-crit)}
        .hover\:fw-linie-gut:hover{border-color:var(--ds-good)}
        .hover\:fw-linie-warn:hover{border-color:var(--ds-warn)}
        .hover\:fw-balken:hover{background:var(--ds-line)}
        .hover\:fw-balken-voll:hover{background:var(--ds-brand)}
        .focus-within\:fw-markenflaeche:focus-within{background:var(--ds-brand-soft)}
        .group:hover .group-hover\:fw-marke{color:var(--ds-brand)}
        /* Dateiwahl-Knopf: der Browser gestaltet ihn ueber ein eigenes
           Pseudoelement, an das weder Hintergrund- noch Textfarbe des
           Elternelements herankommt. */
        .file\:fw-marke::file-selector-button{color:var(--ds-brand)}
        /* Nachgetragen mit E2.10: Die oeffentlichen Seiten benutzen diese
           Zustaende, und seit die Schicht auch dort ankommt, faellt auf,
           dass es die Regeln dafuer nie gab. */
        .focus\:fw-ring-krit:focus{box-shadow:0 0 0 3px color-mix(in srgb, var(--ds-crit) 35%, transparent)}
        .hover\:fw-info:hover{background:var(--ds-info-soft);color:var(--ds-info)}
        .hover\:fw-strong:hover{font-weight:600;color:var(--ds-ink)}
        .hover\:file\:fw-markenflaeche:hover::file-selector-button{background:var(--ds-brand-soft)}
        .hover\:file\:fw-balken:hover::file-selector-button{background:var(--ds-line)}
        .file\:fw-flaeche2::file-selector-button{background:var(--ds-surface-2)}
        .file\:fw-ink::file-selector-button{color:var(--ds-ink)}
        .file\:fw-markenflaeche::file-selector-button{background:var(--ds-brand-soft)}
        .file\:fw-balken-voll::file-selector-button{background:var(--ds-brand)}
        .hover\:file\:fw-balken-voll:hover::file-selector-button{background:var(--ds-brand)}

        /* Balken und Fuellstaende (Fortschritt, Auslastung). */
        .fw-balken{background:var(--ds-line)}
        .fw-balken-voll{background:var(--ds-brand)}
        /* Verlauf in der Markenfarbe — Kopfzeile des Mieterportals.
           Ueber Tokens, damit er dem Dunkelmodus und spaeterem Branding folgt. */
        .fw-marke-verlauf{background:linear-gradient(135deg,var(--ds-brand),var(--ds-brand-600))}
        /* Gesaettigtes Gruen als Flaeche — fuer Absendeknoepfe mit
           eigenen Massen, die `fw-btn` nicht mitnehmen koennen. */
        .fw-gut-voll{background:var(--ds-good);color:#fff}
        .fw-krit-voll{background:var(--ds-crit)}
        .fw-warn-voll{background:var(--ds-warn)}
        /* Neutraler Schatten — bisher `shadow-slate-300/40` im Profilmenue. */
        .fw-schatten{box-shadow:var(--ds-shadow)}
        .fw-gut-voll:hover{filter:brightness(.92)}
        .fw-link{color:var(--ds-brand);font-weight:600;text-decoration:none;font-size:12.5px}
        .fw-link:hover{text-decoration:underline}
        .fw-klein{font-size:11.5px;color:var(--ds-faint)}

        /* Bereichsinhalte (Phase 4b.4). Bis hierher deckte die Komponenten-
           schicht nur den Aktenkopf ab; die Reiterinhalte blieben deshalb
           Tailwind. Drei Bausteine fehlten und werden in jedem Bereich
           gebraucht — Betrag, Eingabefeld, Symbolknopf. */
        .fw-betrag{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ds-ink);
            white-space:nowrap}
