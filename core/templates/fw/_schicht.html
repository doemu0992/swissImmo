        .fw-gs .fw-eingang-knoepfe .fw-vorschlag{margin-top:0}
        .fw-gs .fw-eingang-knoepfe form{margin:0}
        .fw-gs-grund{font-size:12px;color:var(--ds-faint)}
        .fw-aging-tabelle .fw-zelle-titel{font-weight:600;color:var(--ds-ink);text-decoration:none}
        .fw-aging-tabelle a.fw-zelle-titel:hover{color:var(--ds-brand)}
        .fw-aging-tabelle .fw-zelle-sub{display:block;color:var(--ds-faint);font-size:12px;font-weight:400;margin-top:1px}
        .fw-aging-tabelle tr[data-href]{cursor:pointer}
        .fw-aging-neg{color:var(--ds-crit);font-weight:600}
        .fw-fin-abschluss{overflow:hidden}
        .fw-fin-abschluss .fw-kopf{flex-wrap:wrap}
        .fw-fin-abschluss .fw-kpis{margin:0;border:0;box-shadow:none}
        .fw-bericht-zwei{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start;margin-bottom:24px}
        .fw-bericht-zwei>.fw-card{margin-bottom:0;min-width:0}
        @media (max-width:1100px){.fw-bericht-zwei{grid-template-columns:minmax(0,1fr)}}
        .fw-bericht-katalog{margin:8px 0 10px}
        /* Zielbild «Berichte»: ein Katalog in einer Karte, Suche oben, Gruppen mit Kacheln */
        .fw-katalog{overflow:hidden}
        .fw-katalog-gruppe{min-width:0}
        .fw-katalog-suche{padding:0 20px 8px}
        .fw-katalog-suche .fw-feld{width:100%}
        .fw-katalog-liste{padding:0 20px 20px;display:flex;flex-direction:column;gap:18px}
        .fw-katalog-titel{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ds-muted);margin:0 0 8px}
        .fw-katalog-kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
        .fw-kachel-bericht{display:flex;flex-direction:column;gap:3px;padding:12px 14px;background:var(--ds-surface-2);border-radius:var(--ds-radius-sm);color:var(--ds-ink);text-decoration:none;min-width:0}
        .fw-kachel-bericht:hover{background:var(--ds-hover)}
        .fw-kachel-bericht .fw-t{font-weight:600}
        .fw-kachel-bericht .fw-s{font-size:13px;color:var(--ds-muted)}
        .fw-katalog-wert{font-size:13px;font-weight:600;margin-top:4px}
        .fw-mandat-name{font-weight:600;color:var(--ds-ink);text-decoration:none}
        a.fw-mandat-name:hover{color:var(--ds-brand)}
        .fw-diagramm{padding:14px 20px 16px 20px}
        .fw-diagramm-balken{padding-top:12px}
        .fw-kurve{padding-left:44px}
        .fw-kurve-plot{position:relative;height:176px}
        .fw-kurve-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
        .fw-kurve-raster{stroke:var(--ds-line);stroke-width:1}
        .fw-kurve-flaeche{fill:var(--ds-brand);opacity:.08}
        .fw-kurve-strich{fill:none;stroke:var(--ds-brand);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
        .fw-kurve-y{position:absolute;left:-44px;width:36px;text-align:right;transform:translateY(-50%);
            font-size:11px;color:var(--ds-faint);font-variant-numeric:tabular-nums;white-space:nowrap}
        .fw-kurve-punkt{position:absolute;width:9px;height:9px;border-radius:var(--ds-pill);background:var(--ds-brand);color:var(--ds-auf-satt);
            box-shadow:0 0 0 2px var(--ds-surface);transform:translate(-50%,-50%);pointer-events:none}
        .fw-kurve-wert{position:absolute;transform:translate(-100%,-150%);margin-left:-6px;font-size:12px;font-weight:600;
            color:var(--ds-ink);white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums}
        .fw-kurve-treffer{position:absolute;top:0;bottom:0;cursor:crosshair}
        @media (hover:hover){.fw-kurve-treffer:hover{background:var(--ds-hover)}}
        .fw-kurve-achse{position:relative;height:22px}
        .fw-kurve-x{position:absolute;top:6px;transform:translateX(-50%);font-size:11px;color:var(--ds-faint);white-space:nowrap}
        .fw-hbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 96px;gap:10px;align-items:center;padding:7px 0;font-size:13px}
        .fw-hbar-lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ds-muted);text-decoration:none}
        a.fw-hbar-lab:hover{color:var(--ds-brand)}
        .fw-hbar-spur{height:14px;position:relative}
        .fw-hbar-spur::before{content:"";position:absolute;left:0;top:-4px;bottom:-4px;width:1px;background:var(--ds-line-stark)}
        .fw-hbar-spur i{position:absolute;left:0;top:0;bottom:0;border-top-right-radius:var(--ds-radius-xs);border-bottom-right-radius:var(--ds-radius-xs);background:var(--ds-brand)}
        .fw-hbar-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ds-ink)}
        .fw-hbar-v.fw-faint{font-weight:400;color:var(--ds-faint)}
        @media (max-width:640px){
            .fw-gs{padding:12px 16px}
            .fw-fin-kpis .fw-kpi .fw-v{font-size:18px}
            .fw-diagramm{padding:12px 16px 14px}
            .fw-kurve{padding-left:38px}
            .fw-kurve-y{left:-38px;width:32px;font-size:10.5px}
            .fw-kurve-plot{height:150px}
            .fw-kurve-x-neben{display:none}
            .fw-hbar{grid-template-columns:minmax(0,110px) minmax(0,1fr) 72px}
        }
        /* ---- Phase 3: Glas, dichte Datentabellen, breite Bildschirme ---- */

        /* GLAS — dezent, nur dort, wo etwas ÜBER dem Inhalt liegt oder ihn begleitet:
           Seitenleiste (mobil als Schublade über der Seite), Bestätigungsdialog,
           Befehlspalette, Vorhänge. Die Fläche bleibt zu 80–90 % deckend, damit der
           Kontrast der Schrift gleich bleibt; der Blur gibt nur Tiefe. Farben nur über
           Tokens, so gilt dieselbe Regel in Hell und Dunkel.
           Rückfall: Wo `backdrop-filter` fehlt, bleibt die feste Fläche (@supports), und
           wer «weniger Transparenz» eingestellt hat, bekommt sie ebenfalls fest. */
        @supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
            .fw-side{background:color-mix(in srgb,var(--ds-surface) 82%,transparent);
                -webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px)}
            .fw-bestaetigen{background:color-mix(in srgb,var(--ds-surface) 90%,transparent);
                -webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px)}
            .fw-bestaetigen::backdrop{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
            .fw-vorhang-mobil,.fw-schublade-vorhang,.fw-vg-vorhang{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
        }
        @media (prefers-reduced-transparency:reduce){
            .fw-side,.fw-bestaetigen{background:var(--ds-surface);
                -webkit-backdrop-filter:none;backdrop-filter:none}
            .fw-bestaetigen::backdrop,.fw-vorhang-mobil,.fw-schublade-vorhang,.fw-vg-vorhang{
                -webkit-backdrop-filter:none;backdrop-filter:none}
        }

        /* DATENTABELLEN MIT HOHER DICHTE (Buchhaltung, Arbeitsvorrat)
           `.fw-sticky` am Rahmen: Der Rahmen scrollt selbst (Höhe begrenzt), damit der
           Kopf oben stehen bleibt. Ohne diese Klasse scrollt nur die Seite — `sticky`
           bindet sonst an `.fw-tablewrap` (overflow-x:auto macht ihn zum Scrollbehälter),
           und der Kopf bliebe nicht stehen. Kopf und Filterzeile liegen als zwei Zeilen
           übereinander; die Höhe der ersten gibt das Skript als --fw-kopf weiter. */
        .fw-tablewrap.fw-sticky{overflow:auto;max-height:calc(100vh - 210px);max-height:calc(100dvh - 210px);
            overscroll-behavior:contain}
        .fw-sticky table.fw-table thead th{position:sticky;top:0;z-index:3;background:var(--ds-surface-2);
            box-shadow:inset 0 -1px 0 var(--ds-line)}
        .fw-sticky table.fw-table thead tr.fw-filterzeile th{top:var(--fw-kopf,38px);z-index:2}
        .fw-sticky table.fw-table tfoot td,.fw-sticky table.fw-table tfoot th{position:sticky;bottom:0;z-index:2}
        /* Filterzeile unter dem Tabellenkopf (fwSpaltenfilter in base.html) */
        table.fw-table tr.fw-filterzeile th{padding:5px 8px;background:var(--ds-surface);font-weight:400;
            border-bottom:1px solid var(--ds-line);text-transform:none;letter-spacing:0}
        .fw-filterfeld{width:100%;min-width:92px;height:28px;padding:0 8px;font:inherit;font-size:13px;
            color:var(--ds-ink);background:var(--ds-surface);border:1px solid var(--ds-line);
            border-radius:var(--ds-radius-knopf);transition:border-color .12s,box-shadow .12s}
        .fw-filterfeld:focus{outline:none;border-color:var(--ds-brand);box-shadow:0 0 0 3px var(--ds-brand-soft)}
        .fw-filterfeld.fw-aktiv{border-color:var(--ds-brand);background:var(--ds-brand-soft)}
        .fw-filterstand{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;
            color:var(--ds-faint);border-bottom:1px solid var(--ds-line)}
        .fw-filterstand button{font:inherit;font-size:13px;color:var(--ds-brand);background:none;border:0;
            cursor:pointer;padding:0;text-decoration:underline}
        .fw-filterstand[hidden]{display:none}
        table.fw-table tbody tr.fw-gefiltert{display:none}
        [data-stack] thead tr.fw-filterzeile{display:none}
        /* Statusfarben auf der Zeile: ein roter Rand links für Überfälliges, grün für Bezahltes
           (zusätzlich zur Kapsel — Zustand in Form, nicht nur in Farbe). */
        table.fw-table tbody tr.fw-zeile-ueberfaellig td:first-child{box-shadow:inset 3px 0 0 var(--ds-crit)}
        table.fw-table tbody tr.fw-zeile-bezahlt td:first-child{box-shadow:inset 3px 0 0 var(--ds-good)}

        /* BREITE BILDSCHIRME: Bis 1440 px war Schluss — auf 2560 px blieben 40 % der
           Fläche leer, obwohl Buchhalter dort mehr Spalten wollen. Gestaffelt, damit
           Zeilen nicht zu lang werden. */
        @media (min-width:1760px){.fw-inhalt{max-width:1680px}}
        @media (min-width:2200px){.fw-inhalt{max-width:2000px}}
        /* ---- Ende Tranche C ---- */

        /* ============================================================
           KONZEPT V9 «NAVY MIRAGE» (23.10.2026) — mockups/konzept-v9-vergleich.html
           Aus den Vorlagen (Dashboard-Regeln, 60-30-10, Navy Mirage, Prueflisten):

           60-30-10   60 % ruhige Flaeche (--ds-bg, --ds-surface), 30 % Navy als
                      Struktur (Leiste, aktive Zustaende, Linien), 10 % Akzent:
                      EIN Hauptknopf je Seite mit Schatten in Markenfarbe.
           Bühne      Weicher Schein hinter allem (Verlauf, nie Hintergrundbild);
                      Leiste, Kopfzeile und Tab-Leiste sind Glas.
           Kennzahlen Einzelne Kacheln mit Symbol-Chip und Trendkapsel statt
                      eines Streifens (Regel 1 «Kennzahlen zuerst», Regel 3
                      «gleiche Karten»).
           Zustaende  Kapseln tragen Punkt oder Zeichen (`fw-dot`, «●»): Farbe ist nie allein.
           Pruefliste Fokus, hover, aktiv, deaktiviert fuer jeden Knopf; Ziele
                      mindestens 40 px hoch; 8-Punkt-Raster bei den Abstaenden.
           Alles hier sind Tokens und Klassen — keine Seite braucht Utilities.
           ============================================================ */
        .fw-body{background-color:var(--ds-bg);
            background-image:radial-gradient(900px 460px at 88% -120px,var(--ds-glow),transparent 72%),
                             radial-gradient(760px 420px at -6% 8%,var(--ds-glow-2),transparent 72%);
            background-repeat:no-repeat;background-attachment:fixed}
        .fw-side{background:color-mix(in srgb,var(--ds-surface) 78%,transparent);
            -webkit-backdrop-filter:saturate(1.3) blur(16px);backdrop-filter:saturate(1.3) blur(16px)}
        .fw-nav-eintrag.hier{box-shadow:inset 3px 0 0 var(--ds-brand)}
        .fw-btn.fw-primary{box-shadow:0 6px 16px -8px var(--ds-brand)}
        .fw-btn.fw-primary:hover{box-shadow:0 8px 20px -8px var(--ds-brand)}
        .fw-btn.fw-primary:active{box-shadow:none}
        .fw-card{transition:box-shadow .15s var(--ds-ease)}
        /* Kennzahlen: einzelne Kacheln */
        .fw-kpis{gap:16px;background:none;border:0;overflow:visible;box-shadow:none}
        .fw-kpis:not(.fw-stats)>.fw-kpi{border:1px solid var(--ds-line);border-radius:var(--ds-radius);margin:0;box-shadow:var(--ds-shadow-sm)}
        /* Die dichte Kennzahlenleiste einer Akte (`fw-stats`) bleibt ein Streifen:
           am Telefon ist sie gemessen 183 px hoch, einzelne Kacheln mit Rahmen
           und Abstand kaemen auf 210 (telefon.spec.ts). */
        .fw-kpis.fw-stats{gap:0;background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:var(--ds-radius);
            overflow:hidden;box-shadow:var(--ds-shadow-sm)}
        .fw-kpis.fw-stats>.fw-kpi{border:0;border-right:1px solid var(--ds-line);border-bottom:1px solid var(--ds-line);
            margin:0 -1px -1px 0;box-shadow:none}
        .fw-lage{gap:16px;background:none;border:0;overflow:visible;box-shadow:none}
        .fw-lage-kachel{border:1px solid var(--ds-line);border-radius:var(--ds-radius);background:var(--ds-surface);
            box-shadow:var(--ds-shadow-sm);transition:box-shadow .15s var(--ds-ease),transform .15s var(--ds-ease),border-color .12s}
        .fw-lage-kachel:first-child{border-left:1px solid var(--ds-line)}
        .fw-lage-kachel:hover{background:var(--ds-surface);border-color:var(--ds-line-stark);box-shadow:var(--ds-shadow);transform:translateY(-1px)}
        .fw-lage-kachel:focus-visible{border-radius:var(--ds-radius)}
        .fw-lage-kopf{display:flex;align-items:center;gap:10px}
        .fw-lage-kopf .fw-l{min-width:0}
        /* Symbol-Chip: weiche Flaeche in der Farbe des Zustands */
        .fw-sym{width:32px;height:32px;flex:0 0 32px;border-radius:var(--ds-radius-knopf);display:grid;place-items:center;
            background:var(--ds-brand-soft);color:var(--ds-brand-600)}
        .fw-sym .fw-zeichen{width:17px!important;height:17px!important}
        .fw-sym.good{background:var(--ds-good-soft);color:var(--ds-good)}
        .fw-sym.warn{background:var(--ds-warn-soft);color:var(--ds-warn)}
        .fw-sym.crit{background:var(--ds-crit-soft);color:var(--ds-crit)}
        .fw-sym.info{background:var(--ds-info-soft);color:var(--ds-info)}
        @media (max-width:1023px){
            .fw-lage{gap:12px}.fw-kpis{gap:12px}
        }
        @media (prefers-reduced-motion:reduce){.fw-lage-kachel,.fw-card{transition:none}.fw-lage-kachel:hover{transform:none}}
        /* AMPEL (Debitoren): drei Karten, zugleich Filter. Punkt + Text, nie nur Farbe. */
        .fw-ampeln{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px}
        .fw-ampel{display:flex;align-items:center;gap:14px;padding:16px 18px;min-width:0;text-decoration:none;color:inherit;
            background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:var(--ds-radius);box-shadow:var(--ds-shadow-sm);
            transition:box-shadow .15s var(--ds-ease),border-color .12s,transform .15s var(--ds-ease)}
        .fw-ampel:hover{border-color:var(--ds-line-stark);box-shadow:var(--ds-shadow);transform:translateY(-1px)}
        .fw-ampel.fw-on{border-color:var(--ds-ink);box-shadow:var(--ds-shadow)}
        .fw-punkt-ampel{width:14px;height:14px;flex:0 0 14px;border-radius:var(--ds-pill);background:var(--ds-good);
            box-shadow:0 0 0 4px var(--ds-good-soft)}
        .fw-ampel.gelb .fw-punkt-ampel{background:var(--ds-warn);box-shadow:0 0 0 4px var(--ds-warn-soft)}
        .fw-ampel.rot .fw-punkt-ampel{background:var(--ds-crit);box-shadow:0 0 0 4px var(--ds-crit-soft)}
        .fw-ampel-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
        .fw-ampel-text b{font-size:14px;font-weight:600}
        .fw-ampel-text span{font-size:12px;color:var(--ds-faint)}
        .fw-ampel-zahl{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap}
        .fw-ampel-zahl b{font-size:22px;font-weight:600;line-height:1}
        .fw-ampel-zahl span{font-size:12px;color:var(--ds-muted)}
        @media (max-width:900px){.fw-ampeln{grid-template-columns:1fr;gap:10px}}
        /* nur für Hilfstechnik sichtbar (Beschriftung ohne sichtbaren Text) */
        /* Sprunglink «Zum Inhalt» (WCAG 2.4.1): erst beim Tastaturfokus sichtbar. */
        .fw-skip{position:absolute;left:8px;top:-64px;z-index:1000;padding:10px 16px;border-radius:var(--ds-radius-sm);background:var(--ds-brand);color:var(--ds-auf-satt);font-weight:600;text-decoration:none}
        .fw-skip:focus{top:8px}
        .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
        /* LINKS ALS SEGMENT (Liste | Board, Liste | Monat) */
        .fw-segment .fw-seg-link{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--ds-radius-xs);
            font-size:13px;font-weight:600;color:var(--ds-muted);text-decoration:none;transition:background .12s,color .12s}
        .fw-segment .fw-seg-link:hover{color:var(--ds-ink)}
        .fw-segment .fw-seg-link.an{background:var(--ds-surface);color:var(--ds-ink);box-shadow:var(--ds-shadow-sm)}
        .fw-segment .fw-seg-link .fw-zeichen{width:15px!important;height:15px!important}
        /* TICKET-BOARD (Kanban) */
        .fw-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start;margin-bottom:24px}
        .fw-spalte{display:flex;flex-direction:column;gap:12px;min-width:0;padding:12px;border-radius:var(--ds-radius-lg);
            background:var(--ds-surface-2);border:1px solid var(--ds-line);transition:border-color .12s,background .12s}
        .fw-spalte.ziel{border-color:var(--ds-brand);background:var(--ds-brand-soft)}
        .fw-spalte-kopf{display:flex;align-items:center;gap:8px;padding:2px 4px}
        .fw-spalte-kopf h2{font-size:13px;font-weight:600;letter-spacing:.01em;margin:0}
        .fw-spalte-kopf .fw-z{font-size:12px;font-weight:600;padding:0 7px;line-height:18px;border-radius:var(--ds-pill);
            background:var(--ds-surface);border:1px solid var(--ds-line);color:var(--ds-muted)}
        .fw-spalte-liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-height:8px}
        .fw-spalte-leer{font-size:13px;color:var(--ds-faint);text-align:center;padding:14px 8px}
        .fw-karte{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--ds-surface);border:1px solid var(--ds-line);
            border-radius:var(--ds-radius);box-shadow:var(--ds-shadow-sm);transition:box-shadow .15s var(--ds-ease),border-color .12s;
            border-left:3px solid var(--ds-line-stark)}
        .fw-karte[draggable="true"]{cursor:grab}
        .fw-karte:hover{box-shadow:var(--ds-shadow);border-color:var(--ds-line-stark)}
        .fw-karte.zieht{opacity:.45}
        .fw-karte.crit{border-left-color:var(--ds-crit)}.fw-karte.warn{border-left-color:var(--ds-warn)}
        .fw-karte-kopf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--ds-faint)}
        .fw-karte-titel{font-size:14px;font-weight:600;line-height:1.35;color:var(--ds-ink);text-decoration:none}
        .fw-karte-titel:hover{color:var(--ds-brand)}
        .fw-karte-sub{font-size:13px;color:var(--ds-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .fw-karte-befunde{display:flex;flex-wrap:wrap;gap:6px}
        .fw-karte-fuss{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:2px;min-width:0}
        .fw-karte-alter{font-size:12px;color:var(--ds-faint);white-space:nowrap}
        .fw-karte-form{margin-left:auto;min-width:0;max-width:100%}
        .fw-karte-wahl{max-width:9.5rem;height:30px;padding:0 24px 0 8px;font:inherit;font-size:12px;font-weight:600;color:var(--ds-muted);
            background-color:var(--ds-surface-2);border:1px solid var(--ds-line);border-radius:var(--ds-radius-sm);cursor:pointer}
        .fw-board-suche{flex:1 1 16rem;max-width:22rem}
        @media (max-width:1180px){.fw-board{grid-template-columns:repeat(2,minmax(0,1fr))}}
        @media (max-width:720px){.fw-board{grid-template-columns:1fr}}
        /* MONATSKALENDER */
        .fw-kal-leiste{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
        .fw-kal-nav{display:flex;align-items:center;gap:8px}
        .fw-kal-nav .fw-knopf-rund{border:1px solid var(--ds-line);background:var(--ds-surface)}
        .fw-kal-art b{font-weight:600;opacity:.75;margin-left:2px}
        .fw-punkt-kal{width:8px;height:8px;border-radius:var(--ds-pill);display:inline-block;flex:0 0 8px;margin-right:6px;background:var(--ds-brand)}
        .fw-punkt-kal.frist{background:var(--ds-warn)}.fw-punkt-kal.ticket{background:var(--ds-crit)}.fw-punkt-kal.auszug{background:var(--ds-good)}
        .fw-kal-zwei{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
        .fw-kal-karte{margin-bottom:0;padding:0}
        .fw-kal-raster{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
        .fw-kal-kopf{padding:10px 12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ds-faint);
            background:var(--ds-surface-2);border-bottom:1px solid var(--ds-line)}
        .fw-kal-tag{min-height:112px;padding:8px 8px 6px;border-right:1px solid var(--ds-line);border-bottom:1px solid var(--ds-line);
            display:flex;flex-direction:column;gap:4px;min-width:0}
        .fw-kal-tag:nth-child(7n+14){border-right:0}
        .fw-kal-tag.aus{background:var(--ds-surface-2)}.fw-kal-tag.aus .fw-kal-nr{color:var(--ds-faint)}
        .fw-kal-tag.gewaehlt{box-shadow:inset 0 0 0 2px var(--ds-brand)}
        .fw-kal-nr{align-self:flex-start;min-width:26px;height:26px;display:grid;place-items:center;border-radius:var(--ds-pill);
            font-size:13px;font-weight:600;color:var(--ds-ink);text-decoration:none}
        .fw-kal-nr:hover{background:var(--ds-hover)}
        .fw-kal-tag.heute .fw-kal-nr{background:var(--ds-brand);color:var(--ds-auf-satt)}
        .fw-kal-chip{display:block;padding:2px 7px;border-radius:var(--ds-radius-xs);font-size:12px;font-weight:500;line-height:1.5;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;
            background:var(--ds-brand-soft);color:var(--ds-brand-600)}
        .fw-kal-chip i{font-style:normal;font-weight:600;font-family:var(--ds-mono);font-size:12px}
        .fw-kal-chip.warn{background:var(--ds-warn-soft);color:var(--ds-warn)}.fw-kal-chip.crit{background:var(--ds-crit-soft);color:var(--ds-crit)}
        .fw-kal-chip.good{background:var(--ds-good-soft);color:var(--ds-good)}.fw-kal-chip.info{background:var(--ds-info-soft);color:var(--ds-info)}
        .fw-kal-chip.gedaempft{opacity:.55;text-decoration:line-through}
        .fw-kal-chip:hover{filter:brightness(.96)}
        .fw-kal-mehr{font-size:12px;font-weight:600;color:var(--ds-muted);text-decoration:none;padding:0 4px}
        .fw-kal-tag-karte{position:sticky;top:76px;margin-bottom:0}
        .fw-kal-eintrag{align-items:flex-start}
        .fw-kal-eintrag .fw-punkt-kal{margin-top:7px}
        .fw-kal-liste{display:none}
        @media (max-width:1100px){.fw-kal-zwei{grid-template-columns:1fr}.fw-kal-tag-karte{position:static}}
        @media (max-width:720px){
            .fw-kal-raster{display:none}
            .fw-kal-liste{display:flex;flex-direction:column}
            .fw-kal-liste-tag{display:flex;gap:14px;padding:12px 16px;border-bottom:1px solid var(--ds-line)}
            .fw-kal-liste-tag.heute{background:var(--ds-brand-soft)}
            .fw-kal-liste-datum{display:flex;flex-direction:column;align-items:center;width:38px;flex:0 0 38px}
            .fw-kal-liste-datum b{font-size:22px;line-height:1.1}.fw-kal-liste-datum span{font-size:12px;color:var(--ds-faint);text-transform:uppercase}
            .fw-kal-liste-eintraege{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
            .fw-kal-chip{white-space:normal}
        }
        /* PORTFOLIO: zweite Linie, Donut, Cashflow-Summen */
        .fw-kurve-strich.zwei{stroke:var(--ds-faint);stroke-width:2;stroke-dasharray:6 5}
        .fw-legende-strich{display:inline-block;width:18px;height:0;border-top:2px solid var(--ds-brand);vertical-align:middle;margin-right:4px}
        .fw-legende-strich.zwei{border-top:2px dashed var(--ds-faint)}
        .fw-cash-summe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-bottom:4px}
        .fw-cash-summe div{display:flex;flex-direction:column;gap:2px;min-width:0}
        .fw-cash-summe span{font-size:13px;color:var(--ds-muted)}
        .fw-cash-summe b{font-size:22px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
        .fw-donut-zeile{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
        .fw-donut{position:relative;width:176px;height:176px;flex:0 0 176px}
        .fw-donut svg{width:100%;height:100%;transform:none}
        .fw-donut-spur,.fw-donut-teil{fill:none;stroke-width:5.2}
        .fw-donut-spur{stroke:var(--ds-surface-2)}
        .fw-donut-teil{stroke-linecap:butt;transition:opacity .15s}
        .fw-donut-teil.t0,.fw-punkt-donut.t0{stroke:var(--ds-brand);background:var(--ds-brand)}
        .fw-donut-teil.t1,.fw-punkt-donut.t1{stroke:color-mix(in srgb,var(--ds-brand) 78%,var(--ds-surface));background:color-mix(in srgb,var(--ds-brand) 78%,var(--ds-surface))}
        .fw-donut-teil.t2,.fw-punkt-donut.t2{stroke:color-mix(in srgb,var(--ds-brand) 58%,var(--ds-surface));background:color-mix(in srgb,var(--ds-brand) 58%,var(--ds-surface))}
        .fw-donut-teil.t3,.fw-punkt-donut.t3{stroke:color-mix(in srgb,var(--ds-brand) 42%,var(--ds-surface));background:color-mix(in srgb,var(--ds-brand) 42%,var(--ds-surface))}
        .fw-donut-teil.t4,.fw-punkt-donut.t4{stroke:color-mix(in srgb,var(--ds-brand) 28%,var(--ds-surface));background:color-mix(in srgb,var(--ds-brand) 28%,var(--ds-surface))}
        .fw-donut-teil.t5,.fw-punkt-donut.t5{stroke:color-mix(in srgb,var(--ds-brand) 18%,var(--ds-surface));background:color-mix(in srgb,var(--ds-brand) 18%,var(--ds-surface))}
        .fw-donut-teil{transform:rotate(0deg)}
        .fw-donut:hover .fw-donut-teil{opacity:.7}.fw-donut .fw-donut-teil:hover{opacity:1}
        .fw-donut-mitte{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
        .fw-donut-mitte b{font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
        .fw-donut-mitte span{font-size:12px;color:var(--ds-muted)}
        .fw-donut-legende{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;flex:1;min-width:11rem}
        .fw-donut-legende li{display:flex;align-items:center;gap:10px;font-size:14px;min-width:0}
        .fw-donut-legende li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .fw-punkt-donut{width:10px;height:10px;border-radius:var(--ds-pill);flex:0 0 10px}
        @media (max-width:720px){.fw-cash-summe{grid-template-columns:1fr;gap:8px}.fw-donut-zeile{justify-content:center}}
        /* ---- Ende Konzept V9 ---- */
        /* ============================================================
           EMBER (26.10.2026) — mockups/immoswiss-ember.html
           Helle Bento-Karten ohne Rahmen, Kapsel-Navigation oben, Tinte fuer das
           Aktive, ein warmer Akzent (Orange) als Flaeche. Dieser Block steht
           zuletzt und gewinnt damit gegen die Vorfassungen (v8, V9).

           60-30-10  60 % warmes Hell (--ds-bg, --ds-surface), 30 % Tinte
                     (Navigation, Hauptknopf, Text), 10 % Orange (Hauptkarte,
                     aktiver Balken, Hervorhebung). Orange als SCHRIFT ist
                     --ds-brand (#B04416, 5.7:1), als Flaeche --ds-akzent.
           Bewegung  Karten blenden gestaffelt ein und heben sich beim Zeigen;
                     Zahlen zaehlen hoch; die Bereichskapsel gleitet. Alles faellt
                     weg bei `prefers-reduced-motion` und in automatisierten
                     Laeufen (`html.fw-ruhig`, gesetzt wenn navigator.webdriver).
           ============================================================ */
        .fw-body{background-image:none;font-feature-settings:"ss01","cv11"}
        body.fw-body{letter-spacing:-.005em}

        /* ---- Huelle: Leiste nur noch als Schublade, Kapseln oben ---- */
        .fw-app{display:block}
        .fw-haupt{min-height:100vh;min-height:100dvh}
        @media (min-width:1024px){ .fw-side{display:none} }
        .fw-side{background:var(--ds-surface);border-right:0;box-shadow:var(--ds-shadow-lg);
            -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
        .fw-kopfleiste{position:relative;z-index:40;width:100%;max-width:1440px;margin:0 auto;
            padding-block:20px 0;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
        .fw-kapsel{background:var(--ds-surface);border-radius:var(--ds-pill);box-shadow:var(--ds-shadow-sm);height:52px;display:flex;align-items:center}
        .fw-logo-kapsel{gap:9px;padding:0 20px 0 14px;color:var(--ds-ink);text-decoration:none;flex:0 0 auto}
        .fw-logo-kapsel b{position:relative;font-size:18px;font-weight:700;letter-spacing:-.02em;padding-right:16px}
        .fw-logo-haus{width:30px;height:30px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
        .fw-logo-haus .a{stroke:var(--ds-ink)}.fw-logo-haus .b{stroke:var(--ds-akzent)}
        .fw-logo-kreuz{position:absolute;right:0;top:-2px;width:12px;height:12px}
        
        
        
        
        
        
        
        
        
        .fw-werkzeug-kapsel{gap:6px;padding:0 6px;flex:0 0 auto}
        .fw-werkzeug-kapsel .fw-knopf-rund{width:36px;height:36px;border-radius:var(--ds-pill)}
        .fw-knopf-rund.fw-knopf-dunkel{background:var(--ds-ink);color:var(--ds-surface)}
        .fw-knopf-rund.fw-knopf-dunkel:hover{background:var(--ds-ink);color:var(--ds-surface);transform:rotate(25deg)}
        .fw-werkzeug-kapsel .fw-pip{top:9px;right:10px;background:var(--ds-akzent);box-shadow:0 0 0 2px var(--ds-surface)}
        .fw-avatar-knopf{border:0;background:none;padding:0;cursor:pointer;border-radius:var(--ds-pill);display:grid}
        .fw-avatar.fw-avatar-gross{width:40px;height:40px;flex:0 0 40px;font-size:13px;font-weight:700;border:0;color:#fff;
            background:linear-gradient(135deg,var(--ds-karte-tief),var(--ds-karte-hell))}
        .fw-profil{left:auto;right:max(32px,env(safe-area-inset-right,0px));top:82px;bottom:auto;border:0;border-radius:var(--ds-radius);box-shadow:var(--ds-shadow-lg)}
        html._sbc .fw-profil{left:auto}
        .fw-taste{border-radius:var(--ds-radius-xs)}
        .fw-inhalt{max-width:1440px;padding:28px 32px 64px}
        @media (min-width:1760px){.fw-kopfleiste,.fw-inhalt{max-width:1680px}}
        @media (min-width:2200px){.fw-kopfleiste,.fw-inhalt{max-width:2000px}}
        @media (max-width:1023px){
            .fw-inhalt{padding:20px 16px calc(40px + env(safe-area-inset-bottom,0px))}
            .fw-freigabe{bottom:calc(16px + env(safe-area-inset-bottom))}
            .fw-toasts{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
            .fw-profil{top:72px;right:16px}
        }

        /* ---- Seitenkopf: gross und leicht ---- */
        .fw-phead h1,.fw-hallo h1{font-size:36px;font-weight:500;letter-spacing:-.04em;line-height:1.06}
        .fw-hallo h1{font-size:clamp(30px,3.4vw,44px)}
        /* «Heute» als dunkle Karte (Mix-Entwurf): Datum, Begrüssung und die Aufgaben als grosse Zahlen. Der Schwerpunkt steht darüber. */
        .fw-hallo{display:block}
        .fw-hallo>.fw-phead-knoepfe{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
        .fw-hero{display:flex;align-items:center;justify-content:space-between;gap:24px 40px;flex-wrap:wrap;padding:28px 32px;
            border-radius:var(--ds-radius-lg);background:var(--ds-hero);color:var(--ds-auf-hero)}
        .fw-hero-text{flex:1 1 360px;min-width:0}
        .fw-hero .fw-eyebrow{color:var(--ds-hero-leise)}
        .fw-hero .fw-eyebrow .fw-marke{color:var(--ds-hero-akzent)}
        .fw-hallo .fw-hero h1{color:var(--ds-auf-hero);font-size:28px;font-weight:600;letter-spacing:-.03em}
        .fw-hallo .fw-hero h1 em{color:var(--ds-hero-akzent);font-weight:600}
        .fw-hero .fw-heute-ueber{color:var(--ds-hero-gut)}
        .fw-hero .fw-statuszeile{flex:0 0 auto;flex-wrap:nowrap;gap:12px 32px;margin:0}
        .fw-hero .fw-sz{flex-direction:column;align-items:flex-start;gap:2px;min-height:0;padding:6px 4px;border:0;border-radius:var(--ds-radius-knopf);
            background:transparent;box-shadow:none;color:var(--ds-hero-leise);text-decoration:none}
        .fw-hero .fw-sz::before{display:none}
        .fw-hero .fw-sz:hover{background:rgba(255,255,255,.06);box-shadow:none}
        .fw-hero .fw-sz-zahl{font-size:40px;font-weight:600;line-height:1;letter-spacing:-.03em;color:var(--ds-auf-hero);font-variant-numeric:tabular-nums}
        .fw-hero .fw-sz-crit .fw-sz-zahl{color:var(--ds-hero-gut)}
        .fw-hero .fw-sz-text{font-size:13px;line-height:1.3;max-width:130px}
        @media (max-width:640px){
            .fw-hero{padding:22px 20px;gap:18px}
            .fw-hero .fw-statuszeile{flex:1 1 100%;min-width:0;flex-wrap:wrap;gap:10px 22px}
            .fw-hero .fw-sz{min-height:44px}
            .fw-hero .fw-sz-zahl{font-size:28px}
        }
        .fw-phead p{font-size:14px}
        .fw-aktenkopf h1{letter-spacing:-.03em}
        @media (max-width:640px){ .fw-phead h1{font-size:22px} .fw-hallo h1{font-size:28px} }
        /* Fünf Bereiche passen am Telefon in die Kapsel (390 px: «Berichte» war abgeschnitten): Block «Kopfzeile» */
        
        
        

        /* ---- Karten: ohne Rahmen, grosse Rundung, weicher Schatten ---- */
        .fw-card,.fw-aktenkopf,.fw-freigabe,.fw-kpis:not(.fw-stats)>.fw-kpi,.fw-lage-kachel,.fw-ampel,.fw-lauf{border-color:transparent;border-radius:var(--ds-radius)}
        .fw-card{box-shadow:var(--ds-shadow-sm)}
        .fw-kpis.fw-stats{border-color:transparent;border-radius:var(--ds-radius)}
        .fw-kopf{border-bottom-color:var(--ds-line);padding:18px 22px 14px}   /* Prototyp: Kartenkopf 18 px oben, 22 px seitlich */
        .fw-kopf h2,.fw-kopf .fw-t,.fw-card>.fw-h .fw-t{font-size:15px;font-weight:600;letter-spacing:-.015em}
        .fw-fuss{padding:14px 24px;border-top-color:var(--ds-line)}
        .fw-zeile{padding:14px 24px}
        .fw-rumpf{padding:22px 24px}
        /* Was man anklicken kann, hebt sich beim Zeigen (wie `whileHover y:-5`) */
        a.fw-card,a.fw-lage-kachel,.fw-kpis:not(.fw-stats)>.fw-kpi,.fw-lauf,.fw-ampel{
            transition:transform .35s var(--ds-ease),box-shadow .35s var(--ds-ease),border-color .2s}
        a.fw-card:hover,a.fw-lage-kachel:hover,.fw-kpis:not(.fw-stats)>.fw-kpi:hover,.fw-lauf:hover,.fw-ampel:hover{
            transform:translateY(-5px);box-shadow:var(--ds-shadow)}
        .fw-kpi .fw-v,.fw-lage .fw-w{font-weight:500;letter-spacing:-.035em}
        /* Gross nur, wo Platz ist — am Telefon gelten die Stufen der Kachelreihe (21 / 17 px) */
        @media (min-width:721px){.fw-kpis:not(.fw-stats) .fw-kpi .fw-v{font-size:28px}}
        /* Die Akzent-Kachel einer Kennzahlenreihe ist die orange Hauptkarte */
        .fw-kpis:not(.fw-stats)>.fw-kpi.fw-accent{background:radial-gradient(120% 120% at 100% 0%,var(--ds-karte-hell) 0%,transparent 55%),
            linear-gradient(155deg,var(--ds-karte-mitte) 0%,var(--ds-karte-tief) 100%);color:#fff}
        .fw-kpis:not(.fw-stats)>.fw-kpi.fw-accent .fw-l,.fw-kpis:not(.fw-stats)>.fw-kpi.fw-accent .fw-f{color:rgba(255,255,255,.92)}
        .fw-kpis:not(.fw-stats)>.fw-kpi.fw-accent .fw-v{color:#fff}
        .fw-kpis:not(.fw-stats)>.fw-kpi.fw-accent:hover{box-shadow:0 26px 50px -22px rgba(196,83,31,.7)}

        /* ---- Knoepfe: Kapseln, Hauptknopf in Tinte ---- */
        .fw-btn{border-radius:var(--ds-pill);min-height:40px;padding:8px 18px;font-weight:600;
            transition:transform .2s var(--ds-ease),box-shadow .2s,background .15s,border-color .15s}
        .fw-btn:hover{transform:translateY(-2px)}
        .fw-btn:active{transform:none}
        .fw-btn.fw-knapp{min-height:32px;padding:5px 14px}
        .fw-btn.fw-primary{background:var(--ds-ink);color:var(--ds-surface);border-color:transparent;box-shadow:0 10px 22px -12px rgba(23,24,27,.55)}
        .fw-btn.fw-primary:hover{background:var(--ds-ink);color:var(--ds-surface);box-shadow:0 14px 28px -12px rgba(23,24,27,.6)}
        /* Zielbild: Zeilenaktionen («Zuordnen», «Auslösen», «Auftrag erteilen»), der
           Dialog und «Neu» in der Kopfzeile tragen die Akzentfarbe; die grossen
           Seitenknöpfe bleiben schwarz. */
        .fw-btn.fw-knapp.fw-primary,.fw-zdlg .fw-btn.fw-primary{background:var(--ds-brand);color:var(--ds-auf-satt);box-shadow:0 8px 18px -12px var(--ds-brand)}
        .fw-btn.fw-knapp.fw-primary:hover,.fw-zdlg .fw-btn.fw-primary:hover{background:var(--ds-brand-600);color:var(--ds-auf-satt)}
        .fw-btn:disabled,.fw-btn[aria-disabled="true"]{transform:none}

        /* ---- Filter, Reiter, Segmente: Kapseln ---- */
        .fw-fchip{height:36px;padding:0 15px;font-size:14px;background:var(--ds-surface);border-color:var(--ds-line)}
        .fw-fchip.fw-on{background:var(--ds-ink);color:var(--ds-surface);border-color:var(--ds-ink)}
        .fw-reiter{border-top:0;gap:4px;padding:8px 16px}
        .fw-reiter a{border-radius:var(--ds-pill);padding:7px 14px}
        .fw-reiter a.hier{background:var(--ds-ink);color:var(--ds-surface)}
        .fw-reiter a.hier::after{display:none}
        .fw-reiter a.hier .fw-z{background:rgba(255,255,255,.18);color:inherit;border-color:transparent}
        .fw-segment{border-radius:var(--ds-pill);border:0;background:var(--ds-surface-2);padding:4px}
        .fw-segment button,.fw-segment .fw-seg-link{border-radius:var(--ds-pill)}
        .fw-segment button.an,.fw-segment button[aria-pressed="true"],.fw-segment .fw-seg-link.an{background:var(--ds-ink);color:var(--ds-surface);box-shadow:none}

        /* ---- Kapseln fuer Zustaende ---- */
        .fw-chip{padding:3px 10px;font-size:12px;border-radius:var(--ds-pill)}

        /* ---- Felder ---- */
        .fw-feld{border-color:var(--ds-line);background:var(--ds-surface);border-radius:var(--ds-radius-knopf)}
        .fw-feld:hover{border-color:var(--ds-line-stark)}
        .fw-listwerkzeug .fw-feld,.fw-suchfeld .fw-feld,input[type=search].fw-feld{border-radius:var(--ds-pill);background:var(--ds-surface-2);border-color:transparent;padding-left:16px}

        /* ---- Tabellen wie im Mockup: leiser Kopf, feine Linien ---- */
        .fw-table thead th{background:transparent;color:var(--ds-faint);font-weight:500;font-size:12px;border-bottom:1px solid var(--ds-line)}
        .fw-table tbody tr{transition:background .2s}
        .fw-table tbody tr:hover{background:var(--ds-hover)}
        .fw-table td{border-color:var(--ds-line)}

        /* ---- Hinweise ---- */
        .fw-hinweis{border-radius:var(--ds-radius)}

        /* ---- Schublade, Dialog, Palette ---- */
        .fw-toast{border-radius:var(--ds-radius)}

        /* ============ BEWEGUNG ============ */
        /* Eintritt: Bloecke der Seite gestaffelt */
        /* `backwards`, NICHT `both` (UI-Audit 26.10.2026): Eine Animation, die nach dem Ende
           stehen bleibt, macht in Chrome jeden Block dauerhaft zum eigenen Stapelkontext —
           ein «Mehr»-Menü im Seitenkopf lag dann UNTER den Kennzahlen, kein Eintrag war
           klickbar. `backwards` hält nur den Startzustand während der Verzögerung. */
        .fw-inhalt>*{animation:fw-auf .6s var(--ds-ease) backwards}
        .fw-inhalt>*:nth-child(2){animation-delay:.05s}.fw-inhalt>*:nth-child(3){animation-delay:.1s}
        .fw-inhalt>*:nth-child(4){animation-delay:.15s}.fw-inhalt>*:nth-child(5){animation-delay:.2s}
        .fw-inhalt>*:nth-child(n+6){animation-delay:.25s}
        .fw-kpis>*,.fw-lage>*,.fw-heute-kacheln>*,.fw-ampeln>*{animation:fw-auf .65s var(--ds-ease) backwards}
        .fw-kpis>*:nth-child(2),.fw-lage>*:nth-child(2),.fw-heute-kacheln>*:nth-child(2),.fw-ampeln>*:nth-child(2){animation-delay:.07s}
        .fw-kpis>*:nth-child(3),.fw-lage>*:nth-child(3),.fw-heute-kacheln>*:nth-child(3),.fw-ampeln>*:nth-child(3){animation-delay:.14s}
        .fw-kpis>*:nth-child(4),.fw-lage>*:nth-child(4),.fw-heute-kacheln>*:nth-child(4){animation-delay:.21s}
        @keyframes fw-auf{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
        html._embed .fw-inhalt>*,html.fw-ruhig .fw-inhalt>*,html.fw-ruhig .fw-kpis>*,html.fw-ruhig .fw-lage>*,html.fw-ruhig .fw-heute-kacheln>*,html.fw-ruhig .fw-ampeln>*{animation:none}
        html.fw-ruhig *{transition-duration:0s!important}
        @media (prefers-reduced-motion:reduce){
            .fw-inhalt>*,.fw-kpis>*,.fw-lage>*,.fw-heute-kacheln>*,.fw-ampeln>*{animation:none}
            
        }

        /* ---- UI-Audit 26.10.2026: Leerstand, Team & Auslastung ----
           Einfache Liste in einer Karte (Leerstand «Frei, aber versorgt»). */
        .fw-liste{list-style:none;margin:0;padding:2px 16px 12px}
        .fw-liste>li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:10px 0;border-top:1px solid var(--ds-line)}
        .fw-liste>li:first-child{border-top:0}
        /* Team: je Person Kürzel, Name, Lastbalken, drei Zahlen. */
        .fw-team-liste{list-style:none;margin:0;padding:4px 20px 14px;display:flex;flex-direction:column}
        .fw-team-zeile{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--ds-line)}
        .fw-team-zeile:first-child{border-top:0}
        .fw-team-zeile .fw-avci{width:38px;height:38px;font-size:12px;margin-top:2px}
        .fw-team-mitte{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
        .fw-team-name{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
        .fw-team-name b{font-weight:600}
        .fw-team-zahlen{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--ds-muted)}
        .fw-team-zahlen b{color:var(--ds-ink);font-weight:600}
        /* Lastbalken: Kapsel, Breite aus `data-w` (Skript in base.html, kein style-Attribut). */
        .fw-lastbalken{display:block;height:8px;border-radius:var(--ds-pill);background:var(--ds-surface-2);overflow:hidden}
        .fw-lastbalken i{display:block;height:100%;width:0;border-radius:var(--ds-pill);background:var(--ds-ink);transition:width .9s var(--ds-ease)}
        .fw-lastbalken.warn i{background:linear-gradient(90deg,var(--ds-akzent-hell),var(--ds-akzent))}
        .fw-lastbalken.crit i{background:var(--ds-crit)}
        .fw-alter-zeile{display:grid;grid-template-columns:64px minmax(0,1fr) 40px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ds-line)}
        .fw-alter-zeile:first-child{border-top:0}
        .fw-alter-zeile b{text-align:right;font-weight:600}
        .fw-alter-label{font-size:13px;color:var(--ds-muted)}
        .fw-alter-zeile .fw-lastbalken{height:12px}
        @media (max-width:640px){.fw-team-liste{padding:2px 16px 12px}.fw-team-zeile .fw-avci{width:32px;height:32px}}
        /* ---- Ende UI-Audit ---- */
        /* ============================================================
           BAUSTEINE V11 (26.10.2026): Bento, Raster, Assistent, Prozess, Hilfe
           Ein Baukasten für alle Module — keine Seite baut sich ihr eigenes
           Raster mehr (CONTRIBUTING.md, Abschnitt V11).
           ============================================================ */
        /* Bento: 12 Spalten, Kacheln S (3), M (4), L (6), XL (8), breit (12). Am Tablet 6, am Telefon 1. */
        .fw-bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:24px}
        .fw-bento>*{grid-column:span 4;min-width:0;margin:0}

        .fw-mzm{display:flex;flex-direction:column;gap:16px}

        .fw-mzm-kachel{min-height:0;padding:14px;gap:0;background:var(--ds-surface-2);box-shadow:none;border:1px solid var(--ds-line)}

        /* ===== MODUL Profilmenue Mandant (28.10.2026) ===== */
        /* Mandantenwechsel und «Zuletzt geöffnet» stehen bei jeder Breite im Profilmenü `#fwProfil`: Ab 1024 px ist die

           «Kopfzeile»: 100dvh - 96px, danach scrollt es in sich). Eigene Klasse für die Liste, nicht `.fw-zuletzt`: Diese

        .fw-profil{overflow-x:hidden}

        /* Guss (23.11.2026): Die Aktenliste steht in derselben Karte wie jede andere Liste (vorher rahmenlos auf dem Seitengrund). */

        /* ===== Ende Akten, Modul 2 ===== */
        /* ===== Heute, Modul 3 (Mockup «Immoswiss Heute»): Begrüssung ruhig auf dem Seitengrund, Schwerpunkt daneben,
           die Aufgabenzahlen als ein Band mit Zellen (dieselben Links aus `faelle/heute_kacheln.py`), Reiter des Arbeitsvorrats
           als Text mit Markenstrich, Karten mit Linie. Nur Gestalt. ===== */
        html .fw-hallo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 16px;align-items:end;margin-bottom:18px}

        html .fw-hallo .fw-hero-text{grid-column:1;grid-row:1;min-width:0}
        html .fw-hallo .fw-hero .fw-eyebrow{color:var(--ds-muted);font-size:12px;letter-spacing:.05em}
        html .fw-hallo .fw-hero .fw-eyebrow .fw-marke{color:var(--ds-brand)}
        html .fw-hallo .fw-hero h1{color:var(--ds-ink);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.2;margin:2px 0 0}
        html .fw-hallo .fw-hero h1 em{display:block;font-family:var(--ds-font);font-size:14px;font-weight:400;letter-spacing:0;line-height:1.5;color:var(--ds-muted);margin-top:2px}
        html .fw-hallo .fw-hero .fw-heute-ueber{color:var(--ds-crit);font-weight:600}
        html .fw-hallo .fw-hero .fw-statuszeile{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;margin:0;

        html .fw-hallo .fw-hero .fw-sz{flex-direction:column;align-items:flex-start;gap:2px;min-height:0;padding:14px 16px;border:0;border-radius:var(--ds-radius-0);
            background:var(--ds-surface);color:var(--ds-muted);box-shadow:1px 0 0 var(--ds-line),0 1px 0 var(--ds-line)}
        html .fw-hallo .fw-hero .fw-sz:hover{background:var(--ds-hover);box-shadow:1px 0 0 var(--ds-line),0 1px 0 var(--ds-line)}
        html .fw-hallo .fw-hero .fw-sz-zahl{font-size:24px;line-height:1.1;color:var(--ds-ink)}
        html .fw-hallo .fw-hero .fw-sz-crit .fw-sz-zahl{color:var(--ds-crit)}
        html .fw-hallo .fw-hero .fw-sz-text{font-size:12px;line-height:1.4;max-width:none;color:var(--ds-muted)}
        html .fw-card.fw-vorrat,html .fw-neben>.fw-card{border:1px solid var(--ds-line)}
        .fw-vorrat>.fw-reiter{gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:0 10px;border:0;border-bottom:1px solid var(--ds-line);background:transparent}
        .fw-vorrat>.fw-reiter a{border:0;border-bottom:2px solid transparent;border-radius:var(--ds-radius-0);background:transparent;padding:9px 10px;margin-bottom:-1px;
            color:var(--ds-muted);font-weight:500;white-space:nowrap}
        .fw-vorrat>.fw-reiter a:hover{background:transparent;color:var(--ds-ink)}
        .fw-vorrat>.fw-reiter a.hier,.fw-vorrat>.fw-reiter a[aria-selected="true"]{background:transparent;border-color:transparent;border-bottom-color:var(--ds-brand);color:var(--ds-ink);font-weight:600}
        .fw-vorrat>.fw-reiter a.crit .fw-z{color:var(--ds-crit)}
        html .fw-vz.sel{background:var(--ds-brand-soft);box-shadow:none}
        @media (max-width:640px){
            html .fw-hallo{grid-template-columns:minmax(0,1fr)}
            html .fw-hallo>.fw-phead-knoepfe{grid-column:1;grid-row:2;justify-content:flex-start}
            html .fw-hallo .fw-hero h1{font-size:22px}
            html .fw-hallo .fw-hero .fw-statuszeile{grid-template-columns:1fr 1fr}
            html .fw-hallo .fw-hero .fw-sz{min-height:44px;padding:12px 14px}
            .fw-vorrat>.fw-reiter a{min-height:42px}

        /* ===== Ende Heute, Modul 3 ===== */
        /* ===== Listen, Modul 2b: Zeilenaktionen bleiben in einer Zeile (Mandate); die Tabelle scrollt notfalls in `.fw-tablewrap`.
           Dienstleister-Karten nutzen die volle Breite (oben von der Lesespalte ausgenommen). ===== */
        .fw-zeilenakt{display:inline-flex;flex-wrap:nowrap;align-items:center;justify-content:flex-end;gap:12px;white-space:nowrap}
        .fw-zeilenakt form{display:inline-flex}
        @media (max-width:640px){.fw-zeilenakt{flex-wrap:wrap;white-space:normal;gap:8px 12px}}
        /* ===== Ende Listen, Modul 2b ===== */
        /* ===== Liegenschaftsliste, Modul 2: Vorschau rechts neben der Liste und Ansicht «Karten» (dieselbe Tabelle, als Karten
           gesetzt). Gesetzt von `static/js/fw-liegenschaften.js`. Bis 1099 px gibt es keine Vorschau, bis 640 px keinen Schalter:
           dort ist die Tabelle ohnehin gestapelt und die Zeile öffnet die Akte. ===== */
        .fw-ansicht-schalter{display:none}
        html table.fw-table .fw-lg-peek-zelle{display:none}
        .fw-lg-vorschau{display:none}
        .fw-lg-spalten{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
        @media (min-width:641px){
            .fw-ansicht-schalter:not([hidden]){display:inline-flex;margin-left:auto;padding:3px;gap:2px;background:var(--ds-surface-2);border-radius:var(--ds-pill)}
            html .fw-karten .fw-tablewrap{overflow:visible}
            html .fw-karten table.fw-table{display:block;min-width:0;background:transparent}
            html .fw-karten table.fw-table thead{display:none}
            html .fw-karten table.fw-table tbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:14px 0}
            html .fw-karten table.fw-table tbody tr{display:flex;flex-direction:column;gap:4px;position:relative;padding:14px 16px;
                background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:var(--ds-radius)}
            html .fw-karten table.fw-table tbody tr:hover{background:var(--ds-hover)}
            html .fw-karten table.fw-table tbody td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:2px 0;border:0;
                text-align:right;white-space:normal;background:transparent}
            html .fw-karten table.fw-table tbody td::before{content:attr(data-label);color:var(--ds-muted);font-size:12px;text-align:left}
            html .fw-karten table.fw-table tbody td:first-child{display:block;text-align:left;margin-bottom:6px;padding-right:96px}
            html .fw-karten table.fw-table tbody td:first-child::before{content:none}
        }
        @media (min-width:1100px){
            html table.fw-table .fw-lg-peek-zelle{display:table-cell}
            html .fw-karten table.fw-table tbody td.fw-lg-peek-zelle{display:block;position:absolute;top:10px;right:10px;padding:0}
            html .fw-karten table.fw-table tbody td.fw-lg-peek-zelle::before{content:none}
            .fw-lg-spalten.mit-vorschau{grid-template-columns:minmax(0,1fr) 320px}
            .fw-lg-vorschau:not([hidden]){display:block;position:sticky;top:72px;padding:16px;background:var(--ds-surface);
                border:1px solid var(--ds-brand);border-radius:var(--ds-radius)}
            html table.fw-table tbody tr.sel{background:var(--ds-brand-soft)}
        }
        .fw-lg-v-kopf{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
        .fw-lg-v-titel{display:block;font-family:var(--ds-disp);font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
        .fw-lg-v-daten{display:grid;grid-template-columns:104px minmax(0,1fr);gap:6px 10px;margin:0 0 12px;font-size:13px}
        .fw-lg-v-daten dt{color:var(--ds-muted)}
        .fw-lg-v-daten dd{margin:0;min-width:0;overflow-wrap:anywhere}
        .fw-lg-v-befund{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
        .fw-lg-v-knoepfe{display:flex;flex-wrap:wrap;gap:8px}
        /* ===== Ende Liegenschaftsliste, Modul 2 ===== */
        /* ===== Handy-Navigation als Blatt von unten (Mockup, 22.11.2026): «Mehr» und der Menüknopf öffnen dieselbe Schiene, jetzt als
           Blatt mit Griff. Oben der Arbeitsbereich (Verwaltung und Bestand), darunter die Bereiche; ein Tipp klappt die Seiten des
           Bereichs im Blatt auf (`html.fw-blatt`, `static/js/fw-schiene.js`). Ohne Skript bleiben die Bereiche Links. ===== */
        @media (max-width:640px){
            .fw-schiene{left:0;right:0;top:auto;bottom:0;width:100%;height:auto;max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;z-index:70;
                padding:8px 12px calc(16px + env(safe-area-inset-bottom,0px));border:0;border-radius:var(--ds-radius) var(--ds-radius) var(--ds-radius-0) var(--ds-radius-0);
                transform:translateY(105%);box-shadow:var(--ds-shadow-lg)}
            .fw-schiene.offen{transform:none}
            .fw-schiene::before{content:"";flex:0 0 auto;display:block;width:38px;height:4px;margin:4px auto 10px;border-radius:var(--ds-pill);background:var(--ds-line-stark)}
            .fw-schiene .fw-schiene-marke{display:none}
            .fw-schiene .fw-schiene-b{min-height:48px;padding:10px 12px;gap:14px;font-size:15px;font-weight:500;color:var(--ds-muted);border-radius:var(--ds-radius-knopf);background:transparent}
            .fw-schiene .fw-schiene-b.hier,.fw-schiene .fw-schiene-b[aria-expanded="true"]{color:var(--ds-ink);background:transparent}
            .fw-schiene .fw-schiene-b .fw-schiene-zahl{background:transparent;color:var(--ds-faint);font-family:var(--ds-mono);font-size:12px;font-weight:500;min-width:0;padding:0}
            .fw-schiene .fw-schiene-b .fw-schiene-zahl.crit{color:var(--ds-crit)}
            .fw-schiene .fw-schiene-fuss{margin-top:0;padding-top:0;border-top:0}
            html.fw-blatt .fw-fach{display:none}
            html.fw-blatt .fw-arbeit{display:flex;align-items:center;gap:8px;width:100%;min-width:0;min-height:52px;margin-bottom:8px;padding:10px 12px;border:0;
                border-radius:var(--ds-radius-knopf);background:var(--ds-surface-2);color:var(--ds-ink);font:inherit;text-align:left;cursor:pointer}
            html.fw-blatt .fw-arbeit-text{display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
            html.fw-blatt .fw-arbeit-text b,html.fw-blatt .fw-arbeit-text small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            html.fw-blatt .fw-arbeit-text small{font-size:12px;color:var(--ds-muted)}
            html.fw-blatt .fw-arbeit-pop:not([hidden]){display:block;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80;
                max-height:70dvh;overflow:auto;padding:10px;background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:var(--ds-radius);box-shadow:var(--ds-shadow-lg)}
            html.fw-blatt .fw-schiene [data-fach-bereich]{margin:2px 0 6px 21px;padding:0 0 0 0;border-left:1px solid var(--ds-line)}
            html.fw-blatt .fw-schiene [data-fach-bereich] h2{display:none}
            html.fw-blatt .fw-schiene [data-fach-bereich] h3{margin:10px 0 2px 14px;font-size:12px}
            html.fw-blatt .fw-schiene [data-fach-bereich] li a{min-height:32px;padding:5px 12px;margin-left:6px;font-size:14px;border-radius:var(--ds-radius-knopf)}
            html.fw-blatt .fw-schiene [data-fach-bereich] li a.hier{background:var(--ds-hover);color:var(--ds-ink);font-weight:600;box-shadow:inset 2px 0 0 var(--ds-brand)}
            html.fw-blatt .fw-schiene [data-fach-bereich] ul{list-style:none;margin:0;padding:0}
            html.fw-blatt .fw-schiene [data-fach-bereich] li a{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ds-muted);text-decoration:none}
            html.fw-blatt .fw-schiene [data-fach-bereich] li a:hover{background:var(--ds-hover);color:var(--ds-ink)}
            html.fw-blatt .fw-schiene [data-fach-bereich] .fw-fach-rechts{display:inline-flex;align-items:center;gap:8px}
            html.fw-blatt .fw-schiene [data-fach-bereich] .fw-z{min-width:20px;padding:0 7px;border-radius:var(--ds-pill);background:var(--ds-akzent);color:var(--ds-auf-satt);font-size:12px;font-weight:700;line-height:20px;text-align:center}
            html.fw-blatt .fw-schiene [data-fach-bereich] .fw-z[hidden]{display:none}
            html.fw-blatt .fw-schiene [data-fach-bereich] .fw-fach-selten-liste li a{font-size:14px}
            html.fw-blatt .fw-schiene [data-fach-bereich] kbd{display:none}
            html.fw-blatt .fw-arbeit-titel{padding:8px 10px 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ds-faint)}
            html.fw-blatt .fw-arbeit-pop .fw-feld{width:100%;height:44px;margin:2px 0 4px}
            html.fw-blatt .fw-arbeit-wahl{display:flex;align-items:center;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:var(--ds-radius-xs);background:transparent;
                color:var(--ds-ink);font:inherit;font-size:15px;text-align:left;text-decoration:none;cursor:pointer}
            html.fw-blatt .fw-arbeit-wahl.an{font-weight:600}
            html.fw-blatt .fw-arbeit-wahl.an::after{content:"✓";margin-left:auto;color:var(--ds-brand)}
            html.fw-blatt .fw-arbeit-wahl[hidden]{display:none}
            html.fw-blatt .fw-schiene [data-fach-bereich]{margin:2px 0 8px 22px}
            html.fw-blatt .fw-schiene [data-fach-bereich] li a{min-height:42px;font-size:15px}
        }
        /* ===== Ende Handy-Navigation als Blatt ===== */
        /* ===== Schäden, Modul 4 (Mockup «Immoswiss Schäden») =====
           Liste: volle Breite statt Lesespalte, Karte mit Linie, Sichten als Text mit Markenstrich, Zeilen ab 900 px im Spaltenraster
           (Nummer, Schaden, Zuständig, Dauer, Aktion). Nur Gestalt; die Zeile öffnet weiter die Akte im Fenster.
           Im Fenster (`html._embed`, iframe) haben Kopfleiste und Handy-Tableiste nichts verloren: die frühere Regel dafür hatte ihr
           `display:none` verloren, die Tableiste kam später dazu. */
        html._embed .fw-kopfleiste,html._embed .fw-tabbar,html._embed .fw-schiene-vorhang{display:none!important}
        html._embed .fw-mit-schiene{--fw-tab-h:0px}
        html._embed .fw-mit-schiene .fw-haupt{padding-bottom:0}
        html .fw-card.fw-schadenliste{border:1px solid var(--ds-line)}
        .fw-schadenliste>.fw-reiter{gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:0 10px;border:0;border-bottom:1px solid var(--ds-line);background:transparent}
        .fw-schadenliste>.fw-reiter a{border:0;border-bottom:2px solid transparent;border-radius:var(--ds-radius-0);background:transparent;padding:9px 10px;margin-bottom:-1px;
            color:var(--ds-muted);font-weight:500;white-space:nowrap}
        .fw-schadenliste>.fw-reiter a:hover{background:transparent;color:var(--ds-ink)}
        .fw-schadenliste>.fw-reiter a.hier,.fw-schadenliste>.fw-reiter a[aria-selected="true"]{background:transparent;border-color:transparent;border-bottom-color:var(--ds-brand);color:var(--ds-ink);font-weight:600}
        .fw-schaden-nr,.fw-schaden-wer{display:none}
        @media (min-width:900px){
            html .fw-schadenliste .fw-schadenzeile{display:grid;grid-template-columns:10px 64px minmax(0,1fr) 28px 110px 128px;gap:14px;align-items:center}
            .fw-schaden-nr{display:block;font-family:var(--ds-mono);font-size:12px;font-weight:500;color:var(--ds-muted)}
            .fw-schaden-wer{display:grid;place-items:center;width:24px;height:24px;border-radius:var(--ds-kreis);background:var(--ds-surface-2);color:var(--ds-muted);

            .fw-schaden-wer.offen{background:transparent;border:1px dashed var(--ds-line-stark);color:var(--ds-faint)}

        @media (max-width:640px){ .fw-schadenliste>.fw-reiter a{min-height:42px} }
        /* Modul 4, zweiter Teil: Suche in der Filterzeile, «Schaden erfassen» als Schublade von rechts (ab 900 px), Board in voller Breite. */
        .fw-schaden-suche{margin-left:auto;flex:0 1 280px;min-width:0}
        .fw-schaden-suche .fw-feld{width:100%;height:36px}
        .fw-spalte-kopf h2{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ds-muted)}
        @media (max-width:640px){ .fw-schaden-suche{flex:1 1 100%;margin-left:0} .fw-schaden-suche .fw-feld{height:44px} }
        @media (min-width:900px){

                border-radius:var(--ds-radius-0);border:0;border-left:1px solid var(--ds-line);box-shadow:var(--ds-shadow-lg)}
            .fw-schublade-rechts:not(.hidden)::before{content:"";position:fixed;top:0;bottom:0;left:0;right:min(460px,100vw);background:var(--ds-scrim)}
            .fw-schublade-rechts .fw-formular{grid-template-columns:minmax(0,1fr)}
            .fw-schublade-rechts .fw-formular>*{grid-column:1/-1}
        }
        /* ===== Ende Schäden, Modul 4 ===== */
        /* ===== Monatsabschluss, Modul 5 (Mockup «Immoswiss Monatsabschluss») =====
           Übersicht in voller Breite: Fortschrittsbalken (`progress.fw-la-fortschritt`, dieselben Zahlen wie die Unterzeile), links die
           Schritte, rechts ab 1100 px «Zuletzt abgeschlossen». Nur Gestalt. */

        /* ===== Aus einem Guss (22.11.2026): EINE Form je Baustein auf allen Seiten. Gemessen über alle Seiten der Navigation

        html .fw-kpis:not(.fw-gross)>.fw-kpi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;height:auto;min-height:0;max-height:none;

        html .fw-kpis:not(.fw-gross)>.fw-kpi .fw-v.fw-crit,html .fw-kpis:not(.fw-gross)>.fw-kpi.fw-accent .fw-v.fw-crit{color:var(--ds-crit)}

        /* ===== MODUL Kopfzeile und Omnisearch (27.10.2026) ===== */
        /* Vorlage: navmock/v2/vorschau (freigegeben, Stand «Kopfzeile v2»). Zeile 1 von links: Marke,

             901-1023    Marke kleiner, ohne «+» (im Profilmenü), Bereiche dürfen in sich scrollen

        .fw-kopf-z1{display:flex;align-items:center;gap:12px}
        

        /* Marke: Tablet und Telefon kleiner, nie nur das Zeichen */
        @media (max-width:1023px){

        /* Bestandsfilter `lg` als Kontext-Chip: Überzeile «BESTAND», darunter der Name. Die native Auswahl
