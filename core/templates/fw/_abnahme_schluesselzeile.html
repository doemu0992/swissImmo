{% load i18n %}{% comment %}Eine Zeile des Schlüsselverzeichnisses (Abschluss der Abnahme vor Ort). `z` leer = Vorlage für «Schlüssel hinzufügen».{% endcomment %}
<div class="vo-skz">
    <label class="zwei">{% trans "Schlüssel" %}<input class="fw-feld" name="s_bezeichnung" maxlength="80" value="{{ z.bezeichnung|default:'' }}"></label>
    <button type="button" class="fw-btn" data-sch-weg aria-label="{% trans 'Schlüsselzeile entfernen' %}">{% trans "Entfernen" %}</button>
    <label class="breit">{% trans "Schliessanlage / Schlüsselnummer" %}<input class="fw-feld" name="s_anlage" maxlength="80" value="{{ z.anlage|default:'' }}"></label>
    <label>{% trans "Soll" context "Schlüssel" %}<input class="fw-feld" name="s_soll" inputmode="numeric" value="{{ z.soll|default_if_none:'' }}"></label>
    <label>{% trans "Ist" %}<input class="fw-feld" name="s_ist" inputmode="numeric" value="{{ z.ist|default_if_none:'' }}"></label>
    <div class="vo-skz-fehlt">{% trans "Fehlend" %}<b data-fehlt>–</b></div>
    <label class="zwei">{% trans "Ersatz je fehlendem Schlüssel CHF" %}<input class="fw-feld" name="s_kosten" inputmode="decimal" value="{{ z.kosten_je_stueck|default_if_none:'' }}" placeholder="{% trans 'Schlüssel oder Zylinder' %}"></label>
    <div class="vo-skz-fehlt">{% trans "Zulasten Mieter" %}<b data-sch-kosten>–</b></div>
</div>
