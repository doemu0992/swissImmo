{# Tab-Leiste für Detailseiten. Erwartet: gruppe (str), tabs (Liste [key,label,badge]) #}
<div class="flex gap-6 border-b border-slate-200 text-sm font-medium mt-6 mb-6 overflow-x-auto">
    {% for key, label, badge in tabs %}
    <button data-tab="{{ gruppe }}" data-target="{{ key }}" onclick="fwTab('{{ gruppe }}', '{{ key }}')"
            class="pb-3 border-b-2 flex items-center gap-2 whitespace-nowrap
                   {% if forloop.first %}border-indigo-600 text-indigo-600{% else %}border-transparent text-slate-500{% endif %}">
        {{ label }}
        {% if badge %}<span class="text-[11px] font-bold bg-slate-100 text-slate-600 rounded-md px-1.5 py-0.5">{{ badge }}</span>{% endif %}
    </button>
    {% endfor %}
</div>
