{% extends 'fw/base.html' %}
{% block title %}{{ titel }} — swissImmo{% endblock %}
{% block content %}
<div class="fw-phead"><h1>{{ titel }}</h1></div>
<div class="max-w-2xl mt-8 bg-white rounded-xl border border-slate-200 p-8 text-center">
    <div class="w-16 h-16 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-2xl mx-auto mb-4">
        <i class="fa-solid {{ icon }}"></i>
    </div>
    <h2 class="text-lg font-bold text-slate-800 mb-2">{{ titel }}</h2>
    <p class="text-sm text-slate-500 leading-relaxed">{{ text }}</p>
    <span class="inline-block mt-5 px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-500">In Vorbereitung</span>
</div>
{% endblock %}
