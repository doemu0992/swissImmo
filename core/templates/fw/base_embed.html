<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}swissImmo{% endblock %}</title>
{% include 'fw/_assets.html' %}
    <style>
        body { font-family: 'IBM Plex Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
<div class="p-5 sm:p-6 max-w-3xl mx-auto">
    {% if messages %}
    <div class="space-y-2 mb-4">
        {% for m in messages %}
        <div class="text-sm px-4 py-2 rounded-xl {% if 'error' in m.tags %}bg-rose-50 text-rose-700 border border-rose-100{% else %}bg-emerald-50 text-emerald-700 border border-emerald-100{% endif %}">{{ m }}</div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}
</div>
{% block scripts %}{% endblock %}
</body>
</html>
