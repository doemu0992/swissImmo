<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    @page { size: A4 portrait; margin: 2.2cm 2cm 2cm 2cm;
        @frame footer { -pdf-frame-content: footerContent; bottom: 1cm; margin-left: 2cm; margin-right: 2cm; height: 1cm; } }
    body { font-family: Helvetica, sans-serif; font-size: 9.5pt; color: #1e293b; line-height: 1.5; }
    h1 { font-size: 15pt; margin: 0 0 4pt 0; }
    h2 { font-size: 11pt; margin: 14pt 0 4pt 0; }
    .kopf { font-size: 8pt; color: #64748b; border-bottom: 1px solid #e2e8f0; padding-bottom: 4pt; margin-bottom: 12pt; }
    .subtitle { font-size: 9pt; color: #64748b; margin-bottom: 12pt; }
    .sec { background-color: #f1f5f9; font-weight: bold; font-size: 10pt; padding: 4pt 7pt; margin: 12pt 0 5pt 0; }
    .note { font-size: 8.5pt; color: #475569; margin: 4pt 0; }
    .adr { margin: 4pt 0 14pt 0; }
    ol { margin: 4pt 0 4pt 16pt; padding: 0; }
    ol li { margin: 3pt 0; }
    ul { margin: 4pt 0 4pt 16pt; padding: 0; }
    ul li { margin: 2.5pt 0; }
    table.data { width: 100%; border-collapse: collapse; margin: 4pt 0; }
    table.data td { padding: 3pt 0; vertical-align: top; }
    table.data td.k { color: #64748b; width: 42%; }
    table.form { width: 100%; border-collapse: collapse; margin: 4pt 0; }
    table.form td { border: 0.75pt solid #cbd5e1; padding: 5pt 6pt; font-size: 8.5pt; }
    table.form td.k { background-color: #f8fafc; color: #475569; width: 40%; }
    p { margin: 6pt 0; }
    .sign { width: 100%; margin-top: 26pt; }
    .sign td { width: 240pt; vertical-align: bottom; padding-top: 30pt; font-size: 8pt; color: #64748b; }
    .sigline { border-top: 1px solid #94a3b8; padding-top: 3pt; }
</style>
</head>
<body>

<div class="kopf">{{ vermieter_name }} | {{ vermieter_strasse }} | {{ vermieter_plz }} {{ vermieter_ort }}</div>

{% block inhalt %}{% endblock %}

<div id="footerContent" style="font-size:7pt;color:#94a3b8;text-align:center;">
    {{ vermieter_name }} · {{ liegenschaft.strasse }}, {{ liegenschaft.plz }} {{ liegenschaft.ort }} · erstellt am {{ heute|date:"d.m.Y" }} · Seite <pdf:pagenumber> von <pdf:pagecount>
</div>

</body>
</html>
