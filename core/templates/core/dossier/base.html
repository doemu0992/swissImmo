<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dossier{% endblock %} — swissImmo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/app/" class="flex items-center gap-2 text-slate-500 hover:text-indigo-600 font-bold text-sm transition-colors">
                <i class="fa-solid fa-arrow-left"></i> Zurück zur App
            </a>
            <div class="text-[10px] font-black uppercase tracking-widest text-slate-400 flex items-center gap-2">
                <i class="fa-solid fa-folder-open text-indigo-400"></i>
                {% block dossier_typ %}Dossier{% endblock %}
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8 space-y-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="max-w-6xl mx-auto px-6 pb-10 text-center text-[10px] font-bold text-slate-300 uppercase tracking-widest">
        swissImmo Dossier
    </footer>
</body>
</html>
