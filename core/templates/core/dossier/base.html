<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dossier{% endblock %} — swissImmo</title>
{% include 'core/_assets_aussen.html' %}
    <script>
        tailwind.config = { theme: { extend: { colors: {
            petrol: { 50:'#f0f7fa', 100:'#d9eaf0', 200:'#b6d6e2', 600:'#17607a', 700:'#135064', 800:'#0f3f52', 900:'#0b2e3b' },
            coral:  { 50:'#fef3f2', 100:'#fde4e1', 400:'#f58a7e', 500:'#f26d5f', 600:'#e0503f', 700:'#c03d2f' },
        }}}};
    </script>
    <style>
        body { font-family: 'IBM Plex Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="fw-flaeche2 fw-strong">
<div class="flex min-h-[100dvh]">

    <!-- SIDEBAR: identisch zur App, damit alles wie EINE Anwendung wirkt -->
    <aside class="w-64 fw-btn fw-primary flex-col min-h-[100dvh] hidden md:flex flex-shrink-0">
        <a href="/app/" class="p-8 text-2xl font-black flex items-center gap-3 tracking-tighter">
            <div class="w-9 h-9 rounded-xl fw-balken-voll flex items-center justify-center text-sm shadow-lg fw-schatten-marke">
                <i class="fa-solid fa-building"></i>
            </div>
            <span>swissImmo</span>
        </a>
        <nav class="flex-1 px-4 space-y-1">
            <a href="/app/" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold fw-faint hover:fw-flaeche hover:text-white transition-all">
                <i class="fa-solid fa-grid-2 w-5 text-center"></i> Dashboard
            </a>
            <div class="pt-6 pb-2 px-4 text-[10px] font-bold uppercase tracking-widest fw-mutet">Portfolio</div>
            <a href="/app/?tab=portfolio" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold {% block nav_portfolio %}fw-faint hover:fw-flaeche hover:text-white{% endblock %} transition-all">
                <i class="fa-solid fa-city w-5 text-center"></i> Liegenschaften
            </a>
            <a href="/app/?tab=rentals" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold {% block nav_rentals %}fw-faint hover:fw-flaeche hover:text-white{% endblock %} transition-all">
                <i class="fa-solid fa-file-signature w-5 text-center"></i> Mietverträge
            </a>
            <a href="/app/?tab=crm" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold {% block nav_crm %}fw-faint hover:fw-flaeche hover:text-white{% endblock %} transition-all">
                <i class="fa-solid fa-users w-5 text-center"></i> Mieterstamm
            </a>
            <div class="pt-6 pb-2 px-4 text-[10px] font-bold uppercase tracking-widest fw-mutet">Betrieb</div>
            <a href="/app/?tab=finance" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold fw-faint hover:fw-flaeche hover:text-white transition-all">
                <i class="fa-solid fa-sack-dollar w-5 text-center"></i> Finanzen
            </a>
            <a href="/app/?tab=tickets" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold fw-faint hover:fw-flaeche hover:text-white transition-all">
                <i class="fa-solid fa-screwdriver-wrench w-5 text-center"></i> Tickets
            </a>
            <a href="/app/?tab=mietprozess" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold fw-faint hover:fw-flaeche hover:text-white transition-all">
                <i class="fa-solid fa-handshake w-5 text-center"></i> Vermietung
            </a>
        </nav>
    </aside>

    <!-- INHALT -->
    <div class="flex-1 min-w-0 flex flex-col">

        <!-- TOPBAR mit Breadcrumb -->
        <header class="h-16 px-6 md:px-10 flex items-center justify-between border-b fw-linie fw-flaeche sticky top-0 z-40">
            <nav class="flex items-center gap-2 text-sm min-w-0">
                <a href="/app/" class="fw-faint hover:fw-marke transition-colors md:hidden"><i class="fa-solid fa-arrow-left"></i></a>
                <a href="/app/" class="fw-faint hover:fw-marke transition-colors hidden md:inline">Übersicht</a>
                <i class="fa-solid fa-chevron-right text-[9px] fw-faint hidden md:inline"></i>
                {% block breadcrumb %}<span class="font-semibold fw-ink truncate">Dossier</span>{% endblock %}
            </nav>
            <div class="flex items-center gap-3">
                {% block topbar_actions %}{% endblock %}
            </div>
        </header>

        <main class="p-6 md:p-10 max-w-6xl w-full mx-auto space-y-6">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
</body>
</html>
