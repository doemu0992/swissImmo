name: CI

on:
  # Nur noch `main` — seit E4 ist das der Hauptzweig (vorher stand hier
  # zusätzlich "claude/**"). Arbeitszweige werden über `pull_request`
  # abgedeckt; beide Auslöser nebeneinander liessen jeden Push auf einen
  # Zweig mit offenem PR doppelt laufen.
  push:
    branches: [main]
  pull_request:

jobs:
  # Läuft in Sekunden statt Minuten und braucht weder Datenbank noch Django.
  # Bewusst ein eigener Job: So ist beim Blick auf den PR sofort erkennbar,
  # ob eine rote Ampel vom Linter oder von den Tests kommt.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Ruff installieren
        run: pip install ruff==0.15.8
      - name: Ruff
        run: ruff check . --output-format=github

  # Bekannte Schwachstellen in den gepinnten Abhängigkeiten (SICH-04). Rot wird der Job, wenn
  # eine Schwachstelle eine behobene Fassung hat — dann gibt es ein Update. Eine Ausnahme
  # braucht eine Begründung in pip-audit-ignore.txt (Auswertung: _tools/pip_audit_pruefen.py).
  # Braucht keine Systembibliotheken und keine Datenbank: pip-audit liest requirements.txt
  # und fragt die Schwachstellendatenbank ab, installiert wird nichts.
  #
  # Das Ergebnis ändert sich auch ohne Codeänderung (neue Meldungen): Der Job läuft bei jedem
  # Push und Pull Request; wer es wöchentlich will, ergänzt oben einen `schedule`-Auslöser.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit installieren
        run: pip install pip-audit==2.10.1
      - name: Abhängigkeiten gegen die Schwachstellendatenbank prüfen
        # `|| true`: pip-audit endet mit 1, sobald irgendetwas gefunden wird — auch eine
        # Schwachstelle ohne Fix-Version. Entschieden wird im nächsten Schritt.
        run: pip-audit -r requirements.txt --no-deps --disable-pip --format json --output pip-audit.json || true
      - name: Auswerten (Fix vorhanden = rot, Ausnahmen mit Begründung)
        run: python _tools/pip_audit_pruefen.py pip-audit.json pip-audit-ignore.txt
      - name: Bericht als Artefakt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip-audit.json
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Systembibliotheken für pycairo
        # pycairo hat keine fertigen Linux-Pakete und wird beim Installieren
        # gebaut — ohne Cairo-Entwicklungsdateien bricht `pip install` mit
        # «Dependency "cairo" not found» ab (seit dem Runner-Wechsel rot).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrationen vollständig?
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test --verbosity=2

  # Dieselbe Suite gegen PostgreSQL — die Zieldatenbank des Umzugs
  # (docs/UMZUG-POSTGRESQL.md). SQLite erzwingt weder Spaltenbreiten noch
  # strenge Typen; was hier rot wird, bliebe im Job `test` grün und fiele erst
  # in der Produktion auf. Probelauf vom 29.09.2026: 219 Migrationen und die
  # ganze Suite liefen durch.
  #
  # `CI_DATENBANK=postgres` ist die Gegenprobe zur Konfiguration:
  # core/tests/test_ci_datenbank.py verlangt dann eine echte
  # PostgreSQL-Verbindung. Ohne das liefe ein vertippter DB_-Name still auf
  # SQLite weiter — und der Job wäre grün, ohne etwas zu prüfen.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swissimmo
          POSTGRES_PASSWORD: swissimmo
          POSTGRES_DB: swissimmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_ENGINE: postgres
      DB_NAME: swissimmo
      DB_USER: swissimmo
      DB_PASSWORD: swissimmo
      DB_HOST: localhost
      DB_PORT: "5432"
      CI_DATENBANK: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Systembibliotheken für pycairo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Migrationen auf PostgreSQL
        run: python manage.py migrate --noinput
      - name: Tests auf PostgreSQL
        run: python manage.py test --noinput --parallel 4

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Systembibliotheken für pycairo
        # pycairo hat keine fertigen Linux-Pakete und wird beim Installieren
        # gebaut — ohne Cairo-Entwicklungsdateien bricht `pip install` mit
        # «Dependency "cairo" not found» ab (seit dem Runner-Wechsel rot).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - name: Python-Abhängigkeiten
        run: pip install -r requirements.txt
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: npm install
        run: npm install
      - name: Playwright-Browser (Chromium) installieren
        run: npx playwright install --with-deps chromium
      - name: E2E-Tests (Playwright bootet Django selbst)
        run: npx playwright test
      - name: Playwright-Report als Artefakt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
