name: CI

on:
  # Nur noch `main` — seit E4 ist das der Hauptzweig (vorher stand hier
  # zusätzlich "claude/**"). Arbeitszweige werden über `pull_request`
  # abgedeckt; beide Auslöser nebeneinander liessen jeden Push auf einen
  # Zweig mit offenem PR doppelt laufen.
  push:
    branches: [main]
  pull_request:

jobs:
  # Läuft in Sekunden statt Minuten und braucht weder Datenbank noch Django.
  # Bewusst ein eigener Job: So ist beim Blick auf den PR sofort erkennbar,
  # ob eine rote Ampel vom Linter oder von den Tests kommt.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Ruff installieren
        run: pip install ruff==0.15.8
      - name: Ruff
        run: ruff check . --output-format=github

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrationen vollständig?
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test --verbosity=2

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Python-Abhängigkeiten
        run: pip install -r requirements.txt
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: npm install
        run: npm install
      - name: Playwright-Browser (Chromium) installieren
        run: npx playwright install --with-deps chromium
      - name: E2E-Tests (Playwright bootet Django selbst)
        run: npx playwright test
      - name: Playwright-Report als Artefakt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
