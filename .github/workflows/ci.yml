name: CI

on:
  # Nur noch `main` — seit E4 ist das der Hauptzweig (vorher stand hier
  # zusätzlich "claude/**"). Arbeitszweige werden über `pull_request`
  # abgedeckt; beide Auslöser nebeneinander liessen jeden Push auf einen
  # Zweig mit offenem PR doppelt laufen.
  push:
    branches: [main]
  pull_request:
  # Wartungsläufe (SICH-28, SICH-45): Das Ergebnis dieser Prüfungen ändert sich auch ohne Codeänderung
  # (neue Schwachstellenmeldungen, ein Kalender, der weiterläuft). Sie gehören darum in einen Takt und
  # nicht in jeden Pull Request, wo ein roter Lauf ohne eigenes Zutun nur Ratlosigkeit schafft.
  schedule:
    # Montag 04:17 UTC: pip-audit und der LIK-Wächter (Job `wartung`).
    - cron: '17 4 * * 1'
    # Am 1. des Monats 03:43 UTC: zusätzlich die Suite mit verschobener Uhr (Job `zeitlauf`).
    - cron: '43 3 1 * *'
  workflow_dispatch:

# Standardrechte der Jobs auf Lesen beschränken; kein Job schreibt ins Repository.
permissions:
  contents: read

jobs:
  # Läuft in Sekunden statt Minuten und braucht weder Datenbank noch Django.
  # Bewusst ein eigener Job: So ist beim Blick auf den PR sofort erkennbar,
  # ob eine rote Ampel vom Linter oder von den Tests kommt.
  lint:
    # Runner festgelegt: `ubuntu-latest` ist inzwischen 26.04, und Playwright 1.56 unterstützt es nicht.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Ruff installieren
        run: pip install ruff==0.15.8
      - name: Ruff
        run: ruff check . --output-format=github

  # Bekannte Schwachstellen in den gepinnten Abhängigkeiten (SICH-04). Rot wird der Job, wenn
  # eine Schwachstelle eine behobene Fassung hat — dann gibt es ein Update. Eine Ausnahme
  # braucht eine Begründung in pip-audit-ignore.txt (Auswertung: _tools/pip_audit_pruefen.py).
  # Braucht keine Systembibliotheken und keine Datenbank: pip-audit liest requirements.txt
  # und fragt die Schwachstellendatenbank ab, installiert wird nichts.
  #
  # Das Ergebnis ändert sich auch ohne Codeänderung (neue Meldungen): Der Job läuft bei jedem
  # Push und Pull Request und zusätzlich jeden Montag (`schedule` oben). Wird er dort rot,
  # kommt die Benachrichtigung von GitHub, ohne dass jemand einen PR geöffnet hat.
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit installieren
        run: pip install pip-audit==2.10.1
      - name: Abhängigkeiten gegen die Schwachstellendatenbank prüfen
        # `|| true`: pip-audit endet mit 1, sobald irgendetwas gefunden wird — auch eine
        # Schwachstelle ohne Fix-Version. Entschieden wird im nächsten Schritt.
        run: pip-audit -r requirements.txt --no-deps --disable-pip --format json --output pip-audit.json || true
      - name: Auswerten (Fix vorhanden = rot, Ausnahmen mit Begründung)
        run: python _tools/pip_audit_pruefen.py pip-audit.json pip-audit-ignore.txt
      - name: Bericht als Artefakt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit
          path: pip-audit.json
          retention-days: 14

  test:
    # Runner festgelegt: `ubuntu-latest` ist inzwischen 26.04, und Playwright 1.56 unterstützt es nicht.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Systembibliotheken für pycairo
        # pycairo hat keine fertigen Linux-Pakete und wird beim Installieren
        # gebaut — ohne Cairo-Entwicklungsdateien bricht `pip install` mit
        # «Dependency "cairo" not found» ab (seit dem Runner-Wechsel rot).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrationen vollständig?
        run: python manage.py makemigrations --check --dry-run
      - name: Härtung der Produktionseinstellungen (check --deploy)
        # Jede Warnung muss mit Begründung in deploy-check-ignore.txt stehen (_tools/deploy_check_pruefen.py).
        # DEBUG=False schaltet die Produktions-Härtung der Einstellungen ein; der Schlüssel ist für diesen Lauf erzeugt.
        run: |
          export DEBUG=False IMAP_SCHLUESSEL="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python manage.py check --deploy 2>&1 | tee deploy-check.txt | python _tools/deploy_check_pruefen.py deploy-check-ignore.txt
      - name: Tests
        run: python manage.py test --verbosity=2

  # Dieselbe Suite gegen PostgreSQL — die Zieldatenbank des Umzugs
  # (docs/UMZUG-POSTGRESQL.md). SQLite erzwingt weder Spaltenbreiten noch
  # strenge Typen; was hier rot wird, bliebe im Job `test` grün und fiele erst
  # in der Produktion auf. Probelauf vom 29.09.2026: 219 Migrationen und die
  # ganze Suite liefen durch.
  #
  # `CI_DATENBANK=postgres` ist die Gegenprobe zur Konfiguration:
  # core/tests/test_ci_datenbank.py verlangt dann eine echte
  # PostgreSQL-Verbindung. Ohne das liefe ein vertippter DB_-Name still auf
  # SQLite weiter — und der Job wäre grün, ohne etwas zu prüfen.
  test-postgres:
    # Runner festgelegt: `ubuntu-latest` ist inzwischen 26.04, und Playwright 1.56 unterstützt es nicht.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swissimmo
          POSTGRES_PASSWORD: swissimmo
          POSTGRES_DB: swissimmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_ENGINE: postgres
      DB_NAME: swissimmo
      DB_USER: swissimmo
      DB_PASSWORD: swissimmo
      DB_HOST: localhost
      DB_PORT: "5432"
      CI_DATENBANK: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Systembibliotheken für pycairo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Migrationen auf PostgreSQL
        run: python manage.py migrate --noinput
      - name: Tests auf PostgreSQL
        run: python manage.py test --noinput --parallel 4

  e2e:
    # Runner festgelegt: `ubuntu-latest` ist inzwischen 26.04, und Playwright 1.56 unterstützt es nicht.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Systembibliotheken für pycairo
        # pycairo hat keine fertigen Linux-Pakete und wird beim Installieren
        # gebaut — ohne Cairo-Entwicklungsdateien bricht `pip install` mit
        # «Dependency "cairo" not found» ab (seit dem Runner-Wechsel rot).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - name: Python-Abhängigkeiten
        run: pip install -r requirements.txt
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: npm install
        run: npm install
      - name: Playwright-Browser (Chromium) installieren
        run: npx playwright install --with-deps chromium
      - name: E2E-Tests (Playwright bootet Django selbst)
        run: npx playwright test
      - name: Playwright-Report als Artefakt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Wöchentliche Wartung (Montag, Auslöser `schedule` oben; von Hand über «Run workflow»).
  # Prüft, was von der Uhr abhängt und darum nie in einen PR gehört: Die LIK-Tabelle in
  # core/services/lik.py wird von Hand nachgeführt und darf nicht mehr als drei Monate hinter
  # dem Kalender liegen (MIET-14). Rot heisst: Monatswerte des BFS nachtragen, nicht raten.
  wartung:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Systembibliotheken für pycairo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: LIK-Tabelle aktuell?
        env:
          ZEIT_WAECHTER: "1"
        run: python manage.py test core.tests.test_lik_tabelle --noinput --verbosity=2

  # Monatlicher Zeitlauf (SICH-45): die ganze Suite mit einer Uhr, die auf einen kritischen Tag
  # gestellt ist (_tools/uhr_schieber.c, Szenarien in _tools/zeitlauf_epoche.py). Findet Tests, die
  # nur an einem bestimmten Kalendertag stimmen: Jahreswechsel, 29. Februar, Sommerzeit, Monatsgrenze.
  # Rot heisst: ein Test (oder der Code) rechnet mit dem Datum von heute statt mit dem Tag, für den er
  # geschrieben ist. Kostet vier volle Suite-Läufe im Monat; deshalb nicht öfter.
  zeitlauf:
    if: github.event.schedule == '43 3 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        szenario: [jahreswechsel, neujahr, schaltag, sommernacht]
    steps:
      - uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Systembibliotheken für pycairo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Uhr-Schieber bauen
        run: gcc -shared -fPIC -O2 -o "$RUNNER_TEMP/uhr_schieber.so" _tools/uhr_schieber.c -ldl
      - name: Tests mit verschobener Uhr
        env:
          DEBUG: "False"
          SECURE_SSL_REDIRECT: "False"
        run: |
          export FAKE_START="$(python _tools/zeitlauf_epoche.py "${{ matrix.szenario }}")"
          echo "Szenario ${{ matrix.szenario }}: $(TZ=Europe/Zurich date -d "@$FAKE_START" '+%F %T %Z')"
          LD_PRELOAD="$RUNNER_TEMP/uhr_schieber.so" python manage.py test --noinput --parallel 4
