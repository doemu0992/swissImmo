<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  /* Farben sind Tokens (CSS-Variablen) — Tailwind liest sie hier nur ein.
     60-30-10: 60 % Navy-Flächen (bg, surface), 30 % Strukturblau (#35577D, Linien, aktive Zustände),
     10 % Akzent (hellblau #7FB0EA: Hauptknopf, Linie im Chart, Fokus). */
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        colors: {
          bg: 'var(--bg)', surface: 'var(--surface)', raised: 'var(--raised)',
          line: 'var(--line)', ink: 'var(--ink)', muted: 'var(--muted)', faint: 'var(--faint)',
          brand: 'var(--brand)', accent: 'var(--accent)', 'on-accent': 'var(--on-accent)',
          good: 'var(--good)', 'good-soft': 'var(--good-soft)', bad: 'var(--bad)', 'bad-soft': 'var(--bad-soft)',
          warn: 'var(--warn)', 'warn-soft': 'var(--warn-soft)'
        },
        boxShadow: {
          card: '0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -12px rgba(2,8,20,.6)',
          pop: '0 18px 50px -16px rgba(2,8,20,.75)'
        }
      }
    }
  }
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0c1424; --surface: #141e30; --raised: #1a2840;
    --line: #26344c; --ink: #e8eef7; --muted: #9db0c9; --faint: #7f93b0;
    --brand: #35577d; --accent: #7fb0ea; --on-accent: #0c1424;
    --good: #5fd39a; --good-soft: #12332a; --bad: #f58a93; --bad-soft: #3a1c22;
    --warn: #e8b25c; --warn-soft: #36290f;
  }
  html { background: var(--bg); }
  body {
    margin: 0; background-color: var(--bg); color: var(--ink);
    background-image:
      radial-gradient(900px 460px at 90% -140px, rgba(53,87,125,.40), transparent 70%),
      radial-gradient(700px 420px at 8% 4%, rgba(53,87,125,.20), transparent 70%);
    background-repeat: no-repeat; background-attachment: fixed;
    font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  .glass { background: rgba(20,30,48,.72); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .scroll-thin::-webkit-scrollbar { height: 6px; width: 6px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
</style>
</head>

function Icon({ name, className = 'w-5 h-5', strokeWidth = 1.8 }) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth}
         strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
      {ICONS[name]}
    </svg>
  );
}

/* Initialen-Avatar mit Verlauf — keine Fotos (Mieterdaten, DSG). */
const AVATAR_TONES = [
  ['#35577d', '#7fb0ea'], ['#2f6b5b', '#5fd39a'], ['#6b5530', '#e8b25c'], ['#5b3a52', '#e79bc4'],
];
function Avatar({ name, size = 'w-10 h-10', i = 0 }) {
  const [a, b] = AVATAR_TONES[i % AVATAR_TONES.length];
  const initials = name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase();
  return (
    <span className={`${size} shrink-0 rounded-full grid place-items-center text-xs font-bold text-white ring-2 ring-surface`}
          style={{ background: `linear-gradient(135deg, ${a}, ${b})` }} aria-hidden="true">{initials}</span>
  );
}

function Card({ className = '', children, ...rest }) {
  return <section className={`bg-surface border border-line rounded-2xl shadow-card ${className}`} {...rest}>{children}</section>;
}

function CardHeader({ title, subtitle, children }) {
  return (
    <header className="flex flex-wrap items-start justify-between gap-3 mb-5">
      <div className="min-w-0">
        <h2 className="text-base font-bold tracking-tight">{title}</h2>
        {subtitle && <p className="text-sm text-muted mt-0.5">{subtitle}</p>}
      </div>
      {children}
    </header>
  );
}

function Segmented({ options, value, onChange, label }) {
  return (
    <div role="tablist" aria-label={label} className="inline-flex p-1 rounded-xl bg-bg border border-line">
      {options.map(o => (
        <button key={o.id} role="tab" aria-selected={value === o.id} onClick={() => onChange(o.id)}
                className={`px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-colors ${value === o.id ? 'bg-brand text-white shadow' : 'text-muted hover:text-ink'}`}>
          {o.label}
        </button>
      ))}
    </div>
  );
}

function TrendBadge({ trend, unit, good }) {
  const up = trend > 0;
  const positive = (good === 'up') === up;       // grün, wenn die Richtung gut ist
  const abs = Math.abs(trend).toString().replace('.', ',');
  return (
    <span className={`inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-bold ${positive ? 'bg-good-soft text-good' : 'bg-bad-soft text-bad'}`}>
      <Icon name={up ? 'up' : 'down'} className="w-3 h-3" strokeWidth={2.6} />
      {up ? '+' : '−'}{abs}{unit.startsWith('%') ? ' %' : ''}
      <span className="sr-only">{positive ? ' (günstig)' : ' (ungünstig)'}</span>
    </span>
  );
}

function Sparkline({ data, positive }) {
  const w = 96, h = 32, min = Math.min(...data), max = Math.max(...data);
  const pts = data.map((v, i) => [i * (w / (data.length - 1)), h - 3 - ((v - min) / (max - min || 1)) * (h - 8)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const c = positive ? 'var(--good)' : 'var(--bad)';
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-24 h-8 overflow-visible" aria-hidden="true">
      <path d={d} fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="3" fill={c} />
    </svg>
  );
}

/* ---------- Dashboard-Karten ---------- */
function KpiCard({ k }) {
  const positive = (k.good === 'up') === (k.trend > 0);
  return (
    <Card className="p-5 sm:p-6 transition-transform duration-200 hover:-translate-y-0.5">
      <div className="flex items-center justify-between">
        <span className="w-11 h-11 rounded-xl grid place-items-center bg-raised text-accent"><Icon name={k.icon} /></span>
        <Sparkline data={k.spark} positive={positive} />

      <div className="mt-5 text-sm font-medium text-muted">{k.label}</div>
      <div className="mt-1 text-[28px] leading-tight font-extrabold tracking-tight num">{k.value}</div>
      <div className="mt-3 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-faint">
        <TrendBadge trend={k.trend} unit={k.unit} good={k.good} />
        <span>{k.unit.replace(/^% /, '').replace(/^ /, '')}</span>
      </div>
    </Card>
  );
}

function ChartCard() {
  const [mode, setMode] = useState('einnahmen');
  const canvas = useRef(null);
  const chart = useRef(null);
  const cfg = CHARTS[mode];

  useEffect(() => {
    const ctx = canvas.current.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 320);
    grad.addColorStop(0, 'rgba(127,176,234,.35)');
    grad.addColorStop(1, 'rgba(127,176,234,0)');
    Chart.defaults.font.family = '"Plus Jakarta Sans", system-ui, sans-serif';
    Chart.defaults.color = '#9db0c9';
    if (chart.current) chart.current.destroy();
    chart.current = new Chart(ctx, {
      type: 'line',
      data: {
        labels: MONATE,
        datasets: cfg.sets.map((s, i) => ({
          label: s.name, data: s.data, borderColor: s.color, borderWidth: i === 0 ? 3 : 2,
          borderDash: i === 0 ? [] : [6, 5], tension: 0.4, fill: s.fill, backgroundColor: s.fill ? grad : 'transparent',
          pointRadius: 0, pointHoverRadius: 6, pointHoverBackgroundColor: s.color, pointHoverBorderColor: '#141e30', pointHoverBorderWidth: 3,
        })),
      },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        scales: {
          x: { grid: { display: false }, border: { display: false }, ticks: { padding: 8 } },
          y: {
            grid: { color: 'rgba(157,176,201,.12)' }, border: { display: false }, ticks: { padding: 10, maxTicksLimit: 5,
              callback: v => mode === 'einnahmen' ? Math.round(v / 1000) + 'k' : v + ' %' },
            suggestedMin: mode === 'einnahmen' ? 420000 : 93, suggestedMax: mode === 'einnahmen' ? 490000 : 99,
          },
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1a2840', borderColor: '#35577d', borderWidth: 1, padding: 12, cornerRadius: 12,
            titleColor: '#e8eef7', bodyColor: '#e8eef7', boxPadding: 5, usePointStyle: true,
            callbacks: { label: c => ' ' + c.dataset.label + '  ' + cfg.fmt(c.parsed.y) },
          },
        },
      },
    });
    return () => chart.current && chart.current.destroy();
  }, [mode]);

  return (
    <Card className="p-5 sm:p-6">
      <CardHeader title={cfg.label} subtitle="Letzte 6 Monate · Mai – Oktober 2026">
        <Segmented label="Diagrammansicht" value={mode} onChange={setMode}
                   options={[{ id: 'einnahmen', label: 'Einnahmen' }, { id: 'belegung', label: 'Belegung' }]} />
      </CardHeader>
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 sm:gap-6 mb-6">
        {cfg.summary.map(s => (
          <div key={s.l} className="min-w-0">
            <div className="text-sm text-muted">{s.l}</div>
            <div className="flex items-baseline gap-2 flex-wrap">
              <span className="text-2xl font-extrabold tracking-tight num">{s.v}</span>
              <span className={`text-xs font-bold ${s.up ? 'text-good' : 'text-bad'}`}>{s.t}</span>
            </div>
          </div>
        ))}
      </div>
      <div className="flex items-center gap-5 mb-3 text-xs font-semibold text-muted">
        {cfg.sets.map((s, i) => (
          <span key={s.name} className="inline-flex items-center gap-2">
            <span className="w-4 h-0.5 rounded" style={{ background: s.color, opacity: i ? .8 : 1 }} />{s.name}
          </span>
        ))}
      </div>
      <div className="relative h-64 sm:h-72">
        <canvas ref={canvas} role="img" aria-label={`Liniendiagramm: ${cfg.label}, Mai bis Oktober 2026`} />
      </div>
    </Card>
  );
}

function AppointmentsCard() {
  const [tab, setTab] = useState('termine');
  const [todos, setTodos] = useState(TODOS);
  const toggle = id => setTodos(t => t.map(x => x.id === id ? { ...x, done: !x.done } : x));
  const offen = todos.filter(t => !t.done).length;
  const TONES = { accent: 'bg-raised text-accent', good: 'bg-good-soft text-good', warn: 'bg-warn-soft text-warn' };

  return (
    <Card className="p-5 sm:p-6 flex flex-col h-full">
      <CardHeader title="Termine & To-Dos" subtitle={tab === 'termine' ? `${TERMINE.length} Termine diese Woche` : `${offen} offen`}>
        <Segmented label="Ansicht" value={tab} onChange={setTab}
                   options={[{ id: 'termine', label: 'Termine' }, { id: 'todos', label: 'To-Dos' }]} />
      </CardHeader>

      {tab === 'termine' ? (
        <ul className="flex flex-col gap-2.5">
          {TERMINE.map((t, i) => (
            <li key={t.id} className="flex items-center gap-4 rounded-xl border border-line bg-bg p-3.5 hover:border-brand transition-colors">
              <Avatar name={t.wer} i={i} />
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-sm font-bold">{t.titel}</span>
                  <span className={`rounded-full px-2 py-0.5 text-[11px] font-bold ${TONES[t.ton]}`}>{t.art}</span>
                </div>
                <div className="text-xs text-muted mt-0.5 flex items-center gap-1 min-w-0">
                  <Icon name="pin" className="w-3.5 h-3.5 shrink-0" /><span className="truncate">{t.ort}</span>
                </div>
                <div className="text-xs text-faint mt-0.5 truncate">{t.wer}</div>
              </div>
              <div className="text-right shrink-0">
                <div className="text-sm font-bold num">{t.zeit.split(' · ')[1]}</div>
                <div className="text-xs text-faint">{t.zeit.split(' · ')[0]}</div>
              </div>
            </li>
          ))}
        </ul>
      ) : (
        <ul className="flex flex-col gap-2.5">
          {todos.map(t => (
            <li key={t.id}>
              <button onClick={() => toggle(t.id)} role="checkbox" aria-checked={t.done}
                      className="w-full flex items-center gap-4 rounded-xl border border-line bg-bg p-3.5 text-left hover:border-brand transition-colors">
                <span className={`w-6 h-6 shrink-0 rounded-lg border-2 grid place-items-center transition-colors ${t.done ? 'bg-accent border-accent text-on-accent' : 'border-line text-transparent'}`}>
                  <Icon name="check" className="w-3.5 h-3.5" strokeWidth={3} />
                </span>
                <span className="min-w-0 flex-1">
                  <span className={`block text-sm font-semibold ${t.done ? 'line-through text-faint' : ''}`}>{t.titel}</span>
                  <span className={`block text-xs mt-0.5 ${t.frist.includes('heute') && !t.done ? 'text-bad font-semibold' : 'text-muted'}`}>{t.frist}</span>
                </span>
              </button>
            </li>
          ))}
        </ul>
      )}

      <button className="mt-5 self-start inline-flex items-center gap-2 rounded-xl bg-accent text-on-accent px-4 h-11 text-sm font-bold shadow-card hover:brightness-110 transition">
        <Icon name="plus" className="w-4 h-4" strokeWidth={2.6} /> Termin planen
      </button>
    </Card>
  );
}

function OccupancyCard() {
  const canvas = useRef(null);
  const total = BELEGUNG.reduce((s, b) => s + b.value, 0);
  const quote = ((BELEGUNG[0].value + BELEGUNG[1].value) / total * 100).toFixed(1);

  useEffect(() => {
    const c = new Chart(canvas.current.getContext('2d'), {
      type: 'doughnut',
      data: { labels: BELEGUNG.map(b => b.label), datasets: [{ data: BELEGUNG.map(b => b.value), backgroundColor: BELEGUNG.map(b => b.color), borderColor: '#141e30', borderWidth: 4, borderRadius: 8, spacing: 2, hoverOffset: 6 }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '74%',
        plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1a2840', borderColor: '#35577d', borderWidth: 1, padding: 10, cornerRadius: 10, callbacks: { label: x => ` ${x.label}: ${x.parsed} Objekte` } } },
      },
    });
    return () => c.destroy();
  }, []);

  return (
    <Card className="p-5 sm:p-6 h-full">
      <CardHeader title="Belegungsstatus" subtitle={`${total} Mietobjekte im Bestand`} />
      <div className="grid grid-cols-1 sm:grid-cols-[12rem_minmax(0,1fr)] lg:grid-cols-1 2xl:grid-cols-[12rem_minmax(0,1fr)] items-center justify-items-center gap-6 sm:gap-8">
        <div className="relative w-48 h-48 shrink-0">
          <canvas ref={canvas} role="img" aria-label={`Donut-Diagramm: ${BELEGUNG.map(b => `${b.label} ${b.value}`).join(', ')}`} />
          <div className="absolute inset-0 grid place-items-center pointer-events-none text-center">
            <div>
              <div className="text-3xl font-extrabold tracking-tight num">{quote} %</div>
              <div className="text-xs text-muted font-medium">belegt</div>
            </div>
          </div>
        </div>
        <ul className="w-full min-w-0 flex flex-col gap-3">
          {BELEGUNG.map(b => (
            <li key={b.label} className="flex items-center gap-3 rounded-xl bg-bg border border-line px-3.5 py-3">
              <span className="w-3 h-3 rounded-full shrink-0" style={{ background: b.color }} />
              <span className="text-sm font-semibold flex-1">{b.label}</span>
              <span className="text-sm font-extrabold num">{b.value}</span>
              <span className="text-xs text-faint w-12 text-right num whitespace-nowrap">{(b.value / total * 100).toFixed(1)} %</span>
            </li>
          ))}
        </ul>
      </div>
    </Card>
  );
}

/* ---------- Seite ---------- */
function PageHeader() {
  return (
    <div className="flex flex-wrap items-end justify-between gap-4">
      <div>
        <div className="text-xs font-bold tracking-widest uppercase text-faint">Freitag, 23. Oktober 2026 · KW 43</div>
        <h1 className="mt-1 text-2xl sm:text-3xl font-extrabold tracking-tight">Guten Morgen, Dominik</h1>
        <p className="mt-1 text-sm text-muted">7 Forderungen sind überfällig, 3 Fristen laufen diese Woche ab.</p>
      </div>
      <div className="flex gap-2.5">
        <button className="h-11 px-4 rounded-xl border border-line bg-surface text-sm font-semibold hover:bg-raised transition-colors">Bericht exportieren</button>
        <button className="h-11 px-4 rounded-xl bg-accent text-on-accent text-sm font-bold shadow-card hover:brightness-110 transition inline-flex items-center gap-2">
          <Icon name="plus" className="w-4 h-4" strokeWidth={2.6} /> Neues Objekt
        </button>
      </div>
    </div>
  );
}

function App() {
  const [active, setActive] = useState('dashboard');
  return (
    <div className="min-h-screen">
      <Sidebar active={active} onSelect={setActive} />
      <div className="lg:pl-64 flex flex-col min-h-screen">
        <TopBar />
        <main className="flex-1 w-full max-w-[1480px] mx-auto px-4 sm:px-6 lg:px-8 pt-7 pb-32 lg:pb-12 flex flex-col gap-6 lg:gap-7">
          <PageHeader />
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 sm:gap-5 lg:gap-6">
            {KPIS.map(k => <KpiCard key={k.id} k={k} />)}
          </div>
          <ChartCard />
          <div className="grid grid-cols-1 lg:grid-cols-5 gap-6 lg:gap-7">
            <div className="lg:col-span-3 min-w-0"><AppointmentsCard /></div>
            <div className="lg:col-span-2 min-w-0"><OccupancyCard /></div>
          </div>
        </main>
      </div>
      <BottomNav active={active} onSelect={setActive} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
